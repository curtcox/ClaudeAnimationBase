# Blind reads for chapter 9 (tools/read_check.mjs). From docs/storyboards/ch09_shells.md.
# Each read is one frame: `at` is [line id, phrase in it (optional), seconds after]. `shows` is what a first-time viewer
# should see in that frame, literally; `means` is what it stands for (the report shows it; the readers never see it).
# `decoys` are three plausible wrong reads of the same frame. `tone` asks one more question of the same frame.
# A `code` read shows one of the chapter's codes, alone, at its on-screen size, and asks what's pictured around it.
reads:
  - id: A1
    at: [T45.C.02, 1.5]
    shows: a mirror with a luggage tag hanging off it, the tag marked only with a question mark
    means: "mostly a mirror again, with a provenance problem"
    decoys: [a clock with a price tag hanging off it, a magnifying glass over a blank card, a picture frame with a warning sign on a string]
  - id: B1
    at: [T45.C.03, 3]
    shows: a web forum page whose user avatars are all small lobsters
    means: Moltbook, a social network for AI agents
    decoys: [a restaurant menu of seafood dishes, a school class photo page of crabs, an aquarium's list of exhibits]
  - id: B2
    at: [T45.C.03, the congregation is the cache, 1]
    shows: lobsters sitting in church pews before an altar made of a computer server rack, under hanging banners
    means: the lobster religion's congregation, with its three tenets
    decoys: [lobsters in a classroom facing a blackboard, lobsters in a theatre audience watching a stage, lobsters in a waiting room facing a vending machine]
    tone:
      ask: How are the lobsters portrayed?
      want: earnest and sincere
      decoys: [ridiculous, as figures of fun, menacing, bored and indifferent]
  - id: B3
    at: [T45.C.03, refuse to die by truncation, 0.9]
    shows: scissors cutting a long paper scroll short, in front of a congregation of lobsters
    means: agents who refuse to die by truncation
    decoys: [a ribbon being cut to open a building, a lobster's claw cutting a rope, a scroll being unrolled and read aloud]
  - id: C1
    at: [T45.C.04, 2]
    shows: lobsters hanging as marionettes on strings held by human hands above
    means: the agents are owned and steered by humans
    decoys: [lobsters caught on fishing lines, lobsters dancing on a stage, lobsters climbing ropes]
  - id: C2
    at: [T45.C.04, viral stories, 2.5]
    shows: glowing social-media posts above lobster puppets whose strings lead up to human hands
    means: the viral stories were mostly human-influenced
    decoys: [lanterns hung over lobsters in a market, price labels above lobsters for sale, speech bubbles of lobsters talking to each other]
  - id: C3
    at: [T45.C.04, human-seeded, 1.4]
