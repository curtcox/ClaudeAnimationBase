# Blind reads for chapter 9 (tools/read_check.mjs). From docs/storyboards/ch09_shells.md.
# Each read is one frame: `at` is [line id, phrase in it (optional), seconds after]. `shows` is what a first-time viewer
# should see in that frame, literally; `means` is what it stands for (the report shows it; the readers never see it).
# `answer` is `shows` reworded to the decoys' length and style for the multiple choice (else `shows` is used), so the
# right option doesn't stand out by being longer or more specific.
# `decoys` are three near misses: the same setting and the same things in view, with the one element the shot has to
# get across (the action, or what an object is) changed, so the right answer can't be found by ruling out the setting.
# `tone` asks one more question of the same frame. A `code` read shows one of the chapter's codes, alone, at its
# on-screen size, and asks what's pictured beside it.
reads:
  - id: A1
