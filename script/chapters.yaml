# Chapters: which transcript blocks each chapter carries. Hand-edited.
# Chapters are construction units (a scene file and a render each), sized at roughly 2-7 min; they're joined into
# one film at the end, so a split here is invisible to the viewer except as a YouTube chapter marker.
#   ids:   explicit block ids (claimed first)
#   turns: [first, last] turn numbers, inclusive (every block not already claimed)
#   hold_s: extra visual-only time the chapter needs beyond its lines (title cards, the QR wall, ...)
- n: 0
  slug: cold_open
  title: Cold open
  ids: [T01.U.00]          # the MAD #157 page, balloons painted (not voiced), before the first question
  hold_s: 53               # the comic read balloon by balloon (all ten, in full), its code (>= 6 s beside the page), the title card
