# Sound effects: every cue in the film. Hand-edited; checked by tools/sfx_check.mjs (npm run sfx), which finds each
# cue's time in its chapter and writes the cue sheet, script/sfx_report.md. The sounds themselves come later, from
# ElevenLabs' sound-effects endpoint (VIDEO_PLAN.md §2, Sound design); the prompt is what it's asked for.
#
#   id      stable key
#   ch      chapter
#   at      when it starts, as the read keys (docs/reads) give moments: [line id], [line id, seconds after], or
#           [line id, "a phrase in the line", seconds after]; the phrase "@end" means the line's end
#   until   (ambience) when it fades out, in the same form. Otherwise len, in seconds
#   kind    sting (lands a joke or a turn) | effect (a prop's own sound) | ambience (a quiet bed under a stretch)
#   gain    dB, relative to the voice (sting about −10, effect −16 to −24, ambience −26 to −32)
#   prompt  what the sound should be. Borrowed sounds are evoked, never copied: no show's actual theme or recording
#   why     what it's for
#
# Two recurring cues aren't listed one by one: `every` gives a sound for each moment of a kind.

every:
  - { id: qr-flick, when: qr, kind: effect, gain: -30, len: .4, prompt: "a single soft paper flick, a card set down on a desk", why: "each code's arrival; quiet, since codes are frequent" }
  - { id: search-rustle, when: tool, kind: effect, gain: -24, len: 1.5, prompt: "pages of a book riffled quickly, then settling", why: "each search beat (Searched the web)" }

