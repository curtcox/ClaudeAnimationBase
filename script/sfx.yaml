# Sound effects: every cue in the film. Hand-edited; checked by tools/sfx_check.mjs (npm run sfx), which finds each
# cue's time in its chapter and writes the cue sheet, script/sfx_report.md. The sounds themselves come later, from
# ElevenLabs' sound-effects endpoint (VIDEO_PLAN.md §2, Sound design); the prompt is what it's asked for.
#
#   id      stable key
#   ch      chapter
#   at      when it starts, as the read keys (docs/reads) give moments: [line id], [line id, seconds after], or
#           [line id, "a phrase in the line", seconds after]; the phrase "@end" means the line's end
#   until   (ambience) when it fades out, in the same form. Otherwise len, in seconds
#   kind    sting (lands a joke or a turn) | effect (a prop's own sound) | ambience (a quiet bed under a stretch) |
#           music (a phrase of music, made with ElevenLabs' music endpoint)
#   gain    dB against the voice, as tools/sfx.mjs mixes it: a one-shot's loudest moment against the voice's loudest
#           moments, a bed's (ambience, music over 6 s) level against the voice's. About: a sting −10 to −14; a sound
#           that carries the idea −12 to −18; a prop −18 to −22; the frequent code flick −26; a bed −24 to −28. Music
#           where no one speaks can come up (the end theme, −10). script/sfx_levels.md checks each one as mixed
#   prompt  what the sound should be. Borrowed sounds are evoked, never copied: no show's actual theme or recording
#   why     what it's for
#
#   proposed  true: suggested, to be heard and agreed before it's final (http://localhost:8077/sounds/ plays each one)
#
# Recurring cues aren't listed one by one: `every` gives a sound for each moment of a kind (when: qr, tool or chapter).
# Music is short and never a bed under the voice: a chapter motif, a few cues that are music by nature, the end.

every:
  - { id: qr-flick, when: qr, kind: effect, gain: -26, len: .4, prompt: "a single soft paper flick, a card set down on a desk", why: "each code's arrival; quiet, since codes are frequent" }
  - { id: chapter-motif, when: chapter, kind: music, gain: -16, len: 3, prompt: "a short, bright four-note marimba motif over a soft pizzicato bass, like turning to a new page; playful and curious", why: "each chapter's first moment: the same few notes, so a new chapter is heard as well as seen" }
  - { id: search-rustle, when: tool, kind: effect, gain: -20, len: 1.5, prompt: "pages of a book riffled quickly, then settling", why: "each search beat (Searched the web)" }

