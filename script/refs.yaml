# Every link the film shows as a QR code. Hand-edited; checked by tools/check_refs.mjs (→ script/refs_report.md).
#
#   id      stable key (QR styles, scenes and the companion page refer to it)
#   url     what the code encodes: direct, unless check_refs says it's too dense to scan at its size
#   caption the short painted label under the code (1–5 words)
#   origin  transcript  the link is in the conversation: the voice says its title while the code is up
#           attachment  the source of an image Curt attached: code only, never voiced
#           added       a reference added for the viewer: code only, never voiced
#   at      the script line the code appears under: a line id, or a phrase (the first spoken line in `ch` containing it)
#   ch      chapter (needed when `at` is a phrase)
#   mode    feature (big card, >= 6 s hold) | shelf (corner tag, >= 5 s)
#   style   QR dressing, see VIDEO_PLAN.md §4 (implemented in src/qr.js)
#   qr_url  what the code encodes when it differs from url: the site's own short form, or SHORT (needs a 256t short
#           link; domain to be decided)
#   also    other transcript URLs this code stands for (the same page linked twice)
#   ecc     error-correction level, when the mode's default (feature H, shelf M) doesn't scan reliably for this URL
#   verified how a bot-walled page was confirmed by hand (the checker can't fetch it)
#   todo    anything still unresolved about this reference

