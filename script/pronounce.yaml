# Speech-only respellings, applied in order to every spoken line (after markdown is stripped).
# They change what the voice says, never what the transcript says: the written form is what gets painted.
# Matches are literal; letters/digits at either end of a match must sit on a word boundary.
# verify: true = a guess to check by ear (or against a recording of the name) during voice casting.

# --- symbols and formulas -------------------------------------------------------------------------
- { match: "[Xe] 4f⁷ 5d¹ 6s²", say: "xenon core, four-f seven, five-d one, six-s two" }
- { match: "4f⁸ 6s²", say: "four-f eight, six-s two" }
- { match: "4f subshell", say: "four-f subshell" }
- { match: "into 5d", say: "into five-d" }
- { match: "t ≈ (1/λ)·ln(Δ/δ)", say: "t is about one over lambda, times the log of big delta over little delta" }
- { match: "C^(−α) with α", say: "C to the minus alpha, with alpha" }
- { match: "(ops ≤ 2E/πħ per second)", say: "(operations at most two E over pi h-bar, per second)" }
- { match: "P≠NP", say: "P isn't N P" }
- { match: "AIDE²", say: "AIDE squared", verify: true }
- { match: "2×2", say: "two-by-two" }
- { match: "0–100", say: "zero to a hundred" }
- { match: "5–10%", say: "five to ten percent" }
- { match: "25–35%", say: "twenty-five to thirty-five percent" }
- { match: "2026–2030", say: "twenty twenty-six to twenty thirty" }
- { match: "→", say: "to" }                    # the one-line ranking (T35); T58 has an override

