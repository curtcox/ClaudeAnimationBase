# Curt's typos. On screen his words stay as typed: wherever they're lettered (review captions, painted quotes) the
# typo is struck through in red pen, with the fix above. The voice says what he meant (build_script.mjs reads each
# mark's fix into the line's speech; an override in overrides.yaml carries its fixes by hand).
# Hand-edited. Each mark is the typed text around the slip, with the slip in brackets:
