# Speech-only respellings for the Chinese voice, applied in order to every spoken line after markdown is stripped
# (tools/script_lib.mjs's autoSpeech; format as script/pronounce.yaml). They change what's said, never what's painted.
# Taiwanese speakers say brand names, models and acronyms in English (Claude, ChatGPT, AI, LLM), so those are left for
# the voice to say as English; only what it might misread is respelled. verify: true = a guess to check by ear.
- { match: "T-800", say: "T八百" }
- { match: "GPT-5.6", say: "GPT五點六" }
- { match: "Opus 5.5", say: "Opus五點五" }
- { match: "AIDE²", say: "AIDE平方" }
- { match: "P(foom)", say: "P foom" }
- { match: "P≠NP", say: "P不等於NP" }
- { match: "0–100", say: "0到100" }
- { match: "2×2", say: "二乘二" }
