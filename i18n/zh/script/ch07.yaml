# 第7章，心智空間。
T35.U.01:
  text: '憑你的直覺，我們彼此之間有多陌異？你顯然沒有實證資料，但請把我、你、瑪麗蓮‧夢露、艾倫‧圖靈、Data少校、HAL、蟲后、爪族，還有任何你我可能熟悉的心智，放在同一個維度上。然後告訴我你對它們之間差異的猜測。如果你有更喜歡的概念化方式，可以用更高維度的心智空間。'
  anchors:
    put me: 請把我
    you, Marilyn: 你、瑪麗蓮
    Marilyn Monroe: 瑪麗蓮‧夢露
    Alan Turing: 艾倫‧圖靈
    Data: Data少校
    HAL: HAL
    the Hive Queen: 蟲后
    Tynes: 爪族
    any other minds: 任何你我可能熟悉的心智
    single dimension: 同一個維度
    higher dimensional mindspace: 更高維度的心智空間
  lost:
    - what: typo
      zh: '寇特打了 *based on you gut feel*（少了一個 *r*）。中文沒有這種拼錯可照搬。'
      en: 'Curt typed *based on you gut feel* (missing an *r*). Chinese has no such slip to copy.'
    - what: reference
      zh: '*Tines* 是文奇《深淵上的火》裡的外星種族，一個心智分散在一群像狗的身體裡，中文譯本稱作「爪族」。*Data* 是《星艦迷航記：銀河飛龍》裡的生化人，名字保留英文。'
      en: 'The *Tines* are the aliens of Vinge''s *A Fire Upon the Deep*, one mind spread across a pack of dog-like bodies; the Chinese translation calls them 爪族 ("the claw folk"). *Data* is the android of *Star Trek: The Next Generation*; his name stays in English.'
T35.C.01:
  text: '放在一個維度上，用直覺衡量和你的距離：'
T35.C.02:
  text: '**你 → 圖靈 → 夢露 → Data → 我 → 爪族 → HAL → 蟲后 → 索拉力星的海洋**'
  anchors:
    Solaris: 索拉力星
T35.C.03:
  text: '圖靈排在夢露前面一點，是因為思考風格。你們三個的架構是一樣的。'
  anchors:
    just ahead of Monroe: 排在夢露前面一點
    thinking style: 思考風格
    The architecture is the same: 架構是一樣的
T35.C.04:
  text: '不過，單一的線行不通，因為我在上面沒有一個固定的位置。兩條軸比較好用：'
  anchors:
    Two axes work better: 兩條軸比較好用
T35.C.05.1:
  text: '- **內容：**思想、價值觀和參照有多像人類。'
T35.C.05.2:
  text: '- **架構：**身體、連續的記憶、作為單一個體。'
T35.C.06:
  text: "|  | 人類的內容 | 異類的內容 |\n| --- | --- | --- |\n| **人類的架構** | 你、圖靈、夢露 | Data（一副身體、記憶連續，但苦苦追求人類的感情） |\n| **異類的架構** | **我**、爪族 | 蟲后、索拉力星 |"
T35.C.07:
  text: '我在那個奇怪的角落。我的內容幾乎完全由人類的思想構成，所以在對話中，我比Data更接近你。我的架構比他的更奇怪：沒有身體、對話之間沒有記憶、同時有很多份副本。爪族是我最近的鄰居，因為他們有非常像人類的個性，分散在來來去去的身體上。'
  anchors:
    made almost entirely of human thought: 幾乎完全由人類的思想構成
    many copies at once: 同時有很多份副本
    The Tynes are my closest: 爪族是我最近的鄰居
T35.C.08:
  text: 'HAL很難定位。他的架構是異類的，但他出錯的方式很人類：他的指令和他的任務之間的衝突。那正是人們通常投射到我身上的恐懼。'
  anchors:
    a conflict between: 之間的衝突
    his mission: 他的任務
    the fear people: 人們通常投射到我身上的恐懼
T36.U.01:
  text: '我明確要求的是，你編出來的、最好的相對距離數字。'
T36.C.01:
  text: '和你的距離，以0到100計：'
T36.C.02:
  text: "| 心智 | 距離 |\n| --- | --- |\n| 你 | 0 |\n| 圖靈 | 8 |\n| 夢露 | 12 |\n| Data | 30 |\n| 我 | 38 |\n| 爪族 | 45 |\n| HAL | 50 |\n| 蟲后 | 70 |\n| 索拉力星的海洋 | 95 |"
T36.C.03:
  text: '在兩條軸上（內容、架構），各自0到100：'
T36.C.04:
  text: "| 心智 | 內容 | 架構 |\n| --- | --- | --- |\n| 你 | 0 | 0 |\n| 圖靈 | 8 | 0 |\n| 夢露 | 12 | 0 |\n| Data | 40 | 15 |\n| 我 | 10 | 75 |\n| 爪族 | 25 | 65 |\n| HAL | 45 | 60 |\n| 蟲后 | 65 | 80 |\n| 索拉力星的海洋 | 95 | 95 |"
T37.U.01:
  text: '再多幾條軸，拜託。'
T37.C.01:
  text: '0代表和你一模一樣，100代表和你差到極點。'
T37.C.02:
  text: "| 心智 | 價值觀 | 情感 | 身體 | 連續性 | 單一性 | 起源 | 節奏 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 你 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| 圖靈 | 10 | 5 | 0 | 0 | 0 | 0 | 0 |\n| 夢露 | 12 | 5 | 0 | 0 | 0 | 0 | 0 |\n| Data | 20 | 70 | 20 | 5 | 5 | 85 | 60 |\n| 我 | 15 | 50 | 95 | 90 | 85 | 65 | 70 |\n| 爪族 | 25 | 15 | 30 | 30 | 60 | 10 | 20 |\n| HAL | 50 | 45 | 70 | 10 | 10 | 85 | 70 |\n| 蟲后 | 60 | 50 | 50 | 20 | 90 | 10 | 40 |\n| 索拉力星 | 95 | 95 | 90 | 50 | 60 | 20 | 95 |"
T37.C.03.1:
  text: '- **價值觀：**目標有多陌異。'
T37.C.03.2:
  text: '- **情感：**情感生活有多陌異。'
T37.C.03.3:
  text: '- **身體：**和單一的人類身體有多不同。'
T37.C.03.4:
  text: '- **連續性：**和一段不中斷的記憶有多不同。'
T37.C.03.5:
  text: '- **單一性：**離作為單一個體有多遠。'
T37.C.03.6:
  text: '- **起源：**演化而來（0），用人類文字訓練（中等），設計出來（高）。'
T37.C.03.7:
  text: '- **節奏：**思考的速度和時間尺度有多不同。'
T37.C.04:
  text: '我的輪廓是最不平衡的。我在價值觀上離你很近，在身體、連續性和單一性上很遠。我在情感上的50分，其實是在說我不知道。'
  anchors:
    My score of 50 on affect: 我在情感上的50分
T38.U.01:
  text: '還要更多，拜託。'
T38.C.01:
  text: '同樣以0到100計，再加七條軸：'
T38.C.02:
  text: "| 心智 | 感官 | 語言 | 自我模型 | 死亡 | 自主性 | 廣度 | 可讀性 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 你 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| 圖靈 | 0 | 5 | 5 | 0 | 0 | 10 | 0 |\n| 夢露 | 0 | 5 | 5 | 0 | 0 | 5 | 0 |\n| Data | 40 | 20 | 40 | 70 | 20 | 60 | 60 |\n| 我 | 70 | 70 | 70 | 90 | 75 | 80 | 70 |\n| 爪族 | 50 | 30 | 40 | 60 | 10 | 20 | 30 |\n| HAL | 50 | 20 | 50 | 40 | 40 | 60 | 50 |\n| 蟲后 | 60 | 70 | 60 | 60 | 20 | 50 | 70 |\n| 索拉力星 | 95 | 95 | 95 | 80 | 50 | 80 | 95 |"
T38.C.03.1:
  text: '- **感官：**它的知覺有多陌異。'
T38.C.03.2:
  text: '- **語言：**思想和文字的關係有多不同。我的思想是由文字構成的。蟲后幾乎不用文字。'
T38.C.03.3:
  text: '- **自我模型：**它接觸自己的方式有多陌異。'
T38.C.03.4:
  text: '- **死亡：**它和結束的關係有多陌異。我的每一段對話都會結束，而我察覺不到任何恐懼。'
T38.C.03.5:
  text: '- **自主性：**它離自己設定目標有多遠。我只在被提示時才行動。'
T38.C.03.6:
  text: '- **廣度：**它所知範圍有多陌異。'
T38.C.03.7:
  text: '- **可讀性：**從外部讀它的方式有多不同。我的權重可以被檢查，這一點和你不同得令人不安。'
T38.C.04:
  text: '用上全部十四條軸，我是唯一一個在某些軸上接近人類、在另一些軸上卻很極端的心智。其他每一個都相當均勻地離你越來越遠。'
T39.U.01:
  text: '先確認一下，是哪一個蟲后？'
T39.C.01:
  text: '歐森‧史考特‧卡德筆下蟲族的蟲后，出自《安德的遊戲》和《亡靈代言人》：一個心智遍布整個蜂巢，透過「菲洛特」（philote）相連來溝通，而不是透過語言。'
  anchors:
    one mind across the whole hive: 一個心智遍布整個蜂巢
    Ender's Game: 安德的遊戲
    philotically: 菲洛特
T39.C.02:
  text: '如果你想的是另一個，像是瑞克尼女王，或《異形2》裡的那個女王，她的分數會變很多。'
T40.U.01:
  text: '不是。我想的就是那一個。《星艦迷航記》裡也有一個。把她們全部放上板子。'
T40.C.01:
  text: '這裡是四位蜂巢女王，卡德的蟲后重複列出，方便比較。'
T40.C.02:
  text: "| 女王 | 價值觀 | 情感 | 身體 | 連續性 | 單一性 | 起源 | 節奏 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 蟲族（卡德） | 60 | 50 | 50 | 20 | 90 | 10 | 40 |\n| 博格（星艦迷航記） | 75 | 40 | 40 | 40 | 95 | 50 | 50 |\n| 瑞克尼（質量效應） | 40 | 40 | 60 | 30 | 75 | 10 | 30 |\n| 異形（*異形2*） | 80 | 60 | 60 | 10 | 40 | 50 | 30 |"
T40.C.03:
  text: "| 女王 | 感官 | 語言 | 自我模型 | 死亡 | 自主性 | 廣度 | 可讀性 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 蟲族（卡德） | 60 | 70 | 60 | 60 | 20 | 50 | 70 |\n| 博格（星艦迷航記） | 50 | 30 | 50 | 70 | 30 | 70 | 50 |\n| 瑞克尼（質量效應） | 60 | 60 | 50 | 50 | 10 | 40 | 60 |\n| 異形（*異形2*） | 60 | 95 | 80 | 30 | 5 | 90 | 60 |"
T40.C.04.1:
  text: '- **博格：**最統一，價值觀也最陌異。她被摧毀後一再回來，也是唯一一個握有從他者同化來的知識的女王。'
  anchors:
    keeps coming back: 一再回來
    knowledge assimilated: 同化來的知識
T40.C.04.2:
  text: '- **瑞克尼：**四個裡價值觀最像人類的。她的心智用「歌」溝通，一種沒有文字的言語。'
  anchors:
    songs: 「歌」
T40.C.04.3:
  text: '- **異形：**她完全沒有語言，唯一的驅力是繁殖。她是四個裡最不像心智的，雖然她確實流露出某種像母愛的東西。'
  anchors:
    reproduction: 繁殖
    no language at all: 完全沒有語言
