chapters: 章節
index_notes: >-
  <p class="note">解說是影片裡的AI，Claude，為這個網站寫的，並和它們連結的資料來源核對過。大多數資料來源是英文的。影片完成之前，時間點可能會稍有移動。</p>
  <p class="note">這部影片的每一個畫面，都是Claude用程式碼畫的。寇特打底的程式碼，來自用同樣方式做的上一部影片<a href="https://curtcox.github.io/PDoomVideo/">I'm Upping My P(doom)</a>（它的解說網站，英文）。</p>
  <p class="note">這個網站為什麼叫<em>axol-f</em>？六角恐龍的英文是axolotl，和<a href="https://www.youtube.com/watch?v=k85mRPqvMbE">Crazy Frog的〈Axel F〉</a>只差一個字母：青蛙還是六角恐龍。</p>
