film_title: 青蛙還是六角恐龍
index_title: 青蛙還是六角恐龍：連結
explained: 解說
index_intro: >-
  <p>一部動畫影片，取材自寇特和AI程式Claude在一個星期六早上的長談。對話在科幻、哲學和AI的最新消息之間跳來跳去，所以充滿了大多數人不熟悉的東西。</p><p>它們全都在這裡，按章節、依序排列。光有一個連結不夠的地方，就有一篇簡短、淺白的解說。<strong>黃色的是解說。</strong>如果影片裡有什麼讓你一頭霧水，從那裡開始。</p>
  <p class="note">這是繁體中文版。影片和這個網站由Claude翻譯，刻意不經人工審校：<a href="fanyi/">怎麼翻譯的，又失去了什麼</a>。英文原版網站在<a href="../">curtcox.github.io/axol-f</a>。</p>
watch_film: ▶ 看影片
watch_film_after: '（連結隨著影片出現）。'
on_its_way: >-
  影片快來了。連結和解說都已經在這裡。等不及了？整部影片是用程式碼做的，所以你可以自己把它做出來：<a href="{repo}">取得程式碼</a>，然後執行<code>npm start</code>。
