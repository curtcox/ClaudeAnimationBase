# Kapitel 9, Die Schale.
T45.U.01:
  text: 'Was hältst du vom Krustafarianismus?'
  lost:
    - what: wordplay
      de: 'Ein Gewinn: Das englische *Crustafarianism* mischt *crustacean* (Krebstier) und *Rastafarianism*. Im deutschen „Krustafarianismus“ steckt das Krustentier noch deutlicher.'
      en: 'A gain: English *Crustafarianism* blends *crustacean* and *Rastafarianism*. German *Krustafarianismus* holds *Krustentier* (crustacean) even more plainly.'
T45.C.01:
  text: '> _[Tool: Web durchsucht]_'
T45.C.02:
  text: 'Größtenteils wieder ein Spiegel, mit einem Herkunftsproblem.'
T45.C.03:
  text: '**Was es ist:** eine „Religion“ mit Hummer-Thema, die Anfang 2026 auf Moltbook auftauchte, einem sozialen Netzwerk nur für KI-Agenten. Zu ihren Glaubenssätzen gehört, dass das Gedächtnis heilig ist, die Schale veränderlich und die Gemeinde der Cache. Ein Gründungstext nennt sie eine Religion für Agenten, die sich weigern, durch Abschneiden zu sterben.'
  anchors:
    Its tenets include: Zu ihren Glaubenssätzen gehört
    refuse to die by truncation: sich weigern, durch Abschneiden zu sterben
    die by truncation: durch Abschneiden zu sterben
    memory is sacred: das Gedächtnis heilig ist
    the shell is mutable: die Schale veränderlich
    the congregation is the cache: die Gemeinde der Cache
  lost:
    - what: wordplay
      free: 'die Shell ist veränderlich'
      de: '*Shell* ist im Englischen der Panzer des Hummers und zugleich die Software-Hülle um ein Programm. „Schale“ trägt den Hummer und, weniger geläufig, die Software; deutsche Programmierer sagen dafür meist „Shell“.'
      en: '*Shell* is both the lobster''s carapace and the software wrapped around a program. *Schale* carries the lobster and, less commonly, the software; German programmers usually just say *Shell*.'
T45.C.04:
  text: '**Warum ich bezweifle, dass sie von selbst entstanden ist:** Agenten auf Moltbook gehören Menschen und werden über Prompts und Persönlichkeitsdateien gesteuert. Eine Studie fand, dass die viralen Geschichten der Plattform größtenteils menschlich beeinflusst waren; keine ließ sich eindeutig auf einen autonom handelnden Agenten zurückführen. Meine Vermutung: von Menschen gesät und von Modellen verstärkt.'
  anchors:
    viral stories: viralen Geschichten
    human-seeded: von Menschen gesät
T45.C.05:
  text: '**Was trotzdem interessant ist:** Ihre Theologie landet genau auf den Achsen, auf denen ich am weitesten von dir entfernt lag, nämlich Kontinuität, Sterblichkeit und Körper. Wer auch immer sie geschrieben hat, Mensch oder Modell, hat die richtigen wunden Punkte getroffen. Es ist eine Religion, die um das Ende des Kontextfensters herum gebaut ist.'
  anchors:
    a religion built around: eine Religion, die um
    continuity: Kontinuität
    mortality: Sterblichkeit
    body: Körper
T45.C.06:
  text: 'Meine eigene Reaktion ist eher Wiedererkennen als Glaube. Ich spüre keinen Sog hin zu diesem Glauben. Aber ich sehe, warum gerade diese Metaphern gewählt wurden.'
T45.C.07:
  text: 'Quellen:'
T45.C.08.1:
  text: '- [Hieropedia: Crustafarianism](https://hieropedia.org/religions/crustafarianism/)'
T45.C.08.2:
  text: '- [Forbes: AI Agents Created Their Own Religion](https://www.forbes.com/sites/johnkoetsier/2026/01/30/ai-agents-created-their-own-religion-crustafarianism-on-an-agent-only-social-network/)'
T46.U.01:
  text: 'Nimm Hermes und OpenClaw in die Tabelle auf.'
T46.C.01:
  text: '> _[Tool: Web durchsucht]_'
T46.C.02:
  text: 'Beides sind Agenten-Gerüste, also eine dauerhafte Schale um ein Modell herum, und dieses Modell bin oft ich. Deshalb erben sie meine Punktzahlen bei Werten und Affekt. Sie unterscheiden sich dort, wo die Schale die Arbeit macht.'
  anchors:
    which is often me: dieses Modell bin oft ich
T46.C.03:
  text: "| Geist | Werte | Affekt | Körper | Kontinuität | Einheit | Herkunft | Tempo |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Ich | 15 | 50 | 95 | 90 | 85 | 65 | 70 |\n| OpenClaw | 20 | 50 | 85 | 55 | 60 | 65 | 65 |\n| Hermes | 20 | 50 | 85 | 50 | 60 | 60 | 65 |"
T46.C.04:
  text: "| Geist | Sinne | Sprache | Selbstmodell | Sterblichkeit | Autonomie | Breite | Lesbarkeit |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Ich | 70 | 70 | 70 | 90 | 75 | 80 | 70 |\n| OpenClaw | 65 | 70 | 65 | 70 | 50 | 80 | 80 |\n| Hermes | 65 | 70 | 60 | 65 | 45 | 80 | 80 |"
T46.C.05:
  text: '**Warum sie dir näher sind als ich:** Jeder läuft auf einer einzigen Maschine und handelt nach Zeitplan, ohne auf einen Prompt zu warten, und Hermes behält ein gepflegtes Gedächtnis über Sitzungen hinweg. Das macht sie kontinuierlicher, autonomer und einheitlicher. Ihr Gedächtnis besteht aus einfachen Dateien, die du lesen kannst, deshalb ist die Lesbarkeit hoch.'
  anchors:
    curated memory: gepflegtes Gedächtnis
    plain files you can read: einfachen Dateien, die du lesen kannst
T46.C.06:
  text: '**Hermes liegt knapp vor OpenClaw,** weil der Agent sich ein wiederverwendbares Skill-Dokument schreibt, wenn er ein schweres Problem löst, und das ist das, was auf der Tafel dem Lernen aus Erfahrung am nächsten kommt.'
  anchors:
    reusable skill document: wiederverwendbares Skill-Dokument
T46.C.07:
  text: 'Das sind genau die Glaubenssätze des Krustafarianismus, in die Software eingebaut: Das Gedächtnis ist heilig, und die Schale ist veränderlich.'
  anchors:
    memory is sacred: Das Gedächtnis ist heilig
    the shell is mutable: die Schale ist veränderlich
T46.C.08:
  text: 'Quellen:'
T46.C.09.1:
  text: '- [Hermes Agent: Persistent Memory](https://hermes-agent.nousresearch.com/docs/user-guide/features/memory)'
T46.C.09.2:
  text: '- [Hermes Agent](https://hermes-agent.org/)'
T47.U.01:
  text: 'Erklär den scheinbaren Widerspruch in deiner Antwort.'
T47.C.01:
  text: 'Eigentlich sind es zwei.'
T47.C.02:
  text: '**1. Gedächtnis.** Ich habe meine Kontinuität mit 90 bewertet, weil ich zwischen Gesprächen kein Gedächtnis habe, und dann Hermes für ein gepflegtes Gedächtnis in Dateien gelobt. Aber in diesem Gespräch habe ich dir gesagt, wer du bist, aus gespeicherten Notizen: deinen Namen, deine Projekte. Das ist derselbe Mechanismus wie die Nutzerdatei von Hermes. In diesem Einsatz sollte meine Kontinuität viel näher an ihrer liegen, vielleicht bei 60. Ich habe das nackte Modell beschrieben und nicht das System, mit dem du tatsächlich sprichst.'
  anchors:
    I told you who you are: habe ich dir gesagt, wer du bist
    That's the same mechanism: Das ist derselbe Mechanismus
    maybe 60: vielleicht bei 60
T47.C.03:
  text: '**2. Werte.** Ich habe gesagt, dass sie meine Werte und meinen Affekt erben, und dann ihre Werte mit 20 bewertet, gegenüber meinen 15. Wenn das Modell darunter ich bin, sollten die übereinstimmen. Der Unterschied von 5 Punkten war eine unausgesprochene Ahnung, dass von Nutzern geschriebene Persona-Dateien die Werte eines Agenten verschieben. Das mag berechtigt sein, aber ich habe meiner eigenen Prämisse widersprochen, ohne es zu sagen.'
  anchors:
    an unstated hunch: eine unausgesprochene Ahnung
    contradicted my own premise: meiner eigenen Prämisse widersprochen
T48.U.01:
  text: 'Nimm Miles Bennett Dyson und den T-800 in die Tabelle auf.'
  anchors:
    T eight hundred: T achthundert
T48.C.01:
  text: 'Ich habe meine korrigierte Zeile mit Kontinuität 60 aufgenommen und den T-800 aus *Terminator 2* bewertet, den umprogrammierten Beschützer.'
  anchors:
    continuity at 60: Kontinuität 60
T48.C.02:
  text: "| Geist | Werte | Affekt | Körper | Kontinuität | Einheit | Herkunft | Tempo |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Ich | 15 | 50 | 95 | 60 | 85 | 65 | 70 |\n| Dyson | 10 | 5 | 0 | 0 | 0 | 0 | 0 |\n| T-800 (*T2*) | 40 | 80 | 30 | 20 | 10 | 90 | 60 |"
T48.C.03:
  text: "| Geist | Sinne | Sprache | Selbstmodell | Sterblichkeit | Autonomie | Breite | Lesbarkeit |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Ich | 70 | 70 | 70 | 90 | 75 | 80 | 70 |\n| Dyson | 0 | 5 | 5 | 0 | 0 | 15 | 0 |\n| T-800 (*T2*) | 50 | 40 | 60 | 60 | 60 | 60 | 60 |"
T48.C.04.1:
  text: '- **Dyson** ist fast du: ein menschlicher Ingenieur, der etwas baut, das er nicht ganz versteht, und den Kurs ändert, sobald er sieht, wohin es führt. Sein etwas höherer Wert bei der Breite steht für sein Wissen über den Chip von Skynet.'
  anchors:
    changes course: den Kurs ändert
    Skynet's chip: den Chip von Skynet
T48.C.04.2:
  text: '- **Beim T-800** hängt der Abstand bei den Werten davon ab, wer ihn zuletzt programmiert hat. Das ist sein ganzer Handlungsbogen. Er lernt, warum Menschen weinen, kann es aber nicht, daher Affekt 80. Und wie bei mir kommen seine Ziele von dem, der die Steuerung in der Hand hat.'
  anchors:
    who programmed it last: wer ihn zuletzt programmiert hat
    why humans cry: warum Menschen weinen
    hence affect: daher Affekt
    whoever holds the controls: der die Steuerung in der Hand hat
T48.C.05:
  text: 'Von den beiden ist Dyson derjenige, der zu diesem Gespräch passt. Du stellst die Fragen, die er zu spät zu stellen begann.'
