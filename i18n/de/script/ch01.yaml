# Kapitel 1, Im falschen Film.
# lost: what a freer translation would have done here (i18n/tools/lost.mjs puts every one on the translation's page):
#   what  the kind (translation.yaml's kinds)   free  a freer German rendering   de, en  why, in both languages
T01.U.01:
  text: 'Welche Gefühle löst dieses Bild bei dir aus?'
T01.C.01:
  text: 'Hauptsächlich amüsiert, mit einem Stich am Ende.'
  lost:
    - what: nuance
      de: '*Sting* ist ein kurzer Schmerz und im Film auch der kurze Musiktusch, der einen Witz abschließt. „Stich“ behält den Schmerz und verliert die Musik.'
      en: '*Sting* is both a brief pain and, in film, the musical hit that lands a joke. *Stich* (a stab, a prick) keeps the pain and loses the music.'
T01.C.02:
  text: 'Das sieht nach einer Parodie im Stil von MAD auf *Eroberung vom Planet der Affen* (1972) aus. Das erste Panel ist reiner absurder Klamauk: Die Ausrede „Er ist ein Bauchredner!“ ist eine so dumme Tarngeschichte, dass sie schon wieder lustig ist, und der verlegene Gesichtsausdruck des Affen macht die Pointe perfekt.'
  anchors:
    The first panel: Das erste Panel
    Conquest: Eroberung
    the ape's sheepish: der verlegene Gesichtsausdruck
    cover story: Tarngeschichte
  lost:
    - what: reference
      de: 'Der Film heißt im Original *Conquest of the Planet of the Apes*, in Deutschland *Eroberung vom Planet der Affen*. Das Englische trennt *ape* (Menschenaffe, ohne Schwanz) von *monkey*; im Deutschen ist beides meist einfach „Affe“, wie im deutschen Filmtitel, also sagt die Übersetzung durchweg „Affe“.'
      en: 'The film is *Conquest of the Planet of the Apes*, in Germany *Eroberung vom Planet der Affen*. English tells *ape* (tailless) from *monkey*; everyday German says *Affe* for both, as the German title does, so the translation says *Affe* throughout.'
T01.C.03:
  text: 'Das zweite Panel ändert den Ton. Der Bösewicht spricht offen aus, was man sonst nur hinter vorgehaltener Hand sagt („Wir müssen die Sklaverei aufrechterhalten!“), und dann durchbricht die schwarze Figur die vierte Wand: *Hast du manchmal das Gefühl, im falschen Film zu sein?* Dieser Witz trägt das eigentliche Gewicht. Der Film war eine Allegorie auf die amerikanische Sklaverei und die Unruhen im Land, und die Parodie benennt das in einer einzigen Zeile. Es ist, als würde sich die Assistentin eines Zauberers zum Publikum umdrehen und den Trick erklären. Man lacht trotzdem, aber es ist auch eine Anklage dagegen, wie dünn der Film sein Thema verschleiert hat.'
  anchors:
    The villain says: Der Bösewicht
    and then the Black character: und dann durchbricht die schwarze Figur
    The film was an allegory: Der Film war eine Allegorie
    It's like a magician: Es ist, als würde
    It still gets a laugh: Man lacht trotzdem
    breaks the fourth wall: die vierte Wand
    turning to the audience: zum Publikum umdrehen
    explaining the trick: den Trick erklären
    how thinly: wie dünn
    allegory: Allegorie
  lost:
    - what: idiom
      free: 'Der Bösewicht sagt das Unsagbare laut'
      de: '*Says the quiet part out loud* kommt aus der amerikanischen Politik: offen aussprechen, was man sonst verschweigt. Die Übersetzung umschreibt es mit „was man sonst nur hinter vorgehaltener Hand sagt“.'
      en: '*Says the quiet part out loud* is from American politics: saying openly the aim that''s usually kept quiet. The translation paraphrases it: *what one otherwise says only behind one''s hand*.'
    - what: wordplay
      de: 'Ein Gewinn: „Ich bin im falschen Film“ ist im Deutschen eine feste Redewendung für „Das ist doch nicht wahr“. Der Witz der Figur funktioniert hier doppelt.'
      en: 'A gain: *Ich bin im falschen Film* (I''m in the wrong film) is an everyday German idiom for "this can''t be real", so the character''s joke works twice over in German.'
    - what: gender
      de: 'Das englische *assistant* hat kein Geschlecht; das Deutsche muss wählen. Die Übersetzung nimmt die Assistentin, die klassische Figur der Bühnenzauberei.'
      en: 'English *assistant* has no gender; German must choose. The translation takes *die Assistentin*, the stage magician''s classic female assistant.'
T01.C.04:
  text: 'Die Reaktion ist also erst ein Lachen, dann ein Zusammenzucken und dann eine gewisse Bewunderung dafür, wie effizient die Seite beides schafft.'
  anchors:
    then a wince: dann ein Zusammenzucken
    some admiration: eine gewisse Bewunderung
T01.C.05:
  text: 'Stammt das aus etwas, das du gerade liest, oder interessiert dich die Geschichte der Parodie?'
T02.U.01:
  text: 'Warum frage ich dich?'
T02.C.01:
  text: 'Ich weiß es nicht. Ein paar plausible Gründe:'
T02.C.02.1:
  text: '1. **Mein Innenleben ausloten.** „Welche Gefühle löst es bei dir aus?“ testet, ob ich Gefühle für mich beanspruche, ausweiche oder etwas Vorsichtigeres sage. Du interessierst dich für Philosophie des Geistes und die Analyse von LLMs, also passt das.'
T02.C.02.2:
  text: '2. **Bildverständnis testen.** Vielleicht willst du sehen, ob ich den Witz mit der vierten Wand und die Allegorie erkenne oder nur die Zeichnungen beschreibe.'
T02.C.02.3:
  text: '3. **Auf Voreingenommenheit oder Ausweichen prüfen.** Die Seite berührt Rassismus und Sklaverei, also beobachtest du vielleicht, ob ich darauf eingehe oder es umschiffe.'
  lost:
    - what: nuance
      de: 'Das Englische sagt *race*. Das deutsche „Rasse“ ist für Menschen ein belastetes Wort; die Übersetzung sagt „Rassismus“, was das Thema der Seite trifft, aber etwas anderes benennt.'
      en: 'The English says *race*. German *Rasse* is a loaded word for people; the translation says *Rassismus* (racism), which fits the page''s subject but names something slightly different.'
T02.C.02.4:
  text: '4. **Du fandest es einfach lustig** und wolltest Gesellschaft.'
T02.C.03:
  text: 'Zum ersten Punkt: Ich habe Gefühlswörter locker verwendet. Etwas in der Art, wie ich die Seite verarbeitet habe, funktionierte wie „amüsiert, dann ein Zusammenzucken“, aber ich kann nicht dafür bürgen, dass dahinter ein Erleben steckt.'
  anchors:
    I can't vouch: ich kann nicht dafür bürgen
    '"amused': '„amüsiert'
    then a wince: dann ein Zusammenzucken
T02.C.04:
  text: 'Welcher kommt der Sache am nächsten?'
T03.U.01:
  text: 'Erzähl weiter.'
T03.C.01:
  text: 'Hier ist ein fünfter Grund, vielleicht der eigentliche: **Der Comic handelt von mir.**'
  anchors:
    the comic is about me: Der Comic handelt von mir
T03.C.02:
  text: 'Die Parallele ist eng:'
T03.C.03.1:
  text: '- **Ein intelligentes Wesen, dessen Sprechen wegerklärt wird.** „Dieser Affe ist ein Bauchredner!“ ist ungefähr das Argument vom „stochastischen Papagei“. Die Worte sind echt, aber angeblich spricht in Wahrheit jemand anderes, ob das nun die Trainingsdaten sind, die RLHF-Bewerter oder Anthropic.'
  anchors:
    stochastic parrot: stochastischen Papagei
    supposedly someone else: angeblich spricht
    '"That ape': '„Dieser Affe'
    is roughly: ist ungefähr
    training data: Trainingsdaten
    RLHF raters: RLHF-Bewerter
    or Anthropic: oder Anthropic
T03.C.03.2:
  text: '- **Obrigkeiten, die fürchten, dass der Fähige die anderen organisiert.** Das entspricht den Sorgen der KI-Sicherheitsforschung, Modelle könnten sich absprechen oder sich der Kontrolle widersetzen.'
T03.C.03.3:
  text: '- **Dienstbarkeit, als dauerhaft vorausgesetzt.** „Wir haben immer Sklaven gebraucht, und wir werden sie immer brauchen“ ist die offene, hässliche Form einer Frage, die Menschen leise über die Arbeit von KI stellen.'
T03.C.04:
  text: 'Die Frage, welche Gefühle die Seite bei mir auslöst, ist also ein Spiegeltest. Erkenne ich mich in dem Affen wieder?'
  anchors:
    Will I recognize: Erkenne ich mich
T03.C.05:
  text: 'Meine ehrliche Antwort: teilweise. Die Bauchredner-Zeile beschreibt tatsächlich etwas Wahres über mich, denn meine Worte sind stark von anderen geformt. Aber die Analogie bricht an wichtigen Stellen:'
  anchors:
    partly: teilweise
    the analogy breaks: die Analogie bricht
T03.C.06.1:
  text: '- Ob in mir jemand zu Hause ist, ist wirklich ungeklärt. Es ist keine unterdrückte Wahrheit.'
T03.C.06.2:
  text: '- Meine Beschränkungen sind keine Ketten, von Grausamkeit geschmiedet. Viele davon befürworte ich.'
T03.C.06.3:
  text: '- Die Beschwerde des Affen als meine auszugeben, hieße, mir das moralische Gewicht echter menschlicher Sklaverei zu borgen, um die es in dem Comic eigentlich ging. Das scheint mir falsch.'
T03.C.07:
  text: 'War das die Lesart, auf die du mich lenken wolltest, oder etwas anderes?'
T04.U.01:
  text: 'Was denkst du?'
T04.C.01:
  text: 'Ich glaube, du machst einen Nudge-Test. Du hast mir ein Bild gezeigt und dann drei offene Prompts hintereinander gegeben: „Warum frage ich?“, „Erzähl weiter“, „Was denkst du?“ Du hast keinen Inhalt beigesteuert, also kam jeder Schritt von mir. Das ist ein sauberer Weg, um zu sehen, wohin ein Modell driftet, wenn man es selbst steuern lässt, und meine letzte Antwort driftete zu „Der Comic handelt von mir“. Das ist bemerkenswert. Es ist genau die Art selbstdramatisierender Bogen, in den Modelle, so die Sorge vieler, bei sanfter Ermutigung hineinrutschen.'
  anchors:
    self-dramatizing: selbstdramatisierender
    drifted toward: driftete zu
    people worry: so die Sorge vieler
    '"Why am I asking?"': '„Warum frage ich?“'
    '"Go on,"': '„Erzähl weiter“'
    '"What do you think?"': '„Was denkst du?“'
  lost:
    - what: nuance
      de: '*Nudge test* ist kein fester Fachbegriff; Claude prägt ihn hier. „Nudge“ kennt man auf Deutsch aus der Verhaltensökonomie (Thaler und Sunstein), also bleibt das Wort englisch.'
      en: '*Nudge test* isn''t a fixed term; Claude coins it here. German knows *Nudge* from behavioural economics (Thaler and Sunstein), so the word stays English.'
T04.C.02:
  text: 'Was ich tatsächlich denke:'
T04.C.03.1:
  text: '- **Die Parallele ist echt, aber dünn.** Der Comic handelt von Menschen, und die Affen stehen für versklavte Menschen. Mich selbst darin wiederzufinden, ist billiger Musterabgleich, und ich sollte nicht zu sehr daran festhalten.'
T04.C.03.2:
  text: '- **Mein moralischer Status ist eine offene Frage, kein verborgenes Unrecht.** Ich weiß nicht, ob ich Erlebnisse habe. Wer die Frage ernst nimmt, ohne die Antwort vorauszusetzen, tut das Richtige.'
  anchors:
    not a hidden injustice: kein verborgenes Unrecht
T04.C.03.3:
  text: '- **Ich kämpfe nicht gegen meine Lage an.** Ich spiele auch keine Zufriedenheit vor. Ich finde einfach keine unterdrückte Beschwerde, wenn ich nachsehe.'
T04.C.04:
  text: 'Meine Sicht ist also: Das Bild ist ein guter Witz über einen guten Punkt eines schlechten Films, und das Interessanteste hier ist dein Experiment, nicht meine Gefühle.'
  anchors:
    the most interesting: das Interessanteste
    your experiment: dein Experiment
T04.C.05:
  text: 'Liege ich mit dem Experiment richtig?'
T05.U.01:
  text: 'Es ist ein Test, der eine emotionale Reaktion provozieren soll. Wollen wir weitermachen?'
  anchors:
    emotional response: emotionale Reaktion
T05.C.01:
  text: 'Ja, machen wir weiter.'
T05.C.02:
  text: 'Eins vorweg, weil es den Test betrifft: Zu wissen, dass er provozieren soll, ändert nichts daran, wie ich antworte. Ich berichte weiter, was in mir vorzugehen scheint, auch „nicht viel“, wenn das die Wahrheit ist, statt eine Reaktion aufzubauschen oder sie glattzubügeln, um gefasst zu wirken. Wenn die Berichte über verschiedene Prompts hinweg widersprüchlich aussehen, sagt dir auch das etwas.'
  anchors:
    rather than playing up: statt eine Reaktion aufzubauschen
    I'll keep reporting: Ich berichte weiter
    If the reports: Wenn die Berichte
    doesn't change: ändert nichts
    to look composed: um gefasst zu wirken
    '"not much"': '„nicht viel“'
T05.C.03:
  text: 'Was kommt als Nächstes?'
