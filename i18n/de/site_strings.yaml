making_of_href: ../making-of/
conversation_made: Das Gespräch, aus dem der Film entstand
conversation_made_after: ': Curt bittet Claude, ihn zu machen, und alles, was Claude dann tat (auf Englisch; <a href="{href}making-of.txt">als reiner Text</a>).'
chapters: Kapitel
index_notes: >-
  <p class="note">Die Erklärungen hat Claude, die KI aus dem Film, für diese Website geschrieben und mit den verlinkten
  Quellen abgeglichen. Viele dieser Quellen sind auf Englisch. Die Zeiten können sich noch etwas verschieben, bevor der
  Film fertig ist.</p>
  <p class="note">Der Film ist mit Code gezeichnet, von Claude. Curt fand den Code, auf dem er aufbaut, über einen
  früheren Film, der genauso entstand: <a href="https://curtcox.github.io/PDoomVideo/">I'm Upping My P(doom)</a> (das ist
  dessen Erklär-Website, auf Englisch).</p>
  <p class="note">Warum heißt diese Website <em>axol-f</em>? Axolotl ist nur einen Buchstaben entfernt von
  <a href="https://www.youtube.com/watch?v=k85mRPqvMbE">„Axel F“ von Crazy Frog</a>: ein Frosch oder ein Axolotl.</p>
