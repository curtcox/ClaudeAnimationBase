lang: de
film_title: Frosch oder Axolotl
index_title: 'Frosch oder Axolotl: die Links'
explained: Erklärt
index_intro: >-
  <p>Ein Animationsfilm nach einem langen Gespräch an einem Samstagmorgen zwischen Curt und Claude, einem KI-Programm.
  Das Gespräch springt zwischen Science-Fiction, Philosophie und vielen aktuellen KI-Nachrichten hin und her und steckt
  deshalb voller Anspielungen, die die meisten Leute nicht kennen.</p><p>Hier sind sie alle, der Reihe nach, Kapitel
  für Kapitel, mit kurzen Erklärungen in einfacher Sprache, wo ein Link allein nicht reicht. <strong>Die gelben sind die
  Erklärungen.</strong> Fang dort an, wenn dich im Film etwas ratlos gelassen hat.</p>
  <p class="note">Das ist die deutsche Fassung. Film und Website wurden von Claude übersetzt, absichtlich ohne
  menschliche Durchsicht: <a href="uebersetzung/">wie übersetzt wurde und was verloren ging</a>. Die englische
  Original-Website ist <a href="../">curtcox.github.io/axol-f</a>.</p>
watch_film: ▶ Den Film ansehen
watch_film_after: ', mit jedem Link daneben, sobald er erscheint.'
on_its_way: >-
  Der Film ist unterwegs. Seine Links und Erklärungen sind schon alle hier. Ungeduldig? Der Film ist komplett aus Code
  gemacht, du kannst ihn also selbst erzeugen: <a href="{repo}">hol dir den Code</a> und führe
  <code>npm start</code> aus.
two_conversations: Die zwei Gespräche
