# Speech-only respellings for the German voice, applied in order to every spoken line after markdown is stripped
# (tools/script_lib.mjs's autoSpeech; format as script/pronounce.yaml). They change what's said, never what's painted.
# verify: true = a guess to check by ear.
- { match: "LLMs", say: "Ell-Ell-Ems" }
- { match: "LLM", say: "Ell-Ell-Em" }
- { match: "RLHF", say: "Er-Ell-Ha-Eff" }
- { match: "T-800", say: "T achthundert" }
- { match: "GPT-5.6", say: "G-P-T fünf Punkt sechs" }
- { match: "Opus 5.5", say: "Opus fünf Punkt fünf" }
- { match: "AIDE²", say: "AIDE hoch zwei", verify: true }
- { match: "P(foom)", say: "P von Foom" }
- { match: "P≠NP", say: "P ungleich NP" }
- { match: "2×2", say: "zwei mal zwei" }
- { match: "Tines", say: "Teins", verify: true }
