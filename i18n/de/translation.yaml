# film-wide notes, not tied to one line (ch: null is the whole film)
notes:
  - what: title
    ch: null
    where: Titel / title
    original: 'Frog or Axolotl'
    ours: 'Frosch oder Axolotl'
    de: 'Ein Glücksfall: Der Axolotl heißt auf Deutsch genauso wie auf Englisch, und *frog* ist „Frosch“. Der Titel überlebt Wort für Wort. Nur das Wortspiel des Repositorys, *axol-f*, eine Anspielung auf „Axel F“, das Titelthema aus *Beverly Hills Cop*, das Crazy Frog berühmt machte, ist ein englischer Witz; ihn versteht man auf Deutsch aber genauso.'
    en: 'A lucky one: the axolotl is called the same in German as in English, and *frog* is *Frosch*. The title survives word for word. Only the repository''s pun, *axol-f*, a nod to "Axel F", the *Beverly Hills Cop* theme Crazy Frog made famous, is an English joke, and German speakers get it just the same.'
  - what: address
    ch: null
    where: die Anrede / address
    original: 'you'
    ours: 'du'
    free: 'Sie'
    de: 'Das Englische hat nur *you*. Die Übersetzung lässt Curt und Claude sich duzen, wie es in lockeren Gesprächen und in Chats mit KI auf Deutsch üblich ist. Ein Siezen wäre auch möglich gewesen und hätte das Gespräch förmlicher gemacht; dass Claude Curts Vorlieben aus dem Gedächtnis kennt, klingt mit „du“ vertrauter, als das Englische es sagt.'
    en: 'English has only *you*. The translation has Curt and Claude say the familiar *du* to each other, as casual German conversation and German chats with AI usually do. The formal *Sie* was possible too and would have made the conversation more formal; with *du*, Claude knowing Curt''s preferences from memory sounds more familiar than the English says.'
  - what: gender
    ch: null
    where: Claude in der dritten Person / Claude in the third person
    original: 'it'
    ours: 'Claude, es'
    free: 'er'
    de: 'Das Englische nennt Claude *it*. Im Deutschen läge „er“ nahe (der Name klingt männlich, und „der Chatbot“ ist grammatisch männlich), doch das gäbe Claude ein Geschlecht, das das Original nicht hat. Die Website sagt deshalb „Claude“ oder „es“ (das Programm, das Modell), was manchmal etwas holprig klingt.'
    en: 'English calls Claude *it*. In German *er* (he) would come naturally (the name sounds masculine, and *der Chatbot* is grammatically masculine), but it would give Claude a gender the original doesn''t. So the site says "Claude" or *es* (it: *das Programm*, *das Modell*), which sometimes reads a little awkwardly.'
  - what: title
    ch: 0
    where: Kapiteltitel / chapter title
    original: 'Cold open'
    ours: 'Kalter Einstieg'
    free: 'Vorspann'
    de: '*Cold open* ist ein Begriff des amerikanischen Fernsehens: die Szene, die vor dem Vorspann beginnt, ohne Einführung. Deutsche Fernsehleute sagen oft einfach „Cold Open“. „Kalter Einstieg“ ist die wörtliche Übersetzung; „Vorspann“ wäre geläufiger, meint aber die Titelsequenz selbst.'
    en: '*Cold open* is an American television term: the scene that starts before the titles, with no introduction. German TV people often just say "Cold Open". *Kalter Einstieg* is the literal translation; *Vorspann* would be more familiar, but means the title sequence itself.'
  - what: title
    ch: 7
    where: Kapiteltitel / chapter title
    original: 'Mind-Space'
    ours: 'Raum der Geister'
    free: 'Geistraum'
    de: '*Mind-Space* ist ein Kompositum im Stil der Science-Fiction. „Raum der Geister“ klingt etwas gespenstisch, weil „Geist“ auch Gespenst heißt; „Geistraum“ wäre kürzer, aber kaum verständlich.'
    en: '*Mind-Space* is a compound in the style of science fiction. *Raum der Geister* (space of minds) sounds a little spooky, since *Geist* also means a ghost; *Geistraum* would be shorter but hardly understandable.'
  - what: title
    ch: 9
    where: Kapiteltitel / chapter title
    original: 'Shells'
    ours: 'Schalen'
    free: 'Panzer'
    de: 'Der Titel spielt mit beiden Bedeutungen von *shell*: dem Panzer des Hummers im Krustafarianismus und der Software-Hülle um ein Modell (den Agenten-Gerüsten). „Schalen“ trägt den Hummer und, weniger geläufig, die Software; die Anmerkungen zu Kapitel 9 erklären es.'
    en: 'The title plays on both senses of *shell*: the lobster''s carapace in Crustafarianism and the software shell wrapped around a model (the agent harnesses). *Schalen* carries the lobster and, less commonly, the software; chapter 9''s notes explain.'
  - what: title
    ch: 14
    where: Kapiteltitel / chapter title
    original: 'The Pundits'
    ours: 'Die Meinungsmacher'
    free: 'Die Experten'
    de: '*Pundit* ist, wer in den Medien Meinungen verbreitet, mit einem Hauch Ironie. „Die Meinungsmacher“ hat die Ironie; „Die Experten“ wäre neutraler, „Die Kommentatoren“ ganz nüchtern.'
    en: '*Pundit* is someone who airs opinions in the media, with a hint of irony. *Die Meinungsmacher* (the opinion-makers) has the irony; *Die Experten* would be more neutral, *Die Kommentatoren* quite sober.'
