title: Frosch oder Axolotl
cold_open: Kalter Einstieg
explained: Erklärt
head: |
  Ein Animationsfilm nach einem langen Gespräch an einem Samstagmorgen zwischen Curt und Claude, einem KI-Programm, fast Wort für Wort, ins Deutsche übersetzt: von einer Parodie der MAD auf Planet der Affen über Frösche, Axolotl und Spiegeltests bis zum Hugging-Face-Vorfall im Juli 2026 und P(foom).

  Die Übersetzung stammt von Claude, absichtlich ohne menschliche Durchsicht. Wie übersetzt wurde und was verloren ging: https://curtcox.github.io/axol-f/de/uebersetzung/
  Die englische Originalfassung: https://curtcox.github.io/axol-f/

  Das ganze Gespräch, übersetzt: {conversation}
  Jeder Link aus dem Film ({links}), nach Zeit geordnet, mit Erklärungen in einfacher Sprache: {site}
  Der Code, der den Film zeichnet (du kannst ihn selbst erzeugen): {repo}

  Kapitel
  {chapters}
foot: |-

  Mit Code gezeichnet von Claude (p5.js und p5.brush), nach der Abschrift des Gesprächs. Stimmen, Geräusche und Musik: ElevenLabs.
  Die Comicseite, das Diagramm und der Alignment-Kompass wurden für den Kommentar nachgezeichnet; keine Logos, und die Karikaturen sind liebevoll gemeint. Zitatrecht: Kommentar und Parodie.
