conversation_intro: >-
  <p>Toda la conversación entre Curt y Claude de la que sale la película, palabra por palabra, capítulo por capítulo, en
  la traducción de la película. La original, en inglés, está <a href="{orig}">en claude.ai</a>. También está aquí como
  <a href="../conversation.txt">texto simple</a>, y se puede leer al lado del inglés en
  <a href="../traduccion/texto/">el texto completo, en los dos idiomas</a>. Y está
  <a href="{making_of}">la conversación que hizo la película</a> (en inglés).</p>
