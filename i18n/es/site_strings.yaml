# The Spanish site's own words (tools/build_site.mjs's SITE_WORDS, key by key; i18n/tools/stage.mjs copies this to the
# stage's script/site_strings.yaml). {name} is filled in by the builder. Some values are HTML.
lang: es
film_title: Rana o ajolote
index_title: 'Rana o ajolote: los enlaces'
explained: Explicado
index_intro: >-
  <p>Una película animada de una larga conversación de un sábado por la mañana entre Curt y Claude, un programa de IA.
  La conversación pasea por la ciencia ficción, la filosofía y muchas noticias recientes sobre IA, así que está llena de
  referencias que la mayoría de la gente no conoce.</p><p>Aquí están todas, en orden, capítulo por capítulo, con
  explicaciones breves en lenguaje sencillo donde un enlace solo no alcanza. <strong>Las amarillas son las
  explicaciones.</strong> Empieza por ahí si un momento de la película te dejó sin entender.</p>
  <p class="note">Esta es la versión en español. La película y este sitio los tradujo Claude, sin revisión humana, a
  propósito: <a href="traduccion/">cómo se tradujo, y qué se perdió</a>. El sitio original, en inglés, está en
  <a href="../">curtcox.github.io/axol-f</a>.</p>
watch_film: ▶ Ver la película
watch_film_after: ', con cada enlace al lado a medida que aparece.'
on_its_way: >-
  La película está en camino. Sus enlaces y explicaciones ya están todos aquí. ¿No puedes esperar? La película está hecha
  enteramente con código, así que puedes hacerla tú: <a href="{repo}">consigue el código</a> y ejecuta
  <code>npm start</code>.
two_conversations: Las dos conversaciones
conversation_shown: La conversación que muestra la película
conversation_shown_after: ', palabra por palabra, traducida (<a href="conversation.txt">texto simple</a>).'
# the making-of is in English only, on the English site
making_of_href: ../making-of/
conversation_made: La conversación que hizo la película
conversation_made_after: ': Curt pidiéndole a Claude que la hiciera, y todo lo que Claude hizo (en inglés; <a href="{href}making-of.txt">texto simple</a>).'
chapters: Capítulos
index_notes: >-
  <p class="note">Las explicaciones las escribió Claude, la IA de la película, para este sitio, y las comprobó con las
  fuentes enlazadas. Muchas de esas fuentes están en inglés. Los tiempos todavía pueden moverse un poco antes de que la
  película esté terminada.</p>
  <p class="note">La película está dibujada con código, por Claude. Curt encontró el código en que se basa a través de
  una película anterior hecha de la misma manera, <a href="https://curtcox.github.io/PDoomVideo/">I'm Upping My
  P(doom)</a> (ese es su sitio de explicaciones, en inglés).</p>
  <p class="note">¿Por qué este sitio se llama <em>axol-f</em>? Axolotl, "ajolote" en inglés, a una letra de
  <a href="https://www.youtube.com/watch?v=k85mRPqvMbE">"Axel F", de Crazy Frog</a>, la rana loca: una rana, o un
  ajolote.</p>
