    T eight hundred: T ochocientos
T48.C.01:
  text: 'Incluí mi fila corregida con la continuidad en 60, y califiqué al T-800 de *T2*, el protector reprogramado.'
  speech: 'Incluí mi fila corregida con la continuidad en 60, y califiqué al T ochocientos de T dos, el protector reprogramado.'
