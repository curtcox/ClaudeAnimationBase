T48.C.04.1:
  text: '- **Dyson** es casi tú: un ingeniero humano que construye algo que no entiende del todo, y que cambia de rumbo cuando ve adónde lleva. Su puntaje de amplitud, un poco mayor, se debe a que conoce el chip de Skynet.'
  anchors:
    changes course: cambia de rumbo
    Skynet's chip: el chip de Skynet
T48.C.04.2:
  text: '- **La distancia de valores del T-800** depende de quién lo programó por última vez. Ese es todo su arco. Aprende por qué lloran los humanos, pero no puede hacerlo, de ahí el afecto en 80. Y, como yo, sus metas vienen de quien tenga los controles.'
  speech: 'La distancia de valores del T ochocientos depende de quién lo programó por última vez. Ese es todo su arco. Aprende por qué lloran los humanos, pero no puede hacerlo, de ahí el afecto en 80. Y, como yo, sus metas vienen de quien tenga los controles.'
  anchors:
    who programmed it last: quién lo programó por última vez
    why humans cry: por qué lloran los humanos
    hence affect: de ahí el afecto
    whoever holds the controls: quien tenga los controles
  lost:
    - what: quote
      free: 'Ahora sabe por qué lloran, pero es algo que nunca podrá hacer'
      es: 'Claude alude a la frase del T-800 al final de *Terminator 2*: *I know now why you cry, but it''s something I can never do*. El doblaje latinoamericano la dice a su manera; la traducción no la cita, igual que el inglés, que solo la parafrasea.'
      en: 'Claude alludes to the T-800''s line at the end of *Terminator 2*: *I know now why you cry, but it''s something I can never do*. The Latin American dub has its own wording; the translation doesn''t quote it, just as the English only paraphrases it.'
T48.C.05:
  text: 'De los dos, Dyson es el que hace pareja con esta conversación. Tú estás haciendo las preguntas que él empezó a hacerse demasiado tarde.'
