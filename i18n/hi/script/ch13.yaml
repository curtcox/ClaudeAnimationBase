T66.U.01:
  text: 'क्या foom सिर्फ़ एक ध्वनि-अनुकरण शब्द है, या उसमें OOM का खेल भी है, AFAYCT?'
  speech: 'क्या फ़ूम सिर्फ़ एक ध्वनि-अनुकरण शब्द है, या उसमें ऊम का खेल भी है, जहाँ तक तुम्हें लगे?'
  lost:
    - what: wordplay
      hi: 'यह शब्द-खेल लैटिन अक्षरों में ही दिखता है: *foom* के भीतर *oom* है। देवनागरी में "फ़ूम" और "ऊम" की आवाज़ तो मेल खाती है, पर लिखे हुए में खेल छिप जाता है। इसलिए इस हिस्से में अनुवाद foom और OOM को लैटिन अक्षरों में लिखता है, और आवाज़ उन्हें "फ़ूम" और "ऊम" कहती है। कर्ट का *AFAYCT* (as far as you can tell) संक्षेप ही रहा, जैसा उसने टाइप किया।'
      en: 'The pun only shows in Latin letters: *foom* has *oom* inside it. In Devanagari फ़ूम and ऊम sound alike, but on the page the pun hides. So in this stretch the translation writes foom and OOM in Latin letters, and the voice says them फ़ूम and ऊम. Curt''s *AFAYCT* (as far as you can tell) stays the acronym he typed.'
T66.C.01:
  text: 'जहाँ तक मुझे पता है, इसकी शुरुआत शुद्ध ध्वनि-अनुकरण के रूप में हुई, किसी चीज़ के आग पकड़ने की भक् जैसी आवाज़, और 2008 की हैनसन–युडकोव्स्की "AI-Foom" बहस ने इसे लोकप्रिय बनाया। एक बैकरोनिम बाद में आया: "Fast Onset of Overwhelming Mastery" (ज़बरदस्त महारत का तेज़ आगमन)।'
  speech: 'जहाँ तक मुझे पता है, इसकी शुरुआत शुद्ध ध्वनि-अनुकरण के रूप में हुई, किसी चीज़ के आग पकड़ने की भक् जैसी आवाज़, और 2008 की हैनसन–युडकोव्स्की "एआई-फ़ूम" बहस ने इसे लोकप्रिय बनाया। एक बैकरोनिम बाद में आया: "फ़ास्ट ऑनसेट ऑफ़ ओवरव्हेल्मिंग मास्टरी" (ज़बरदस्त महारत का तेज़ आगमन)।'
  anchors:
    popularized by the 2008: 2008 की हैनसन
    A backronym came later: एक बैकरोनिम बाद में
    catching fire: आग पकड़ने
T66.C.02:
  text: 'मुझे ऐसे किसी सबूत का पता नहीं कि इसे OOM (orders of magnitude, यानी परिमाण के क्रम) पर खेल के रूप में सोचा गया था। मेल बढ़िया है, क्योंकि foom सचमुच तेज़ी से कई OOM ही है, पर मेरी नज़र में यह एक सुखद संयोग या बाद की लोक-व्याख्या है, मूल नहीं।'
  speech: 'मुझे ऐसे किसी सबूत का पता नहीं कि इसे ऊम (ऑर्डर्स ऑफ़ मैग्निट्यूड, यानी परिमाण के क्रम) पर खेल के रूप में सोचा गया था। मेल बढ़िया है, क्योंकि फ़ूम सचमुच तेज़ी से कई ऊम ही है, पर मेरी नज़र में यह एक सुखद संयोग या बाद की लोक-व्याख्या है, मूल नहीं।'
  anchors:
    a play on oom: पर खेल के रूप
