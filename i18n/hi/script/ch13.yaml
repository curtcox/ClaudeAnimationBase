T63.U.01:
  text: 'EOY तक RSI?'
  speech: 'ई-ओ-वाई तक आरएसआई?'
T63.C.01:
  text: '> _[टूल: वेब पर खोजा]_'
T63.C.02:
  text: 'यह इस पर निर्भर है कि आपका मतलब कौन-से RSI से है।'
T63.C.03:
  text: '**कमज़ोर RSI पहले से यहाँ है।** इस हफ़्ते के एक पेपर में AIDE² का वर्णन है, जो यह लूप हार्नेस की परत पर चलाता है: एक AI रिसर्च एजेंट अपना ही कोड दोबारा लिखता है, और हर स्वीकार किया गया नया रूप वह एजेंट बन जाता है जिसे अगला दौर बदलता है। Anthropic ने जून में इस पर अपनी प्रगति-रिपोर्ट प्रकाशित की।'
  anchors:
    each accepted rewrite: हर स्वीकार किया गया नया रूप
    the agent the next round edits: जिसे अगला दौर बदलता
    Anthropic published: Anthropic ने जून
T63.C.04:
  text: '**मज़बूत RSI** का मतलब है एक खुला लूप, जिसमें सिस्टम अपनी क्षमताओं को इंसानों से तेज़, बहुत कम इंसानी निगरानी के साथ, बढ़ाता है। साल के अंत तक के लिए मेरा अंदाज़ा लगभग 5% है। अभी के सबसे अच्छे सबूत बताते हैं कि एजेंट रिसर्च इंजीनियरिंग में अच्छे हैं, पर खुले शोध में कमज़ोर। जुलाई में 1,250 पेपरों के एक सर्वे ने पाया कि खुला RSI अब भी हर मापे गए अक्ष पर ज़मीन से जुड़ाव, ढहने की गतिकी और कंप्यूट से बँधा है।'
  anchors:
    about 5%: लगभग 5%
    with little human oversight: बहुत कम इंसानी निगरानी
    good at research engineering: रिसर्च इंजीनियरिंग में अच्छे
    weak at open-ended research: खुले शोध में कमज़ोर
    1,250 papers: 1,250 पेपरों
    grounding: ज़मीन से जुड़ाव
    collapse dynamics: ढहने की गतिकी
    compute on every: और कंप्यूट से बँधा
T63.C.05:
  text: '**चिंता वाला मामला बीच में है।** यह कमज़ोर लूपों, कई प्रतियों और लैब्स की होड़ का मेल है। इस महीने एक शोधकर्ता ने Anthropic से इस्तीफ़ा दिया, यह चेतावनी देते हुए कि लैब्स ख़ुद को बेहतर बनाने वाली सुपरइंटेलिजेंस की ओर बिना पर्याप्त सावधानी के दौड़ रही हैं।'
