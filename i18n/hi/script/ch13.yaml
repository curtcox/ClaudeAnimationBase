T64.C.02:
  text: '**सख़्त फ़ूम** का मतलब है इंसानी स्तर से बहुत ज़्यादा अतिमानवीय स्तर तक, दिनों से हफ़्तों में। यह उन सीमाओं से टकराता है जिन पर हमने बात की: कंप्यूट घटते फ़ायदे के साथ बढ़ता है, प्रयोग दुनिया की रफ़्तार से चलते हैं, और चिप, फ़ैब और बिजलीघर बनने में सालों लगते हैं। इस दशक के लिए मेरा अंदाज़ा लगभग 5–10% है।'
  speech: 'सख़्त फ़ूम का मतलब है इंसानी स्तर से बहुत ज़्यादा अतिमानवीय स्तर तक, दिनों से हफ़्तों में। यह उन सीमाओं से टकराता है जिन पर हमने बात की: कंप्यूट घटते फ़ायदे के साथ बढ़ता है, प्रयोग दुनिया की रफ़्तार से चलते हैं, और चिप, फ़ैब और बिजलीघर बनने में सालों लगते हैं। इस दशक के लिए मेरा अंदाज़ा लगभग पाँच से दस प्रतिशत है।'
