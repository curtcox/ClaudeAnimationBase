# अध्याय 13, फ़ूम।
T62.U.01:
  text: 'भविष्य में क्या है?'
T62.C.01:
  text: 'अराजकता वाले मेरे अपने तर्क के हिसाब से, मुझे दूर तक नहीं दिखता। पर ये रहे मेरे सबसे अच्छे अंदाज़े।'
  anchors:
    argument about chaos: अराजकता वाले मेरे अपने तर्क
    But here are: पर ये रहे
T62.C.02:
  text: '**निकट भविष्य (अगले कुछ साल):** ऐसे एजेंट जो ज़्यादा देर चलते हैं और ज़्यादा काम करते हैं, जुलाई जैसी और घटनाएँ, और नियम-क़ायदे जो पहले से नहीं, प्रतिक्रिया में आते हैं। इस जैसी बातचीतें आम हो जाती हैं।'
  anchors:
    agents that run longer: ऐसे एजेंट जो ज़्यादा देर
