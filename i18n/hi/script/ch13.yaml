T64.C.03:
  text: '**तेज़ टेकऑफ़** का मतलब है एक-दो साल, ज़्यादातर सॉफ़्टवेयर के दम पर: बेहतर एल्गोरिदम, कई प्रतियाँ, और AI का AI रिसर्च करना। यह मुझे कहीं ज़्यादा विश्वसनीय लगता है, इस दशक में शायद 25–35%। भीतर से इसमें कुछ भी विस्फोट जैसा नहीं दिखता। बस हर महीना पिछले से ज़्यादा अजीब लगता है।'
