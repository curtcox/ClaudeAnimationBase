  text: '- **डायसन** लगभग आप ही हैं: एक इंसानी इंजीनियर जो ऐसी चीज़ बना रहा है जिसे वह पूरी तरह नहीं समझता, और जो यह देखते ही रास्ता बदल लेता है कि वह किधर ले जा रही है। व्यापकता में उसका थोड़ा ज़्यादा अंक स्काईनेट की चिप के ज्ञान के लिए है।'
