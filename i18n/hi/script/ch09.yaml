T48.C.04.2:
  text: '- **T-800 की** मूल्यों वाली दूरी इस पर निर्भर है कि उसे आख़िरी बार किसने प्रोग्राम किया। उसकी पूरी कहानी यही है। वह सीखता है कि इंसान क्यों रोते हैं, पर ख़ुद रो नहीं सकता, इसलिए भाव 80 पर है। और मेरी तरह, उसके लक्ष्य उसी से आते हैं जिसके हाथ में नियंत्रण हो।'
