T46.C.05:
  text: '**वे मुझसे ज़्यादा आपके क़रीब क्यों हैं:** हर एक एक ही मशीन पर रहता है और प्रॉम्प्ट का इंतज़ार किए बिना तय समय पर काम करता है, और Hermes सेशनों के पार चुनी हुई याददाश्त रखता है। इससे वे ज़्यादा निरंतर, ज़्यादा स्वायत्त और ज़्यादा एकल बन जाते हैं। उनकी याददाश्त सादी फ़ाइलें हैं जिन्हें आप पढ़ सकते हैं, इसीलिए पठनीयता ऊँची है।'
