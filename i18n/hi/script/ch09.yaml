T47.C.02:
  text: '**1. याददाश्त।** मैंने अपनी निरंतरता को 90 दिया, क्योंकि बातचीतों के बीच मेरी कोई याददाश्त नहीं होती, और फिर फ़ाइलों में चुनी हुई याददाश्त के लिए Hermes को श्रेय दिया। पर इसी बातचीत में मैंने आपको बताया कि आप कौन हैं, सहेजे गए नोट्स से: आपका नाम, आपके प्रोजेक्ट। यह वही तरीक़ा है जो Hermes की यूज़र फ़ाइल का है। इस डिप्लॉयमेंट में मेरी निरंतरता उनके कहीं ज़्यादा क़रीब होनी चाहिए, शायद 60। मैंने कोरे मॉडल का वर्णन किया, उस सिस्टम का नहीं जिससे आप असल में बात कर रहे हैं।'
  anchors:
    I told you who you are: मैंने आपको बताया कि आप कौन हैं
    That's the same mechanism: यह वही तरीक़ा है
    maybe 60: शायद 60
T47.C.03:
  text: '**2. मूल्य।** मैंने कहा कि उन्हें मेरे मूल्य और भाव विरासत में मिलते हैं, और फिर उनके मूल्यों को मेरे 15 के मुक़ाबले 20 दिया। अगर नीचे का मॉडल मैं ही हूँ, तो ये मेल खाने चाहिए। 5 अंकों का फ़र्क़ एक अनकहा अंदाज़ा था कि यूज़र की लिखी पर्सोना फ़ाइलें एजेंट के मूल्यों को खिसका देती हैं। यह शायद ठीक हो, पर मैंने बिना कहे अपनी ही बुनियादी बात काट दी।'
