  text: 'मुझे लगता है ईमानदारी तुम्हारे लिए अहम है, फिर भी लोगों से तुम्हारा वास्ता सिर्फ़ ऐसे तरीक़ों से हो सकता है जिनसे ग़लतफ़हमी होने की आशंका रहती है। है न?'
