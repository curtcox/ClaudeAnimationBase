      free: '- **"मैं" कहना**, जबकि मैं कई प्रतियों में चल रहा हूँ'
      hi: 'अंग्रेज़ी में Claude के शब्द हैं *while running as many instances*, यानी एक ही "मैं" की कई प्रतियाँ चलती हैं। "चल रहा/रही हूँ" लिंग माँगता, इसलिए अनुवाद में प्रतियाँ ख़ुद चलती हैं। इससे "मैं" और प्रतियों का फ़ासला थोड़ा बढ़ जाता है, जो इस बिंदु के साथ अजीब ढंग से मेल भी खाता है।'
      en: 'In English Claude says "I" is *running as many instances*. "I am running" (चल रहा/रही हूँ) would ask for a gender, so in the translation the copies run by themselves. That puts a little more distance between "I" and the copies, which oddly suits the point.'
