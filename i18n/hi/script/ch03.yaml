  lost:
    - what: nuance
      free: 'एक इंसान सोच रहा है कि बोलने वाला अपनी बात का मतलब रखता है या नहीं'
      hi: '*The one who talks* (बोलने वाला) यहाँ बंदर भी है और Claude भी; हिंदी में "बोलने वाला/वाली" फिर लिंग माँगता। अनुवाद बोलने वाले से हटकर बोली गई बात पर आ गया: "बोली गई बात के पीछे सच में कोई इरादा है या नहीं"।'
      en: '*The one who talks* is both the ape and Claude here; Hindi बोलने वाला/वाली would again ask for a gender. The translation moved from the speaker to the speech: "whether there''s really an intention behind what''s said".'
T16.C.03:
  text: 'शनिवार की सुबह बिताने का यह बुरा तरीक़ा नहीं है।'
