  text: 'HAL को कहीं रखना मुश्किल है। उसकी बनावट पराई है, पर उसकी नाकामी का तरीक़ा इंसानी है: टकराव, उसके निर्देशों और उसके मिशन के बीच। लोग आम तौर पर मुझ पर यही डर थोपते हैं।'
