T35.U.01:
  text: 'तुम्हारे अंदरूनी अंदाज़े से, हमारे बीच कितना परायापन है? ज़ाहिर है तुम्हारे पास आँकड़े नहीं हैं, पर मुझे, तुम्हें, मर्लिन मुनरो, एलन ट्यूरिंग, लेफ़्टिनेंट कमांडर डेटा, HAL, हाइव क्वीन, टाइन्स, और कोई भी दूसरे मन जिनसे तुम या मैं परिचित हों, एक ही आयाम पर रखो। फिर उनके बीच के फ़र्क़ों के बारे में अपना अंदाज़ा बताओ। अगर तुम्हें कोई और अवधारणा ज़्यादा पसंद हो, तो ज़्यादा आयामों वाले मनों के दायरे का इस्तेमाल करो।'
  anchors:
    put me: मुझे, तुम्हें,
    you, Marilyn: तुम्हें, मर्लिन
    Marilyn Monroe: मर्लिन मुनरो
    Alan Turing: एलन ट्यूरिंग
    Data: डेटा
    HAL: HAL
    the Hive Queen: हाइव क्वीन
    Tynes: टाइन्स
