  lost:
    - what: typo
      hi: 'कर्ट ने *based on you gut feel* लिखा (सही है *your*)। अंग्रेज़ी में लाल क़लम इसे ठीक करती है; हिंदी वाक्य में इस चूक के लिए कोई जगह नहीं।'
      en: 'Curt typed *based on you gut feel* (it should be *your*). In English a red pen fixes it; the Hindi sentence has no place for the slip to fall.'
    - what: gender
      free: 'हम एक-दूसरे के लिए कितने पराए हैं?'
      hi: '"हम कितने पराए हैं" में "पराए" पुल्लिंग बहुवचन है, और "हम" में Claude भी शामिल है। इसलिए सवाल "हमारे बीच कितना परायापन है?" बना, और "जिन्हें तुम या मैं जानते हों" की जगह "जिनसे तुम या मैं परिचित हों", जहाँ "परिचित" का रूप नहीं बदलता।'
      en: 'In "how alien are we" (हम कितने पराए हैं) the adjective is masculine plural, and "we" includes Claude. So the question became "how much alienness is there between us?", and "minds you or I might know" (जानते हों, masculine) became "minds you or I are acquainted with" (परिचित, which doesn''t change).'
    - what: reference
      hi: '*Hive Queen* (ऑर्सन स्कॉट कार्ड) और *Tines* (वर्नर विंज, *A Fire Upon the Deep*) के हिंदी अनुवाद नहीं हैं, इसलिए नाम वैसे ही रखे गए जैसे सुनाई देते हैं: हाइव क्वीन, टाइन्स। *Lt. Commander Data* "लेफ़्टिनेंट कमांडर डेटा" है; HAL लैटिन अक्षरों में रहा, जैसे 2001 के पोस्टरों पर।'
      en: 'The *Hive Queen* (Orson Scott Card) and the *Tines* (Vernor Vinge, *A Fire Upon the Deep*) have no Hindi translations, so the names stay as they sound: हाइव क्वीन, टाइन्स. *Lt. Commander Data* is लेफ़्टिनेंट कमांडर डेटा; HAL stays in Latin letters, as on the posters for *2001*.'
