  text: '- **रैक्नी:** चारों में सबसे इंसानी मूल्य। उसका मन "गीतों" में संवाद करता है, बिना शब्दों की एक तरह की बोली।'
  anchors:
    songs: गीतों
T40.C.04.3:
  text: '- **ज़ेनोमॉर्फ़:** उसकी कोई भाषा ही नहीं है, और उसकी एक ही चाह है: प्रजनन। चारों में वह सबसे कम मन जैसी है, हालाँकि उसमें माँ जैसी किसी भावना की झलक ज़रूर दिखती है।'
  anchors:
    reproduction: प्रजनन
    no language at all: कोई भाषा ही नहीं
