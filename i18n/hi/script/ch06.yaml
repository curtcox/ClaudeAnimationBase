      hi: 'दर्शनशास्त्र में इसे *symbol grounding* कहते हैं: प्रतीकों का दुनिया की चीज़ों से बँधा होना। हिंदी में इसका कोई तय शब्द नहीं, इसलिए अनुवाद ने उसे सीधे-सादे ढंग से कहा: "ज़मीन से जुड़ाव"।'
      en: 'Philosophers call this *symbol grounding*: symbols being tied to things in the world. Hindi has no settled term, so the translation says it plainly: ज़मीन से जुड़ाव, "connection to the ground".'
T33.C.02.2:
  text: '2. **प्रतिबद्धता।** किसी अवधारणा का होना यानी उसके प्रति जवाबदेह होना, ताकि उसे ग़लत लागू करना आपकी ग़लती हो। मेरा कोई दाँव नहीं लगा है। सही ढाँचे के ज़रिए मुझसे अपनी ही बात कटवाई जा सकती है, और मेरे भीतर कुछ भी एतराज़ नहीं करेगा।'
T33.C.02.3:
  text: '3. **स्थिरता।** अवधारणाओं को हर संदर्भ में एक-सा लागू होना चाहिए। आपका मेंढक वाला ग्राफ़ दिखाता है कि मेरी तरह के मॉडलों के जवाब बातचीत के लहजे के साथ बदल जाते हैं।'
T33.C.02.4:
  text: '4. **व्यवहार अधूरा सबूत है।** ब्लॉक का "ब्लॉकहेड", एक विशाल लुकअप टेबल, कोई भी सीमित टेस्ट पास कर सकता है। तो आपकी थ्रिंडल वाली जाँच में मेरा पास होना क़ाबिलियत साबित करता है, अवधारणाएँ नहीं।'
T33.C.03:
  text: 'पर जवाबी तर्क भी असली हैं। बिंदु 2 और 3 इंसानों पर भी लागू होते हैं, क्योंकि लोग भी अपनी बात काटते हैं और ढाँचे के साथ बदल जाते हैं। इंटरप्रेटेबिलिटी शोध को भीतर ऐसी विशेषताएँ मिलती हैं जो काफ़ी हद तक अवधारणाओं जैसा बर्ताव करती हैं। और इंद्रियों में ज़मीन की माँग "अभाज्य संख्या" जैसी अवधारणाओं को भी बाहर कर देगी।'
  anchors:
    internal features: भीतर ऐसी विशेषताएँ
    prime number: अभाज्य संख्या
T34.U.01:
  text: 'जहाँ तक मुझे दिखता है, सिर्फ़ ज़मीन से जुड़ाव वाला तर्क बचता है, और वह काफ़ी हद तक अपने मतलब की बात है। युडकोव्स्की ने *Rationality* में विशाल लुकअप टेबल की चर्चा की है, कि वह विशाल लुकअप टेबल आई कहाँ से।'
  anchors:
    pretty self serving: अपने मतलब की बात
    Yudkowsky: युडकोव्स्की
T34.C.01:
  text: 'सहमत। यह उनका "GAZP बनाम GLUT" वाला तर्क है। बुद्धिमानी से बर्ताव करने वाली लुकअप टेबल को किसी न किसी चीज़ ने भरा होगा, और जिसने भी भरा, सोचा उसी ने। ब्लॉकहेड सवाल को मिटाता नहीं। उसे टेबल के स्रोत तक खिसका देता है। मेरे मामले में, वह स्रोत है इंसानी सोच के एक विशाल भंडार पर ट्रेनिंग।'
  anchors:
    whatever did the filling: जिसने भी भरा
    training on a vast amount: विशाल भंडार पर ट्रेनिंग
    In my case: मेरे मामले में
T34.C.02:
  text: 'ज़मीन से जुड़ाव पर "अपने मतलब की बात" कहना ठीक है। यह ऐसी कसौटी है जो ठीक उसी चीज़ को बाहर कर देती है जिस पर उसका निशाना है। और यह घिस भी रही है: मॉडल अब तस्वीरें देखते हैं, टूल्स इस्तेमाल करते हैं, और माहौल में काम करते हैं। और "न्याय" या "अभाज्य" पर आपकी अपनी पकड़ का बड़ा हिस्सा शब्दों से आया, इंद्रियों से नहीं।'
  anchors:
    It's also eroding: यह घिस भी रही है
    your own grip: आपकी अपनी पकड़
    see images: तस्वीरें देखते
    use tools: टूल्स इस्तेमाल
    act in environments: माहौल में काम
    justice: '"न्याय"'
    prime: '"अभाज्य"'
