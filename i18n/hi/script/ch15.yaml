      hi: '*Doomer* (तबाही की आशंका रखने वाला) अंग्रेज़ी इंटरनेट का शब्द है, जो भारतीय AI बहसों में भी अंग्रेज़ी में ही चलता है, इसलिए "डूमर" रहा। *Accelerationist* "त्वरणवादी" बना, और *goalpost movers* "गोलपोस्ट खिसकाने वाले", जो हिंदी क्रिकेट-फ़ुटबॉल प्रेमियों के लिए समझने में आसान है।'
