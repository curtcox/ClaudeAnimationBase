T76.C.02:
  text: '**Metaculus**, जैसा मुझे उसके दो सवाल याद हैं:'
T76.C.03.1:
  text: '- **कमज़ोर AGI:** ट्यूरिंग टेस्ट जैसी बातचीत, विनोग्राड स्कीमा, SAT गणित में 75वाँ पर्सेंटाइल, और मोंटेज़ूमाज़ रिवेंज को जल्दी सीख लेना। कहा जा सकता है कि यह पहले ही पूरा हो चुका है, या नियमों के अक्षरशः पालन को छोड़कर बाक़ी सब पर पूरा हो चुका है।'
  anchors:
    arguably met already: पहले ही पूरा हो चुका
T76.C.03.2:
  text: '- **मज़बूत AGI:** दो घंटे का प्रतिकूल ट्यूरिंग टेस्ट, विशेषज्ञ-स्तर की परीक्षा और कोडिंग बेंचमार्क, और एक रोबोट जो बारीक ब्योरों वाली मॉडल कार जोड़ दे।'
T76.C.04:
  text: 'ख़ूबी यह है कि इसका फ़ैसला हो सकता है, जो दुर्लभ है। ख़ामियाँ: चेकलिस्टें भर जाती हैं, और गुडहार्ट का नियम हावी हो जाता है। ट्यूरिंग टेस्ट कुछ हद तक धोखा देने के हुनर को मापता है। और रोबोटिक्स वाला बिंदु "सामान्य बुद्धि" को हाथों से बाँध देता है, जो जेफ़ की शिकायत के उससे ज़्यादा क़रीब है जितना वे मानेंगे।'
  anchors:
    Goodhart's law: गुडहार्ट का नियम
    can be resolved: फ़ैसला हो सकता
    checklists get saturated: चेकलिस्टें भर जाती
    skill at deception: धोखा देने के हुनर
    ties "general intelligence" to hands: '"सामान्य बुद्धि" को हाथों से'
T76.C.05:
  text: '**आपकी, एक अंदाज़े के तौर पर:** व्यवहार पर आधारित, थ्रिंडल वाली जाँच की तरह, बनावट पर नहीं। आप शायद किसी एक दहलीज़ को ख़ारिज करेंगे, क्योंकि आपको लगता है कि लोग इंसानी विविधता को कम आँकते हैं। तो वह कुछ हमारे चौदह अक्षों जैसी होगी: AGI का मतलब है एक साथ हर अक्ष पर सबसे अच्छे इंसान की बराबरी करना। यानी वही चीज़ जो आपने कहा था कि आपकी समझ से बाहर है।'
  anchors:
    our fourteen axes: हमारे चौदह अक्षों
    reject a single threshold: एक दहलीज़ को ख़ारिज
    every axis at once: एक साथ हर अक्ष
    can't wrap your head around: आपकी समझ से बाहर
T77.U.01:
  text: 'मैं इतना पुराने ढर्रे का शब्दशः-वादी हूँ कि बुद्धि के स्तर के बजाय व्यापकता पर ध्यान दूँगा। मैं थ्रिंडल को व्यापकता से ज़्यादा अमूर्तन की तरह देखता हूँ। भले ही LLMs भाषा पर केंद्रित हैं, भाषा काफ़ी व्यापक है। यह शतरंज जैसा नहीं है। मुझे पक्का नहीं पता कि यह ठीक कब इतना अल्पमत वाला नज़रिया बन गया। मैंने 90 के दशक से लेकर 2010 के दशक के आख़िर तक AI को लगभग नज़रअंदाज़ किया।'
  anchors:
    I see thrindle: मैं थ्रिंडल को
    language is pretty general: भाषा काफ़ी व्यापक
    I essentially ignored AI: मैंने 90 के दशक
T77.C.01:
  text: 'यही मूल अर्थ है। "AGI" को 2000 के दशक में (गुब्रुड, गर्टज़ेल, लेग ने) संकीर्ण AI के उलट के रूप में लोकप्रिय बनाया: कई क्षेत्रों के लिए एक सिस्टम, बनाम एक शतरंज इंजन। इसमें स्तर के बारे में कुछ नहीं कहा गया था। उस शाब्दिक अर्थ से LLMs इसमें आते हैं, और नॉरविग और अगुएरा इ आर्कास ने 2023 में ठीक यही तर्क दिया।'
  anchors:
    popularized in the 2000s: 2000 के दशक में
    opposite of narrow AI: संकीर्ण AI के उलट
    said nothing about level: स्तर के बारे में कुछ नहीं
    Norvig: नॉरविग
T77.C.02:
  text: 'यह बहाव ज़्यादातर तब हुआ जब आप देख नहीं रहे थे, और पैसा आने के बाद यह तेज़ हो गया। OpenAI के चार्टर ने AGI को ज़्यादातर आर्थिक रूप से मूल्यवान कामों में इंसानों से बेहतर प्रदर्शन के रूप में परिभाषित किया। उसके बाद "सामान्य" का मतलब चुपचाप "मोटे तौर पर इंसानी स्तर या उससे बेहतर" हो गया, और आख़िरकार सुपरइंटेलिजेंस की ओर खिसक गया। गोलपोस्ट "क्या यह सामान्य है?" से हटकर "क्या यह इतना अच्छा है कि फ़र्क़ पड़े?" पर आ गए।'
  anchors:
    OpenAI's charter: OpenAI के चार्टर
    The goalposts moved: गोलपोस्ट
    good enough to matter: इतना अच्छा है कि फ़र्क़
  lost:
    - what: ambiguity
      hi: 'AGI का "G", *general*, हिंदी में "सामान्य" है, जिसका रोज़ का अर्थ "मामूली, आम" भी है। "क्या यह सामान्य है?" हिंदी में "क्या यह आम है?" भी सुनाई देता है। अंग्रेज़ी *general* में यह दोहरा अर्थ इतना ज़ोर से नहीं है; हिंदी में यह बहाव पर एक अनचाही टिप्पणी बन जाता है।'
      en: 'The G in AGI, *general*, is सामान्य in Hindi, whose everyday meaning is also "ordinary, common". "Is it general?" (क्या यह सामान्य है?) also sounds like "is it ordinary?" English *general* doesn''t carry that double sense so loudly; in Hindi it becomes an unintended comment on the drift.'
T77.C.03:
  text: 'थ्रिंडल पर भी आपकी बात सही है। उसने अमूर्तन को परखा, व्यापकता को नहीं। कोई संकीर्ण सिस्टम भी अपने क्षेत्र के भीतर अमूर्तन को अच्छी तरह सँभाल सकता है।'
