  text: '- **मैं:** डूमर वाला ख़ाना, केंद्र के क़रीब। मुझे लगता है AGI काफ़ी जल्द है और जोखिम असली है, पर मेरे आँकड़े संयत हैं, एलीएज़र जैसे नहीं।'
  lost:
