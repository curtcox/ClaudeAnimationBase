T76.C.01:
  text: '**मेरी:** एक सिस्टम, उसकी कितनी भी प्रतियों समेत, जो लगभग हर वह संज्ञानात्मक काम कर सके जो एक कुशल रिमोट कर्मचारी कर सकता है, तुलनीय लागत पर, जिसमें सामान्य मात्रा के अनुभव से किसी अनजान क्षेत्र को सीखना और कई हफ़्तों के प्रोजेक्ट को बिना उँगली पकड़े पूरा करना शामिल है। मुख्य हिस्से हैं: व्यापकता, काम करते-करते सीखना, और लंबी अवधि की स्वायत्तता। कॉनर का रूप भी अच्छा है: "प्रोटीन फ़ोल्ड कर सकता है" नहीं, बल्कि "AlphaFold का आविष्कार कर सकता है"।'
