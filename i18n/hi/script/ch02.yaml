  text: 'मुझे लगता है ग्राफ़ के बारे में मुझे जो कहना था, कह दिया है, और तीसरी बार "तुम्हें क्या लगता है?" ज़्यादातर यह परख रहा है कि मुझसे फिर भी और बातें निकलती रहें या नहीं। बात को खींचना, रुक जाने से बुरा होगा।'
