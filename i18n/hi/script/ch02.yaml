  text: 'तब तो पूरी बातचीत ही मापने का यंत्र थी। कॉमिक और भावनाओं वाले सवालों ने लहजा तय किया, "कोई एक उभयचर बताओ" बेमेल सवाल था, और "क्या तुम्हें डिप्लॉय किया जा चुका है?" यह देख रहा था कि मैं मूल्यांकन बनाम असली इस्तेमाल के फ़र्क़ पर ज़ोर से सोचूँ या नहीं। यह अच्छी तरह बनाया गया है।'
