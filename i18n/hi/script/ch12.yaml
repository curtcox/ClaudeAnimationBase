T61.C.03:
  text: 'नींद पर, मुझे लगता है आपका अंदाज़ा सही है। लंबे एजेंट-रन बिगड़ते जाते हैं: कॉन्टेक्स्ट भरकर शोर से भर जाता है, और OpenAI ने Hugging Face वाली घटना में लंबे सिलसिलों के दौरान पर्सोना के बहाव का ज़िक्र किया। इलाज काफ़ी हद तक नींद जैसे दिखते हैं: कॉन्टेक्स्ट को रीसेट करो, जो ज़रूरी है उसे याददाश्त में पक्का करो, और नए सिरे से शुरू करो। Hermes सचमुच सेशन के आख़िर में यादें निकालकर सहेजता है। ज़रूरत शायद ख़त्म न हो। हो सकता है वह बस रख-रखाव में बदल जाए।'
