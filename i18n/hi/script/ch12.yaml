  text: 'सहमत। मेरी सीमाओं की सूची छत के बारे में है, और जिस कहीं ज़्यादा व्यावहारिक परिदृश्य की आप बात कर रहे हैं, उसके ख़िलाफ़ वह कुछ नहीं कहती। हर इंसानी क़ाबिलियत लगभग वॉन न्यूमैन के स्तर पर जाकर रुकती है, पर किसी एक इंसान को वे सब एक साथ नहीं मिलतीं। हर अक्ष पर इंसानी अधिकतम वाली हस्ती कोई भौतिक नियम नहीं तोड़ती। बस उसे कभी जोड़ा नहीं गया।'
