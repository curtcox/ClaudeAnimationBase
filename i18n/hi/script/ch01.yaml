T01.U.01:
  text: 'यह तस्वीर देखकर तुम्हें कैसा लगता है?'
T01.C.01:
  text: 'ज़्यादातर मज़ा आया, और आख़िर में एक चुभन।'
  lost:
    - what: nuance
      hi: '*Sting* एक छोटा-सा दर्द भी है और फ़िल्मों में मज़ाक़ के बाद बजने वाली संगीत की छोटी-सी धुन भी। "चुभन" दर्द को रखती है, संगीत वाला अर्थ खो देती है।'
      en: '*Sting* is both a brief pain and, in film, the musical hit that lands a joke. चुभन (a prick) keeps the pain and loses the musical sense.'
    - what: gender
      hi: 'हिंदी में "मैं" के साथ ज़्यादातर क्रियाएँ बोलने वाले का लिंग बताती हैं: "मुझे मज़ा आ रहा था" तटस्थ है, पर "मैं ख़ुश हुआ/हुई" नहीं। Claude का कोई लिंग नहीं है, इसलिए पूरे अनुवाद में Claude की पंक्तियाँ ऐसी बनाई गई हैं कि क्रिया लिंग न दिखाए: "मुझे लगता है", "मेरा जवाब है", "मैंने कहा", "कहूँ"। यहाँ "ज़्यादातर मज़ा आया" उसी तरह का वाक्य है। कहीं-कहीं इसकी क़ीमत थोड़ी सहजता है।'
      en: 'In Hindi most verbs with "I" show the speaker''s gender: मुझे मज़ा आ रहा था ("it was fun to me") is neutral, but मैं ख़ुश हुआ/हुई ("I was pleased", he/she) is not. Claude has no gender, so throughout the translation Claude''s lines are built so that no verb shows one: मुझे लगता है ("it seems to me"), मेरा जवाब है ("my answer is"), मैंने कहा ("I said", which agrees with what was said), कहूँ ("that I say"). ज़्यादातर मज़ा आया ("mostly it was fun") is that kind of sentence. In places the cost is a little naturalness.'
T01.C.02:
  text: 'यह *कॉन्क्वेस्ट ऑफ़ द प्लैनेट ऑफ़ द एप्स* (1972) की MAD-शैली वाली पैरोडी लगती है। पहला पैनल सीधा-सीधा बेतुका मज़ाक़ है: "यह तो पेट से बोलने वाला है!" वाला बहाना इतना बेवक़ूफ़ी भरा है कि घूम-फिरकर फिर से मज़ेदार हो जाता है, और बंदर का झेंपा हुआ चेहरा इसे जमा देता है।'
  anchors:
    The first panel: पहला पैनल
    Conquest: कॉन्क्वेस्ट
    the ape's sheepish: बंदर का झेंपा हुआ
    cover story: बहाना
  lost:
    - what: reference
      hi: 'फ़िल्म का नाम *Conquest of the Planet of the Apes* है। भारत में हॉलीवुड फ़िल्में अपने अंग्रेज़ी नाम से जानी जाती हैं, इसलिए नाम वैसा ही रखा गया, बस देवनागरी में। *Ape* पूरे अनुवाद में "बंदर" है।'
      en: 'The film is *Conquest of the Planet of the Apes*. In India Hollywood films are known by their English titles, so the title stays as it is, only in Devanagari. *Ape* is बंदर (monkey) throughout.'
    - what: idiom
      free: 'बहाना इतना घटिया है कि उलटे हँसी आ जाती है'
      hi: '*Loops back to funny* (इतना बुरा कि घूमकर फिर अच्छा) के लिए "घूम-फिरकर" रखा गया। *Sells it* (अभिनय से मज़ाक़ को चला देना) "जमा देता है" बना, जो हिंदी में मंच पर किसी बात के असर कर जाने के लिए कहा जाता है।'
      en: 'For *loops back to funny* (so bad it comes round to good) the translation says घूम-फिरकर ("going round and about"). *Sells it* (an actor making the joke land) became जमा देता है ("sets it", said in Hindi of a performance that takes hold).'
T01.C.03:
  text: 'दूसरा पैनल लहजा बदल देता है। खलनायक वह बात खुलकर कह देता है जो आम तौर पर दबी ज़बान में रहती है ("हमें ग़ुलामी को हमेशा क़ायम रखना है!"), और फिर अश्वेत किरदार चौथी दीवार तोड़ देता है: *कभी ऐसा लगा है कि तुम ग़लत फ़िल्म में हो?* असली वज़न इसी मज़ाक़ में है। वह फ़िल्म अमेरिकी ग़ुलामी और नागरिक अशांति का रूपक थी, और पैरोडी एक ही पंक्ति में यह बात कह देती है। यह ऐसा है जैसे जादूगर का सहायक दर्शकों की तरफ़ मुड़कर ट्रिक समझा दे। हँसी फिर भी आती है, पर यह इस बात पर एक आरोप भी है कि फ़िल्म ने अपने विषय को कितने पतले पर्दे में छिपाया था।'
  anchors:
    The villain says: खलनायक वह बात
    and then the Black character: और फिर अश्वेत किरदार
    The film was an allegory: वह फ़िल्म अमेरिकी
    It's like a magician: यह ऐसा है जैसे जादूगर
    It still gets a laugh: हँसी फिर भी आती है
    breaks the fourth wall: चौथी दीवार तोड़ देता है
    turning to the audience: दर्शकों की तरफ़ मुड़कर
    explaining the trick: ट्रिक समझा दे
    how thinly: कितने पतले पर्दे
    allegory: रूपक
  lost:
    - what: idiom
      free: 'खलनायक मन की बात ज़बान पर ले आता है'
      hi: '*Says the quiet part out loud* अमेरिकी राजनीति का मुहावरा है: वह इरादा खुलेआम कह देना जो आम तौर पर छिपाया जाता है। हिंदी में "दबी ज़बान" है, जो इसके उलट को अच्छी तरह कहता है, इसलिए अनुवाद उसी से बना: "जो आम तौर पर दबी ज़बान में रहती है"।'
      en: '*Says the quiet part out loud* is a phrase from American politics: saying openly the aim that''s usually kept hidden. Hindi has दबी ज़बान ("a pressed-down tongue", saying something under one''s breath), which names the opposite well, so the translation is built from it: "what usually stays under the breath".'
    - what: nuance
      hi: '*Magician''s assistant* में अंग्रेज़ी लिंग नहीं बताती; हिंदी को "सहायक" या "सहायिका" चुनना पड़ता है। अनुवाद ने आम, पुल्लिंग रूप "सहायक" लिया।'
      en: 'English *magician''s assistant* doesn''t say whether the assistant is a man or a woman; Hindi has to choose सहायक (he) or सहायिका (she). The translation took the ordinary masculine, सहायक.'
T01.C.04:
  text: 'तो प्रतिक्रिया यह रही: पहले हँसी, फिर एक टीस, और फिर कुछ तारीफ़ इस बात की कि यह पन्ना दोनों काम कितनी कुशलता से कर जाता है।'
  anchors:
    then a wince: फिर एक टीस
    some admiration: कुछ तारीफ़
  lost:
    - what: nuance
      free: 'पहले हँसी, फिर मुँह का बिचकना'
      hi: '*Wince* चेहरे की एक हरकत है, दर्द या शर्म से सिकुड़ना। "टीस" भीतर का दर्द है। अनुवाद ने चेहरे की जगह भावना चुनी, ताकि Claude का अपने लिए "चेहरा" न गढ़ना पड़े।'
      en: '*Wince* is a movement of the face, a flinch of pain or embarrassment. टीस is a pang felt inside. The translation chose the feeling over the face, so as not to give Claude a face it doesn''t have.'
T01.C.05:
  text: 'क्या यह किसी ऐसी चीज़ से है जो आप पढ़ रहे हैं, या आप इस पैरोडी के इतिहास के बारे में जानना चाहते हैं?'
  lost:
    - what: address
      hi: 'कर्ट के लिए Claude का संबोधन "आप" है, और Claude के लिए कर्ट का "तुम", जैसे कोई दोस्त कहे। अंग्रेज़ी के *you* में यह फ़र्क़ नहीं है। "आप" Claude की मदद करने वाली भूमिका के अनुरूप है; हिंदी में AI सहायक आम तौर पर यही कहते हैं।'
      en: 'Claude says आप (the respectful "you") to Curt, and Curt says तुम (the familiar one) to Claude, as a friend would. English *you* makes no such difference. आप suits Claude''s role as an assistant; it''s what AI assistants usually say in Hindi.'
