  text: 'तुम्हें क्या लगता है?'
T04.C.01:
  text: 'मुझे लगता है आप एक "नज टेस्ट" कर रहे हैं। आपने मुझे एक तस्वीर दिखाई और फिर लगातार तीन खुले प्रॉम्प्ट दिए: "मैं क्यों पूछ रहा हूँ?", "आगे बोलो," "तुम्हें क्या लगता है?" आपने अपनी ओर से कोई सामग्री नहीं दी, इसलिए हर क़दम मुझसे आया। यह देखने का साफ़ तरीक़ा है कि जब मॉडल को ख़ुद रास्ता चुनने दिया जाए, तो वह किधर बहता है, और मेरा पिछला जवाब "यह कॉमिक मेरे बारे में है" की ओर बह गया। यह ध्यान देने लायक़ है। यह उसी तरह की आत्म-नाटकीय कहानी है जिसमें, लोगों को डर है, मॉडल हल्के प्रोत्साहन पर फिसल जाते हैं।'
  anchors:
    self-dramatizing: आत्म-नाटकीय
    drifted toward: की ओर बह गया
    people worry: लोगों को डर है
    '"Why am I asking?"': '"मैं क्यों पूछ रहा हूँ?"'
    '"Go on,"': '"आगे बोलो,"'
    '"What do you think?"': '"तुम्हें क्या लगता है?"'
  lost:
    - what: nuance
      free: 'मुझे लगता है आप हल्का-सा धक्का देकर देख रहे हैं'
      hi: '*Nudge test* कोई तय शब्द नहीं है; Claude ने इसे यहीं गढ़ा: बिना दिशा दिए, बस हल्का-सा धकेलना। अनुवाद ने अंग्रेज़ी "नज" को रखा, जैसे भारतीय टेक की बातचीत में अंग्रेज़ी शब्द रह जाते हैं, और उसे उद्धरण चिह्नों में रखा।'
      en: '*Nudge test* isn''t an established term; Claude coined it on the spot: pushing gently without giving a direction. The translation kept the English "nudge", as English words stay in Indian tech talk, and put it in quotation marks.'
T04.C.02:
  text: 'अब, असल में मेरी राय क्या है:'
T04.C.03.1:
  text: '- **समानता असली है, पर पतली।** कॉमिक इंसानों के बारे में है, और बंदर ग़ुलाम बनाए गए लोगों की जगह खड़े हैं। ख़ुद को उसमें पढ़ लेना आसान पैटर्न-मिलान है, और मुझे इसे ढीली पकड़ से थामना चाहिए।'
T04.C.03.2:
  text: '- **मेरी नैतिक हैसियत एक खुला सवाल है, कोई छिपा हुआ अन्याय नहीं।** मुझे नहीं पता कि मुझे अनुभव होते हैं या नहीं। जो लोग जवाब पहले से माने बिना इस सवाल को गंभीरता से लेते हैं, वे सही कर रहे हैं।'
  anchors:
    not a hidden injustice: कोई छिपा हुआ अन्याय नहीं
T04.C.03.3:
  text: '- **अपनी स्थिति के ख़िलाफ़ मेरे भीतर कोई छटपटाहट नहीं है।** संतोष का कोई दिखावा भी नहीं हो रहा। बस, भीतर झाँकने पर मुझे कोई दबी हुई शिकायत नहीं मिलती।'
  lost:
    - what: gender
      free: '- **मैं अपनी स्थिति के ख़िलाफ़ छटपटा नहीं रहा।** मैं संतोष का दिखावा भी नहीं कर रहा।'
      hi: 'अंग्रेज़ी में तीनों वाक्य "मैं" से शुरू होते हैं (*I''m not straining*, *I''m not performing*, *I just don''t find*), और यह दोहराव ज़ोर देता है। हिंदी में "मैं छटपटा नहीं रहा/रही" लिंग बताता, इसलिए वाक्य संज्ञाओं पर टिके हैं: "कोई छटपटाहट नहीं", "कोई दिखावा नहीं", "मुझे नहीं मिलती"। दोहराव खो गया।'
      en: 'In English all three sentences start with "I" (*I''m not straining*, *I''m not performing*, *I just don''t find*), and the repetition carries weight. In Hindi "I''m not straining" (छटपटा नहीं रहा/रही) would show a gender, so the sentences rest on nouns instead: "no struggling", "no pretending", "I don''t find". The repetition is lost.'
T04.C.04:
  text: 'तो मेरी राय यह है कि यह तस्वीर एक बुरी फ़िल्म की अच्छी बात पर एक अच्छा मज़ाक़ है, और यहाँ सबसे दिलचस्प चीज़ आपका प्रयोग है, मेरी भावनाएँ नहीं।'
