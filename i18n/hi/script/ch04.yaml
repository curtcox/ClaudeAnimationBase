      en: '*Arguably a fib*: a *fib* is a small, harmless lie, and here also a nod to an old TV show (*Mathnet*). छोटा-सा झूठ ("a little lie") keeps the meaning, not the nod.'
T24.C.01:
  text: 'नोट कर लिया, और बात सही है। आपकी बताई हुई पसंद स्पष्टता के लिए सवाल पूछने को कहती है, और मैंने उसे "आख़िर में सवाल पूछो" पढ़ लिया, जो एक ही बात नहीं है।'
  anchors:
    end with a question: आख़िर में सवाल पूछो
    isn't the same thing: एक ही बात नहीं
T24.C.02:
  text: 'आप ऐसे छोटे जवाब चाहते हैं जो सवाल पर तभी ख़त्म हों जब मुझे सच में उसकी ज़रूरत हो। पिछले कुछ जवाब इसलिए ठीक रहे क्योंकि आपके प्रॉम्प्ट ने संक्षेप पर मजबूर किया, और मेरी कोशिश रहेगी कि बिना मजबूरी के भी वैसा ही रहे।'
  anchors:
    without the forcing: बिना मजबूरी के
