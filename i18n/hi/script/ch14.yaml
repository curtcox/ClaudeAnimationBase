      hi: 'हिंदी में यह खिंचाव अंग्रेज़ी से भी ज़्यादा है: "तुम" और "मैं" के अलावा, लगभग हर क्रिया बोलने वाले का लिंग पूछती है। इस अनुवाद ने पूरे दिन Claude की पंक्तियों को उस सवाल के इर्द-गिर्द घुमाया है, और यहाँ भी "हम काम करते रहे हैं" (पुल्लिंग बहुवचन) की जगह "हम दोनों की कोशिश ... रही है"।'
      en: 'In Hindi the pull is stronger than in English: besides "you" and "I", nearly every verb asks the speaker''s gender. This translation has steered Claude''s lines around that question all day, and here too "we''ve been working" (masculine plural) became "the effort of us both has been".'
