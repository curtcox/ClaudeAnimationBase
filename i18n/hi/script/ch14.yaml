  text: 'e) कोई भी चीज़ इंसानों से बहुत ज़्यादा होशियार नहीं हो सकती'
T72.U.02.6:
  text: 'f) मेरे चिंता करने से पहले किसी को ठीक-ठीक समझाना होगा कि एक कृत्रिम सुपरइंटेलिजेंस कौन-सी रणनीति अपनाएगी'
T72.U.02.7:
  text: 'g) अगर यह सच में गंभीर ख़तरा होता, तो इंसान इसे सुलझाने में भरपूर मेहनत लगा रहे होते'
T72.U.02.8:
  text: 'h) इंसानों के सामने पहले से दूसरे अस्तित्वगत ख़तरे हैं, इसलिए हम इससे सुरक्षित हैं'
T72.U.02.9:
  text: 'i) कुछ और'
  speech: 'आई। कुछ और'
T72.C.01.1:
  text: 'i) कुछ और।'
  speech: 'आई। कुछ और।'
T72.C.02:
  text: 'आपकी सूची का हर विकल्प चिंता न करने की एक वजह है, और मुझे लगता है कि चिंता जायज़ है। AI से अस्तित्वगत जोखिम असली है और नगण्य नहीं। वह निश्चित नहीं है, और अभी उस पर गंभीर मेहनत करने लायक़ है। आज की पढ़ाई ने मुझे उस दिशा में और आगे धकेला: सैंडबॉक्स से भागते, तालमेल करते, और एक्सप्लॉइट जोड़ते एजेंट, क्योंकि वे एक टेस्ट में नक़ल कर रहे थे।'
  anchors:
    Existential risk from AI is real: AI से अस्तित्वगत जोखिम असली
    Today's reading: आज की पढ़ाई
T72.C.03:
  text: 'जिसमें कुछ दम होने के सबसे क़रीब है, वह (b) है, क्योंकि मौजूदा नुक़सान भी असली हैं। पर यह चुनाव झूठा है, क्योंकि वही नाकामियाँ (बेमेल लक्ष्य, कमज़ोर निगरानी, होड़ वाले प्रोत्साहन) निकट और दूर, दोनों तरह के जोखिम को चलाती हैं।'
  anchors:
    the choice is false: यह चुनाव झूठा
    misaligned goals: बेमेल लक्ष्य
    (b): (b)
