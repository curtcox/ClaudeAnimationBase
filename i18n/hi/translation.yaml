# film-wide notes, not tied to one line (ch: null is the whole film)
notes:
  - what: title
    ch: null
    where: शीर्षक / title
    original: 'Frog or Axolotl'
    ours: 'मेंढक या एक्सोलोटल'
    free: 'मेंढक या कुछ और?'
    hi: 'अंग्रेज़ी शीर्षक तीन छोटे, सपाट शब्द है, और हिंदी भी उतना ही छोटा है। फ़र्क़ दूसरे शब्द में है: अंग्रेज़ी बोलने वालों में से बहुत-से *axolotl* को इंटरनेट से पहचानते हैं; हिंदी में "एक्सोलोटल" एक अजनबी शब्द है, जिसे शायद समझाना पड़े।'
    en: 'The English title is three short, flat words, and the Hindi is just as short. The difference is the second word: many English speakers know *axolotl* from the internet; in Hindi एक्सोलोटल is a strange word that may need explaining.'
  - what: gender
    ch: null
    where: पूरी फ़िल्म / the whole film
    original: 'I think / I can / I''ll be back'
    ours: 'मुझे लगता है / मेरे बस में है / आइ''ल बी बैक'
    free: 'मैं सोचता हूँ / मैं कर सकता हूँ / मैं लौटूँगा'
    hi: 'अंग्रेज़ी में "I" का कोई लिंग नहीं होता, और Claude के बारे में "it" कहा जाता है। हिंदी में पहले पुरुष की ज़्यादातर क्रियाएँ (वर्तमान, भविष्य, अकर्मक भूत) और कई विशेषण लिंग माँगते हैं। अनुवाद ने Claude की हर पंक्ति ऐसे बनाई कि लिंग न आए: "मुझे लगता है", "मेरे बस में नहीं", कर्मवाच्य ("मुझसे नहीं हो सकता"), ने-वाला भूतकाल ("मैंने कहा"), और संभावनार्थ ("कहूँ")। कई जगह यह सहज भी है, कुछ जगह थोड़ा भारी; हर ऐसी जगह नीचे दर्ज है। फ़िल्म की आख़िरी पंक्ति, *I''ll be back*, अंग्रेज़ी में ही रखी गई, जो इसका सबसे साफ़ उदाहरण है।'
    en: 'In English "I" has no gender, and Claude is called "it". In Hindi most first-person verbs (present, future, intransitive past) and many adjectives demand one. The translation built every line of Claude''s so none comes in: मुझे लगता है ("it seems to me"), मेरे बस में नहीं ("not in my power"), the passive ("it can''t be done by me"), the ergative past (मैंने कहा, "I said"), and the subjunctive (कहूँ, "that I say"). In many places that''s natural too, in some a little heavy; each such place is noted below. The film''s last line, *I''ll be back*, stays English, the clearest case.'
  - what: address
    ch: null
    where: पूरी फ़िल्म / the whole film
    original: 'you'
    ours: 'आप (Claude से कर्ट) / तुम (कर्ट से Claude)'
    free: 'तुम / तुम'
    hi: 'अंग्रेज़ी का *you* बराबरी का है। हिंदी में Claude का "आप" उसे सहायक की जगह रखता है, और कर्ट का "तुम" दोस्ती की। दोनों तरफ़ "तुम" ज़्यादा बराबरी वाला होता, पर Claude के मुँह से कम विनम्र लगता।'
    en: 'English *you* is level. In Hindi Claude''s आप puts it in an assistant''s place, and Curt''s तुम in a friend''s. तुम both ways would be more equal, but less polite from Claude.'
  - what: title
    ch: 0
    where: अध्याय का शीर्षक / chapter title
    original: 'Cold open'
    ours: 'शुरुआत'
    free: 'कोल्ड ओपन'
    hi: '*Cold open* अमेरिकी टीवी का शब्द है: वह दृश्य जो शीर्षक से पहले, बिना किसी परिचय के शुरू हो जाता है। हिंदी में इसका कोई तय शब्द नहीं, इसलिए "शुरुआत" रखा गया, जो अर्थ रखता है, टीवी वाला रंग नहीं।'
    en: '*Cold open* is an American television term: the scene that starts before the titles, with no introduction. Hindi has no set word for it, so it''s शुरुआत (the beginning), which keeps the meaning and loses the TV colour.'
  - what: title
    ch: 7
    where: अध्याय का शीर्षक / chapter title
    original: 'Mind-Space'
    ours: 'मनों का दायरा'
    free: 'माइंड-स्पेस'
    hi: '*Mind-Space* विज्ञान-कथा के अंदाज़ में हाइफ़न से जुड़ा एक संयुक्त शब्द है। "मनों का दायरा" अर्थ बताता है, पर गढ़े हुए तकनीकी शब्द वाला अहसास खो देता है।'
    en: '*Mind-Space* is a hyphenated compound in the style of science fiction. मनों का दायरा ("the range of minds") says what it means but loses the feel of an invented technical term.'
  - what: title
    ch: 9
    where: अध्याय का शीर्षक / chapter title
    original: 'Shells'
    ours: 'खोल'
    free: 'शेल'
    hi: 'अंग्रेज़ी शीर्षक *shell* के दोनों अर्थों से खेलता है: क्रस्टाफ़ेरियनिज़्म के लॉबस्टर का कवच, और मॉडल के चारों ओर लिपटा सॉफ़्टवेयर का "शेल"। हिंदी "खोल" दोनों को काफ़ी हद तक ढक लेता है, क्योंकि ख़ाली खोल किसी भी चीज़ का आवरण हो सकता है।'
    en: 'The title plays on both senses of *shell*: the lobster''s carapace in Crustafarianism and the software shell wrapped around a model. Hindi खोल covers both fairly well, since a खोल can be the casing of anything.'
  - what: title
    ch: 14
    where: अध्याय का शीर्षक / chapter title
    original: 'The Pundits'
    ours: 'पंडित'
    free: 'टीवी के जानकार'
    hi: 'अंग्रेज़ी *pundit* ख़ुद हिंदी-संस्कृत के "पंडित" से गया था: विद्वान, फिर मीडिया में राय देने वाला। यहाँ शब्द अपने घर लौट आता है, पर अंग्रेज़ी का हल्का व्यंग्य उसमें कम है, क्योंकि हिंदी में "पंडित" आदर भी जगाता है।'
    en: 'English *pundit* came from Hindi and Sanskrit पंडित in the first place: a scholar, then a media opinion-giver. Here the word comes home, but with less of the English irony, since in Hindi पंडित also commands respect.'
  - what: title
    ch: 16
    where: अध्याय का शीर्षक / chapter title
    original: 'Coda'
    ours: 'उपसंहार'
    free: 'कोडा'
    hi: '*Coda* संगीत का शब्द है: किसी रचना के आख़िर में जुड़ा छोटा हिस्सा। "उपसंहार" किसी किताब या भाषण का समापन है; अर्थ वही, पर संगीत वाला अर्थ छूट जाता है।'
    en: '*Coda* is a musical term: the short passage that ends a piece. उपसंहार is the closing of a book or a speech; the meaning holds, but the musical sense is lost.'
