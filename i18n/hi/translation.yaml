  idiom:      { hi: मुहावरे, en: Idioms, what_hi: 'अंग्रेज़ी के तय जुमले, जिनका हिंदी में कोई ठीक-ठीक जोड़ नहीं।', what_en: 'English set phrases with no exact equivalent.' }
