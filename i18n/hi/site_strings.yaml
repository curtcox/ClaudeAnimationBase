index_title: 'मेंढक या एक्सोलोटल: कड़ियाँ'
explained: व्याख्या
index_intro: >-
  <p>कर्ट और AI प्रोग्राम Claude के बीच शनिवार की एक सुबह हुई लंबी बातचीत से बनी एक एनिमेटेड फ़िल्म। बातचीत विज्ञान-कथा, दर्शन और AI की ताज़ा ख़बरों के बीच घूमती रहती है, इसलिए यह ऐसे विषयों से भरी है जिन्हें ज़्यादातर लोग नहीं जानते।</p><p>वे सब यहाँ हैं, अध्याय-दर-अध्याय, क्रम से। जहाँ सिर्फ़ एक कड़ी काफ़ी नहीं, वहाँ एक छोटी, आसान व्याख्या है। <strong>पीली चीज़ें व्याख्याएँ हैं।</strong> अगर फ़िल्म में कहीं उलझन हो, तो वहीं से शुरू कीजिए।</p>
  <p class="note">यह हिंदी संस्करण है। फ़िल्म और यह साइट Claude ने, जान-बूझकर बिना किसी इंसानी जाँच के, अनुवाद की है: <a href="anuvad/">अनुवाद कैसे हुआ, और क्या छूट गया</a>। मूल अंग्रेज़ी साइट <a href="../">curtcox.github.io/axol-f</a> पर है।</p>
