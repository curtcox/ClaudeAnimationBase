index_notes: >-
  <p class="note">व्याख्याएँ फ़िल्म के AI, Claude, ने इस साइट के लिए लिखी हैं, और उनकी कड़ियों वाले स्रोतों से मिलाकर जाँची हैं। ज़्यादातर स्रोत अंग्रेज़ी में हैं। फ़िल्म पूरी होने तक समय थोड़े खिसक सकते हैं।</p>
  <p class="note">इस फ़िल्म का हर दृश्य Claude ने कोड से बनाया है। कर्ट को आधार वाला कोड इसी तरह बनी एक पिछली फ़िल्म, <a href="https://curtcox.github.io/PDoomVideo/">I'm Upping My P(doom)</a> (उसकी व्याख्या वाली साइट, अंग्रेज़ी में), से मिला।</p>
  <p class="note">इस साइट का नाम <em>axol-f</em> क्यों? एक्सोलोटल का अंग्रेज़ी नाम axolotl है, जो <a href="https://www.youtube.com/watch?v=k85mRPqvMbE">Crazy Frog के "Axel F"</a> से बस एक अक्षर दूर है: मेंढक या एक्सोलोटल।</p>
