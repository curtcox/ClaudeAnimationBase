# Speech-only respellings for the Hindi voice, applied in order to every spoken line after markdown is stripped
# (tools/script_lib.mjs's autoSpeech; format as script/pronounce.yaml). They change what's said, never what's painted.
# Names and acronyms written in Latin letters are said the way Hindi speakers in tech say them. verify: true = a guess
# to check by ear.
# Longer matches first, so a name inside a longer one (foom in P(foom)) is left to the longer rule.
