  coinage:    { fr: Inventions et emprunts, en: Coinages and loanwords, what_fr: "Des mots inventés ou techniques, souvent repris de l’anglais.", what_en: "Invented or technical words, often taken over from English." }
  reference:  { fr: Références et titres, en: References and titles, what_fr: "Des œuvres qui portent un autre nom en français, ou aucun.", what_en: "Works known by another name, or none, in French." }
  quote:      { fr: Citations, en: Quotations, what_fr: "Des mots cités d’ailleurs.", what_en: "Words quoted from somewhere else." }
  region:     { fr: Ancrage local, en: Local reference, what_fr: "Des choses qui portent un autre nom en français parce qu’elles sont chez elles ailleurs.", what_en: "Things named differently in French because they belong somewhere else." }
  rhythm:     { fr: Rythme et longueur, en: Rhythm and length, what_fr: "Le français est plus long, et le rythme change.", what_en: "French runs longer, and the rhythm changes." }
  typo:       { fr: Les fautes de frappe de Curt, en: "Curt’s typos", what_fr: "Des fautes de frappe qui ne survivent pas à la traduction.", what_en: "Typing mistakes that don’t survive translation." }
  title:      { fr: Le titre, en: The title, what_fr: "Le nom du film et de ses chapitres.", what_en: "The name of the film and its chapters." }

# film-wide notes, not tied to one line (ch: null is the whole film)
notes:
  - what: title
    ch: null
    where: titre / title
    original: 'Frog or Axolotl'
    ours: 'Grenouille ou axolotl'
    fr: "Un coup de chance : l’axolotl s’appelle en français comme en anglais, et *frog*, c’est « grenouille ». Le titre survit mot pour mot. Seul le jeu de mots du dépôt, *axol-f*, clin d’œil à « Axel F », le thème du *Flic de Beverly Hills* que Crazy Frog a rendu célèbre, est une blague anglaise ; mais on la comprend aussi bien en français."
    en: "A lucky one: the axolotl is called the same in French as in English, and *frog* is *grenouille*. The title survives word for word. Only the repository's pun, *axol-f*, a nod to \"Axel F\", the *Beverly Hills Cop* theme Crazy Frog made famous, is an English joke, and French speakers get it just the same."
  - what: address
    ch: null
    where: "l’adresse / address"
    original: 'you'
    ours: 'tu'
    free: 'vous'
    fr: "L’anglais n’a que *you*. La traduction fait se tutoyer Curt et Claude, comme on le fait dans une conversation détendue et souvent en écrivant à une IA. Le vouvoiement était possible aussi et aurait rendu la conversation plus formelle ; avec « tu », que Claude connaisse les préférences de Curt de mémoire sonne plus familier que ne le dit l’anglais."
    en: "English has only *you*. The translation has Curt and Claude say the familiar *tu* to each other, as people do in casual conversation and often when writing to an AI. The formal *vous* was possible too and would have made the conversation more formal; with *tu*, Claude knowing Curt's preferences from memory sounds more familiar than the English says."
  - what: gender
    ch: null
    where: "Claude à la première personne / Claude in the first person"
    original: 'amused, sure, deployed…'
    ours: "de l’amusement, je ne sais pas trop, en service…"
    free: 'amusé, sûr, déployé…'
    fr: "En anglais, Claude peut dire *amused* ou *sure* sans révéler de genre. En français, chaque adjectif ou participe à la première personne en choisirait un (« amusé » ou « amusée »). La traduction tourne les phrases autrement, par des noms, d’autres verbes ou des tournures impersonnelles, ce qui donne parfois à Claude une façon de parler un peu plus soutenue que dans l’original."
    en: "In English, Claude can say *amused* or *sure* without revealing a gender. In French, every first-person adjective or participle would choose one (*amusé* or *amusée*). The translation turns the sentences another way, with nouns, other verbs or impersonal phrasing, which sometimes makes Claude sound a little more formal than in the original."
  - what: gender
    ch: null
    where: "Claude à la troisième personne / Claude in the third person"
    original: 'it'
    ours: 'Claude, il'
    free: 'il, avec des adjectifs au masculin'
    fr: "L’anglais appelle Claude *it*. Le français n’a pas de neutre : le site dit « Claude », ou « il », le pronom du programme et du modèle, mais sans jamais accorder d’adjectif à Claude. Ce « il » reste celui d’un mot masculin, pas un genre donné à Claude ; une traduction plus libre ne se poserait pas la question."
    en: "English calls Claude *it*. French has no neuter: the site says \"Claude\", or *il*, the pronoun of *le programme* and *le modèle*, but never gives Claude an agreeing adjective. That *il* stays a masculine noun's pronoun, not a gender given to Claude; a freer translation wouldn't think twice."
  - what: title
    ch: 0
    where: titre de chapitre / chapter title
    original: 'Cold open'
    ours: 'Prégénérique'
    free: 'Cold open'
