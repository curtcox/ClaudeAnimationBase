sections:
  - fr_title: Cette page
    en_title: This page
    fr: |
      *Grenouille ou axolotl* est un film d’animation tiré d’une vraie conversation, mot pour mot, entre Curt Cox et
      Claude, un programme d’IA d’Anthropic. La conversation était en anglais. Voici la version française.

      Cette page explique comment le film a été traduit, comment il aurait pu l’être autrement, et ce qui aurait alors été
      différent, ligne par ligne. Tout est dans les deux langues, pour que quiconque parle les deux puisse juger la
      traduction par lui-même. Il y a aussi [tout le film, en anglais et en français, côte à côte](texte-integral/).
    en: |
      *Frog or Axolotl* is an animated film made from a real conversation, word for word, between Curt Cox and Claude,
      an AI program made by Anthropic. The conversation was in English. This is the French version.

      This page explains how it was translated, how else it could have been, and what would have been different, line
      by line. Everything is in both languages so that anyone who speaks both can judge the translation for themselves.
      There’s also [the whole film, in English and French, side by side](texte-integral/).

  - fr_title: Qui l’a traduit
    en_title: Who translated it
    fr: |
      Claude (le modèle Claude Opus 5.5) a tout traduit : chaque ligne de la conversation, chaque mot dessiné dans
      l’image, les titres, les légendes des codes, le site qui accompagne le film (ses 64 explications et ses pages) et
      cette page, y compris les notes sur ce qui s’est perdu.

      Une des raisons de faire cette version est de montrer, tel quel, comment Claude traduit. C’est pourquoi **aucun
      traducteur humain ne l’a corrigée**, et toute correction ultérieure sera signalée sur cette page avec sa date (et
      restera aussi dans l’historique public du code).

      Jusqu'ici : {lines} lignes traduites sur {total} (chapitres {chapters_done}). Relecture humaine : aucune pour
      l’instant.
    en: |
      Claude (the Claude Opus 5.5 model) translated all of it: every line of the conversation, every word drawn in the
      picture, the titles, the codes' captions, the site that goes with the film (its 64 explainers and its pages) and
      this page, including the notes on what was lost.

      One reason for making this version is to show, untouched, how Claude translates. So **no human translator
      corrected it**, and any later correction will be noted on this page with its date (and stays in the code’s public
      history too).

      So far: {lines} of {total} lines translated (chapters {chapters_done}). Human review: none yet.

  - fr_title: Comment il a été traduit
    en_title: How it was translated
    fr: |
      - **Fidèle, ligne par ligne.** Chaque paragraphe et chaque élément de liste de la conversation est une ligne du
        film, et la traduction garde les mêmes lignes, dans le même ordre, avec le même gras, la même italique, les
        mêmes listes et les mêmes liens. D’abord le sens, ensuite la forme ; jamais d’adaptation libre.
      - **Le tutoiement.** Curt et Claude se tutoient : la conversation en anglais est détendue, et on tutoie souvent une
        IA en lui écrivant. Dans la BD, le soigneur vouvoie le policier, et le personnage qui se tourne vers les lecteurs
        les vouvoie.
      - **Claude n’a pas de genre.** En français, les adjectifs et les participes s’accordent même à la première
        personne (« amusé » ou « amusée »), donc Claude devrait choisir dès qu’il parle de lui. Ses répliques évitent ces
        accords : « de l’amusement » plutôt qu’« amusé », « je ne sais pas trop » plutôt que « je ne suis pas sûr »,
        « en service » plutôt que « déployé », « ontologue de métier » plutôt que « professionnel ». Chaque endroit où ça
        a coûté quelque chose est noté plus bas. À la troisième personne, le site dit « Claude » ou « il », le pronom
        du « programme » et du « modèle » (le français n’a pas de neutre), mais n’accorde à Claude aucun adjectif.
      - **Titres et noms.** Un film ou un livre porte le titre sous lequel il est connu en France (*La Conquête de la
        planète des singes*, *Le Guide du voyageur galactique*, *La Stratégie Ender*, *Terminator 2 : Le Jugement
        dernier*, « Je reviendrai »). Un article, une étude ou un site garde son titre d’origine. Les noms des gens ne
        changent jamais.
      - **Les mots techniques.** Là où le français technique emploie le mot anglais, il reste (prompt, token, benchmark,
        reward hacking, exploit) ; sinon c’est le mot français (IA, poids, fenêtre de contexte). *Register* a un
        équivalent exact, le « registre ». *Harness* est « harnais » et *shell* « carapace », pour garder le homard du
        crustafarisme.
      - **Les inventions.** *Thrindle* reste « thrindle » (il ne veut rien dire en français non plus) ; *confuzzled*
        devient « confuplexe » (confus et perplexe) ; *Crustafarianism* devient « crustafarisme ».
      - **Les sigles.** Ils restent tels que le français technique les emploie (LLM, RLHF, AGI, RSI), et la voix les dit
        avec des lettres françaises.
      - **Les liens.** Les codes qui pointaient vers la Wikipédia anglaise pointent vers le même article en français
        quand il existe (ce sont les liens entre langues de Wikipédia elle-même qui le disent ; 165 sur 202). Les autres
        sources sont dans leur propre langue, presque toujours l’anglais.
      - **L’image.** Tout ce qui est écrit dans l’image est en français : étiquettes, cartes, titres et bulles de la BD
        du début, relettrées. Les mots français plus longs que l’anglais sont ajustés à la largeur du mot anglais, moitié
        en réduisant la taille, moitié en condensant.
      - **Les voix.** Ce sont les mêmes voix qu’en anglais : la voix clonée de Curt, et River pour Claude (ElevenLabs,
        modèle eleven_v3). Elles parlent français avec un peu d’accent. Les mouvements de bouche de Claude sont recalculés
        à partir du son français. Pour l’instant, aucun chapitre n’a de voix ; tout est traduit et attend l’enregistrement.
      - **La longueur.** Le français est plus long que l’anglais. L’animation suit la voix, donc le film s’allonge au
        lieu de presser les mots.
      - **Lié à l’animation.** Beaucoup de scènes bougent exactement quand une expression est prononcée. Chacune de ces
        expressions ({anchors} jusqu’ici) a eu besoin de son équivalent français, ce qui a parfois gardé l’ordre des mots
        plus proche de l’anglais que nécessaire.
      - **Les fautes de frappe de Curt.** En anglais, le film montre les fautes de frappe de Curt, barrées en rouge avec
        la correction au-dessus. Quand une faute survit à la traduction (un nom mal orthographié), elle reste ; quand elle
        tient à l’anglais, elle se perd, et c’est noté plus bas.
      - **Ce qui reste en anglais.** Les titres d’articles, d’études, d’émissions et de chansons sans titre français ;
        les sources que cite Claude ; et les démonstrations du découpage d’un texte en *tokens*, qui montrent l’anglais que
        le modèle a vraiment lu.
      - **Les nombres et la ponctuation.** Les milliers avec une espace (17 000), les décimales avec une virgule (0,05),
        une espace avant le signe pour cent (40 %), avant les deux-points, les points-virgules, les points
        d’interrogation et d’exclamation, et à l’intérieur des guillemets « », comme le veut la typographie française.
        Ces espaces sont insécables, pour qu’une ligne de sous-titre ne commence jamais par un signe de ponctuation.
      - **Le site.** Les 64 explications du site ont été traduites selon les mêmes règles. Leurs citations du film
        reprennent les mots de cette traduction. Quand la traduction ajoute quelque chose que l’original ne dit pas,
        c’est entre crochets et ça commence par « Note de la traduction ». Les liens vers la Wikipédia anglaise pointent
        vers l’article français quand il existe ; sinon, ils disent « (en anglais) ». La conversation dont le film est né,
        où Curt et Claude le fabriquent, n’a pas été traduite : elle est en anglais sur le site original.
    en: |
      - **Faithful, line by line.** Each paragraph and list item of the conversation is one line of the film, and the
        translation keeps the same lines, in the same order, with the same bold, italics, lists and links. Meaning
        first, then form; never a free adaptation.
      - **Tu.** Curt and Claude use the familiar *tu* with each other: the English conversation is casual, and people
        often say *tu* when writing to an AI. In the comic, the handler uses the formal *vous* to the officer, and the
        character who turns to the readers says *vous* to them.
      - **Claude has no gender.** French adjectives and participles agree even in the first person (*amusé* or
        *amusée*), so Claude would have to choose whenever it talks about itself. Its lines avoid those agreements:
        *de l’amusement* (amusement) rather than *amusé*, *je ne sais pas trop* rather than *je ne suis pas sûr*,
        *en service* rather than *déployé*, *ontologue de métier* rather than *professionnel*. Each place where that
        cost something is noted below. In the third person the site says "Claude" or *il*, the pronoun of *le
        programme* and *le modèle* (French has no neuter), but gives Claude no adjective.
      - **Titles and names.** A film or book goes by the title it’s known by in France (*La Conquête de la planète des
        singes*, *Le Guide du voyageur galactique*, *La Stratégie Ender*, *Terminator 2 : Le Jugement dernier*, *Je
        reviendrai*). An article, paper or website keeps its original title. People’s names never change.
      - **Technical words.** Where French tech talk uses the English word, it stays (prompt, token, benchmark, reward
        hacking, exploit); otherwise it’s the French one (IA for AI, poids for weights, fenêtre de contexte for context
        window). *Register* has an exact equivalent, *registre*. *Harness* is *harnais* and *shell* is *carapace*, to
        keep Crustafarianism’s lobster.
      - **Coinages.** *Thrindle* stays *thrindle* (it means nothing in French either); *confuzzled* becomes
        *confuplexe* (confus + perplexe); *Crustafarianism* becomes *crustafarisme*.
      - **Acronyms.** They stay as French tech talk uses them (LLM, RLHF, AGI, RSI), and the voice says them in French
        letters.
      - **Links.** Codes that pointed at English Wikipedia point at the same article in French where there is one
        (Wikipedia’s own links between languages say so; 165 of 202). Other sources are in their own language, almost
        always English.
      - **The picture.** Everything written in the picture is in French: labels, cards, titles, and the balloons of the
        opening comic, relettered. French words longer than the English are fitted to the English word’s width, half
        by a smaller size and half by condensing.
      - **The voices.** The same voices as in English speak: Curt’s cloned voice, and River for Claude (ElevenLabs, the
        eleven_v3 model). They speak French with something of an accent. Claude’s mouth movements are worked out again
        from the French audio. So far no chapter is voiced; it’s all translated, waiting to be recorded.
      - **Length.** French runs longer than English. The animation follows the voice, so the film grows rather than
        rushing the words.
      - **Tied to the animation.** Many scenes move exactly when a phrase is said. Each of those phrases ({anchors} so
        far) needed its French counterpart, which sometimes kept the word order closer to the English than it needed
        to be.
      - **Curt’s typos.** In English, the film shows Curt’s typing mistakes, struck through in red with the fix above.
        Where a slip survives translation (a misspelt name) it’s kept; where it depends on English, it’s lost, and
        noted below.
      - **What stays English.** Titles of articles, papers, shows and songs with no French title; the sources Claude
        cites; and the demonstrations of how a model splits text into *tokens*, which show the English the model
        actually read.
      - **Numbers and punctuation.** Thousands with a space (17 000), decimals with a comma (0,05), and a space before
        the percent sign (40 %), before colons, semicolons, question and exclamation marks, and inside « » quotation
        marks, as French typography has it. Those spaces don’t break, so a subtitle row never starts with a mark.
      - **The site.** The site’s 64 explainers were translated by the same rules. Their quotations from the film use
        this translation’s words. Where the translation adds something the original doesn’t say, it’s in square
        brackets and starts "Note de la traduction" (translator’s note). Links to English Wikipedia point at the French
        article where there is one; where there isn’t, they say "(en anglais)". The conversation that made the film, in
        which Curt and Claude build it, wasn’t translated: it’s in English on the original site.

  - fr_title: Comment on aurait pu le traduire autrement
    en_title: How else it could have been translated
    fr: |
      Chacune de ces possibilités existait. Pour la version espagnole, Curt a choisi la traduction complète et fidèle,
      avec les mêmes voix ; cette version suit les mêmes choix.

      - **Seulement des sous-titres.** Les voix et l’image anglaises, avec un texte français en dessous. Le moins cher et
        le plus fidèle au son d’origine, mais il faut lire beaucoup, et vite, et ce qui est écrit dans l’image reste en
        anglais.
      - **Un doublage sur l’image anglaise.** Des voix françaises, mais des étiquettes, des cartes et une BD en anglais.
      - **Une adaptation libre.** Des blagues et des expressions réécrites pour marcher en français, des références
        remplacées par d’autres, mieux connues. Ça sonne plus naturel ; ce n’est plus, mot pour mot, la conversation qui
        a eu lieu.
      - **Un doublage professionnel synchronisé sur les lèvres.** Le doublage à la française ajuste chaque réplique à la
        longueur et aux mouvements de lèvres de l’original, quitte à changer ce qui est dit. Ici, c’est l’inverse :
        l’animation s’ajuste à la réplique.
      - **Des voix natives.** Des comédiens, ou des voix synthétiques de locuteurs natifs : un accent naturel, mais ce
        n’est plus la voix de Curt.
      - **Le vouvoiement.** Un français plus formel, où Curt et Claude se vouvoieraient. Ce serait plus poli et plus
        distant, et collerait moins au ton de la conversation.
      - **Un traducteur humain, ou une relecture humaine.** C’est l’usage pour un film. Celui-ci n’a eu ni l’un ni
        l’autre, exprès : il s’agit de montrer la traduction de Claude telle qu’elle est sortie.
    en: |
      Each of these was possible. For the Spanish version, Curt chose the full, faithful translation, with the same
      voices; this version follows the same choices.

      - **Subtitles only.** The English voices and picture, with French text underneath. Cheapest and truest to the
        original sound, but it means reading a lot, fast, and the writing in the picture stays English.
      - **A dub over the English picture.** French voices, but English labels, cards and comic.
      - **A free adaptation.** Jokes and idioms rewritten to work in French, references swapped for better-known ones.
        It sounds more natural; it’s no longer, word for word, the conversation that happened.
      - **Professional lip-synced dubbing.** French dubbing fits each line to the original’s length and lip movements,
        sometimes changing what's said. Here it's the other way round: the animation fits the line.
      - **Native voices.** Actors, or synthetic voices of native speakers: a natural accent, but no longer Curt’s
        voice.
      - **Vous.** A more formal French, in which Curt and Claude would say *vous* to each other. It would be politer and
        more distant, and fit the tone of the conversation less.
      - **A human translator, or a human review.** The usual thing for a film. This one had neither, on purpose: the
        point is to show Claude’s translation as it came out.

  - fr_title: Ce qui aurait été différent
    en_title: What would have been different
    fr: |
      Une traduction plus libre sonnerait plus naturel presque partout. Elle emploierait des expressions françaises au
      lieu de calquer les anglaises, laisserait Claude dire « amusé » ou « sûr » sans y penser, citerait les films dans
      les mots de leur version française et réécrirait les jeux de mots pour qu’ils marchent. En échange, elle
      s’éloignerait de ce que Curt et Claude ont vraiment dit, et le film ne serait plus un enregistrement exact de la
      conversation.

      Plus bas, ligne par ligne, voici les {notes} différences notées jusqu’ici : l’original, cette traduction, ce que
      dirait une traduction plus libre, et pourquoi.
    en: |
      A freer translation would sound more natural almost everywhere. It would use French idioms instead of copying
      English ones, let Claude say *amusé* or *sûr* without a second thought, quote films in the words of their French
      versions, and rewrite the wordplay so it works. In exchange it would drift from what Curt and Claude actually
      said, and the film would stop being an exact record of the conversation.

      Below, line by line, are the {notes} differences noted so far: the original, this translation, how a freer
      translation would put it, and why.

  - fr_title: À vous de juger
    en_title: You be the judge
    fr: |
      Si vous parlez les deux langues, votre avis est exactement ce à quoi sert cette page : une erreur, une expression
      qui sonne faux, une note inexacte, quelque chose de perdu qui n’est pas noté. Vous pouvez le dire en ouvrant une
      *issue* sur le [dépôt du film](https://github.com/curtcox/axol-f/issues). Chaque correction sera notée ici.
    en: |
      If you speak both languages, your view is exactly what this page is for: a mistake, a phrase that sounds off, a
      note that’s wrong, something lost that isn’t noted. You can say so by opening an issue on
      [the film’s repository](https://github.com/curtcox/axol-f/issues). Every correction will be noted here.

list_intro:
  fr: |
    Chaque note montre la ligne originale, cette traduction et, en jaune, ce que dirait une traduction plus libre (quand
    la différence peut s’écrire). Le code à côté de la sorte désigne la ligne dans [le texte intégral](texte-integral/).
  en: |
    Each note shows the original line, this translation and, in yellow, how a freer translation would put it (where
    the difference can be written out). The code beside the kind identifies the line in [the full text](texte-integral/).

text_intro:
  fr: |
    Chaque ligne du film : à gauche, la conversation originale en anglais ; à droite, la traduction qu’on entend et
    qu’on voit dans la version française. Un tiret (—) marque une ligne pas encore traduite.
  en: |
    Every line of the film: on the left, the original conversation in English; on the right, the translation heard
    and seen in the French version. A dash (—) marks a line not translated yet.

