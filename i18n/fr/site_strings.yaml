curt: Curt
conversation_title: La conversation
conversation_crumb: la conversation
conversation_intro: >-
  <p>Toute la conversation entre Curt et Claude dont le film est fait, mot pour mot, chapitre par chapitre, dans la
  traduction du film. L’original en anglais est <a href="{orig}">sur claude.ai</a>. Elle existe aussi
  <a href="../conversation.txt">en texte brut</a> et à côté de l’anglais dans
  <a href="../traduction/texte-integral/">tout le film dans les deux langues</a>. Et il y a
  <a href="{making_of}">la conversation dont le film est né</a> (en anglais).</p>
