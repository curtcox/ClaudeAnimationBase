# The French site’s own words (tools/build_site.mjs’s SITE_WORDS, key by key; i18n/tools/stage.mjs copies this to the
# stage’s script/site_strings.yaml). {name} is filled in by the builder. Some values are HTML.
# `explained` ends in a no-break space: the builders write "{explained}: {title}", and French sets a space before ":".
lang: fr
film_title: Grenouille ou axolotl
index_title: "Grenouille ou axolotl : les liens"
explained: "Expliqué "
index_intro: >-
  <p>Un film d’animation tiré d’une longue conversation, un samedi matin, entre Curt et Claude, un programme d’IA. La
  conversation saute de la science-fiction à la philosophie et à beaucoup d’actualités récentes sur l’IA, et elle est
  donc pleine de références que la plupart des gens ne connaissent pas.</p><p>Les voici toutes, dans l’ordre, chapitre
  par chapitre, avec de courtes explications en langage simple là où un lien seul ne suffit pas. <strong>Les jaunes sont
  les explications.</strong> Commence par là si quelque chose dans le film te laisse perplexe.</p>
  <p class="note">C’est la version française. Le film et le site ont été traduits par Claude, délibérément sans relecture
  humaine&#8239;: <a href="traduction/">comment le film a été traduit, et ce qui s’est perdu</a>. Le site original en
  anglais est <a href="../">curtcox.github.io/axol-f</a>.</p>
watch_film: ▶ Regarder le film
watch_film_after: ', avec chaque lien à côté au moment où il apparaît.'
on_its_way: >-
  Le film est en route. Ses liens et ses explications sont déjà tous ici. Pas la patience d’attendre&#8239;? Le film est entièrement fait
  de code, tu peux donc le générer toi-même&#8239;: <a href="{repo}">récupère le code</a> et lance
  <code>npm start</code>.
two_conversations: Les deux conversations
conversation_shown: La conversation que montre le film
conversation_shown_after: ', mot pour mot, traduite (<a href="conversation.txt">en texte brut</a>).'
# the making-of is in English only, on the English site
making_of_href: ../making-of/
conversation_made: La conversation dont le film est né
conversation_made_after: " : Curt demande à Claude de le faire, et tout ce que Claude a fait ensuite (en anglais ; <a href=\"{href}making-of.txt\">en texte brut</a>)."
chapters: Chapitres
index_notes: >-
  <p class="note">Les explications ont été écrites pour ce site par Claude, l’IA du film, et vérifiées par rapport aux
  sources en lien. Beaucoup de ces sources sont en anglais. Les minutages peuvent encore bouger un peu avant que le
  film soit terminé.</p>
  <p class="note">Le film est dessiné en code, par Claude. Curt a trouvé le code sur lequel il s’appuie grâce à un film
  précédent, fait de la même façon&#8239;: <a href="https://curtcox.github.io/PDoomVideo/">I’m Upping My P(doom)</a> (c’est
  son site d’explications, en anglais).</p>
  <p class="note">Pourquoi ce site s’appelle-t-il <em>axol-f</em>&#8239;? Axolotl n’est qu’à une lettre de
  <a href="https://www.youtube.com/watch?v=k85mRPqvMbE">« Axel F » de Crazy Frog</a>&#8239;: une grenouille ou un axolotl.</p>
going_to: Aller à
