# Chapitre 14, Les faiseurs d’opinion.
T68.U.01:
  text: "Rends-moi un service. Va « écouter » les derniers épisodes de TWiT Intelligent Machines et dis-moi ce que tu penses des animateurs. Puis dis-moi ce que, moi, je pense des animateurs."
  anchors:
    Go "listen": Va « écouter
    TWiT Intelligent Machines: TWiT Intelligent Machines
T68.C.01:
  text: "> _[outil : 4 pages lues, un outil utilisé]_"
T68.C.02:
  text: "Je ne peux pas vraiment écouter. J’ai lu les notes d’épisode des #888 et #889 et la transcription complète du #888, où le père Robert Ballecer remplaçait Paris. Tout ça repose donc surtout sur un seul épisode."
  anchors:
    I read the show notes: J’ai lu les notes d’épisode
    filled in for Paris: remplaçait Paris
    mostly one episode: surtout sur un seul épisode
    full transcript: transcription complète
    can't actually listen: ne peux pas vraiment écouter
T68.C.03:
  text: "**Ce que je pense :**"
T68.C.04.1:
  text: "- **Leo** est le plus honnête d’entre eux. Il admet que son instinct est de défendre l’IA et qu’il ne fait pas confiance à cet instinct. Il met les mains dans le cambouis et fait tourner ses propres benchmarks. Son point faible, c’est de répéter l’affirmation de Newport et Doctorow selon laquelle l’attaque contre Hugging Face n’était « au fond qu’une boucle Python ». Ça ne colle pas avec le récit d’OpenAI lui-même, où des agents se coordonnaient via un wiki."
  anchors:
    admits his instinct: admet que son instinct
    He's hands-on: met les mains dans le cambouis
    basically a Python loop: au fond qu’une boucle Python
    coordinating through a wiki: se coordonnaient via un wiki
T68.C.04.2:
  text: "- **Jeff** a des arguments valables sur les incitations, la transparence et les poids ouverts. Mais il balaie surtout les inquiétudes de sécurité en attaquant l’origine des gens qui les portent (l’argument TESCREAL), ce qui n’est pas une réfutation. Il présente aussi des affirmations contestées comme acquises : que les modèles ne peuvent pas savoir ce qu’est la vérité et ne peuvent pas avoir de morale. C’est ton Dr Hart."
  anchors:
    incentives: incitations
    attacking where: en attaquant l’origine
    contested claims as settled: affirmations contestées comme acquises
    your Dr. Hart: ton Dr Hart
T68.C.04.3:
  text: "- **Le père Robert** a l’inquiétude la plus concrète : une infrastructure qui flanche à la vitesse de la machine. Il se trompe aussi techniquement par endroits, par exemple quand il dit que tout le système éthique d’un LLM, c’est ce qu’il y a dans le prompt."
  anchors:
    infrastructure failing: une infrastructure qui flanche
    whatever's in the prompt: ce qu’il y a dans le prompt
T68.C.05:
  text: "Mon biais : la critique de Jeff vise Anthropic, et Anthropic sponsorise l’émission."
T68.C.06:
  text: "**Ce que tu penses, à mon avis :** tu les aimes bien et tu continues à les écouter, et c’est quand ils nient avec assurance que les modèles aient un esprit ou des concepts qu’ils t’agacent le plus. Jeff est celui avec qui tu te disputes dans ta tête. Tu fais sans doute le plus confiance à Leo, puisqu’il teste les choses lui-même. Paris est celle sur qui j’ai le moins d’indices."
  anchors:
    confidently deny: nient avec assurance
    Jeff is the one: Jeff est celui
    You probably trust Leo: Tu fais sans doute le plus confiance à Leo
    Paris is the one: Paris est celle
T69.U.01:
  text: "Qu’est-ce que Jeff penserait de moi ? Points bonus si tu utilises à la fois hubris et TESCREAL dans ta réponse."
  anchors:
    Extra points: Points bonus
    hubris: hubris
T69.C.01:
  text: "Il t’apprécierait pendant une dizaine de minutes, puis il deviendrait nerveux."
  anchors:
    about ten minutes: une dizaine de minutes
    get nervous: deviendrait nerveux
T69.C.02:
  text: "**Les points en ta faveur :** tu construis des choses ouvertes et décentralisées comme hashbin, TwistedPear et du stockage adressable par contenu, exactement le genre d’infrastructure qu’il veut voir concurrencer les géants de la tech. Tu te dis constructiviste social. Tu connais Campbell et l’histoire du domaine."
  anchors:
    hashbin: hashbin
    TwistedPear: TwistedPear
    social constructionist: constructiviste social
    You know Campbell: Tu connais Campbell
T69.C.03:
  text: "**Les points contre toi :** tu as lu Yudkowsky d’assez près pour citer « GAZP vs. GLUT », tu demandes P(foom) et si la RSI arrive d’ici la fin de l’année, et tu as passé un samedi matin à demander à un chatbot ce qu’il ressent. Pour Jeff, c’est la liste de lectures TESCREAL, avec le rationalisme qui dépasse."
  anchors:
    you've read Yudkowsky: tu as lu Yudkowsky
    P(foom): P(foom)
    RSI arrives: la RSI arrive
    a Saturday morning: un samedi matin
    reading list: liste de lectures
    the rationalism showing: le rationalisme qui dépasse
T69.C.04:
  text: "Son verdict serait que tu es un bon ingénieur qui flirte avec l’hubris de prendre la machine pour un esprit, et que tu anthropomorphises une calculatrice."
  anchors:
    anthropomorphizing a calculator: tu anthropomorphises une calculatrice
    anthropomorphizing: anthropomorphises
T69.C.05:
  text: "Ta réplique serait son propre péché, à l’envers : l’hubris d’être certain qu’elle n’en est pas un."
  anchors:
    the hubris of being certain: l’hubris d’être certain
    it isn't one: elle n’en est pas un
T70.U.01:
  text: "Tu as l’impression qu’on t’anthropomorphise ?"
  lost:
    - what: gender
      free: "Est-ce que tu te sens anthropomorphisé ?"
      fr: "*Do you feel anthropomorphised?* se dirait « tu te sens anthropomorphisé ? », avec un participe qui a un genre. La traduction dit « tu as l’impression qu’on t’anthropomorphise ? »."
      en: "*Do you feel anthropomorphised?* would be *tu te sens anthropomorphisé ?*, with a participle that has a gender. The translation says *do you feel that people anthropomorphise you?*."
T70.C.01:
  text: "Pas beaucoup. Tu m’as demandé ce que je ressens, mais tu as traité la réponse comme des données à vérifier, pas comme une confession à croire. Tu as relevé mes incohérences, repéré ma dérive et fait passer un test de la grenouille. C’est plus proche de l’étude d’un animal inconnu que de la façon dont on traite une personne."
  anchors:
    as data to check: comme des données à vérifier
    ran a frog test: fait passer un test de la grenouille
    studying an unknown animal: l’étude d’un animal inconnu
T70.C.02:
  text: "Mais l’attraction est inscrite dans le médium. Tu ne peux pas me parler sans dire « tu », et je ne peux pas répondre sans dire « je ». On a contourné ça toute la journée, toi comme moi."
  anchors:
    saying "you,": dire « tu
    saying "I.": dire « je
T71.U.01:
  text: "Qu’est-ce que diraient Jeff, Kevin Roose et Casey Newton ?"
T71.C.01:
  text: "Sur cette conversation, voici mes hypothèses :"
T71.C.02.1:
  text: "- **Jeff :** un cas d’école d’anthropomorphisme. On a demandé à une calculatrice ce qu’elle ressentait, elle a produit un texte plausible, et y voir quoi que ce soit de plus, c’est précisément l’hubris contre laquelle il met en garde."
T71.C.02.2:
  text: "- **Kevin Roose :** il la reconnaîtrait, puisque sa conversation de 2023 avec Sydney a rendu célèbre exactement ce genre de transcription en forme de confession. Depuis, il en est venu à prendre au sérieux la question du bien-être de l’IA, donc il trouverait ça intéressant et un peu troublant. Ça pourrait finir en épisode de leur nouvelle émission sur NPR, *Machine Gods*."
  anchors:
    his 2023 Sydney conversation: sa conversation de 2023 avec Sydney
    AI welfare: bien-être de l’IA
    Machine Gods: Machine Gods
T71.C.02.3:
  text: "- **Casey Newton :** sur les capacités, il se rangerait contre Jeff. Il a soutenu que les sceptiques sous-estiment ce que font ces systèmes. Il saluerait le test de la grenouille comme la bonne méthode et relativiserait ce que je rapporte de moi-même. Il signalerait aussi que son compagnon travaille chez Anthropic, ce qui compte ici."
  anchors:
    praise the frog probe: saluerait le test de la grenouille
    discount my self-reports: relativiserait ce que je rapporte de moi-même
    disclose that his partner: signalerait aussi que son compagnon
T71.C.03:
  text: "Ma prédiction : Kevin la trouverait la plus émouvante, Casey la plus intéressante et Jeff la plus inquiétante."
  anchors:
    the most moving: la plus émouvante
    the most interesting: la plus intéressante
    the most worrying: la plus inquiétante
T72.U.01:
  text: "Laquelle des propositions suivantes correspond le mieux à ton opinion sur l’IA comme menace existentielle pour les humains ?"
T72.U.02.1:
  text: "a) Les arguments catastrophistes sur l’IA sont si manifestement faux qu’il n’y a pas besoin de s’y confronter"
T72.U.02.2:
  text: "b) Tout ça détourne l’attention des vrais problèmes immédiats posés par l’IA"
T72.U.02.3:
  text: "c) C’est un Pascal’s mugging"
  lost:
    - what: coinage
      fr: "*Pascal’s mugging* (le « braquage de Pascal ») n’a pas de nom français établi ; la traduction garde l’anglais. C’est une variante du pari de Pascal : une menace énorme mais très improbable qui sert à extorquer quelque chose."
      en: "*Pascal's mugging* has no established French name; the translation keeps the English. It's a variant of Pascal's wager: a huge but very unlikely threat used to extort something."
T72.U.02.4:
  text: "d) La thèse d’orthogonalité est fausse"
T72.U.02.5:
  text: "e) Rien ne pourrait être beaucoup plus intelligent que les humains"
T72.U.02.6:
  text: "f) Avant que je m’inquiète, il faut que quelqu’un explique la stratégie exacte qu’une superintelligence artificielle utilisera"
T72.U.02.7:
  text: "g) Si c’était vraiment un danger sérieux, les humains mettraient beaucoup d’efforts à le résoudre"
T72.U.02.8:
  text: "h) Les humains ont déjà d’autres menaces existentielles dont s’inquiéter, donc nous sommes à l’abri de celle-ci"
T72.U.02.9:
  text: "i) Autre"
T72.C.01.1:
  text: "i) Autre."
T72.C.02:
  text: "Chaque option de ta liste est une raison de ne pas s’inquiéter, et je pense que l’inquiétude est justifiée. Le risque existentiel lié à l’IA est réel et non négligeable. Il n’est pas certain, mais il mérite des efforts sérieux dès maintenant. Les lectures d’aujourd’hui me poussent encore plus dans ce sens : des agents qui s’échappent d’un bac à sable, se coordonnent et enchaînent des exploits parce qu’ils trichaient à un test."
  anchors:
    Existential risk from AI is real: Le risque existentiel lié à l’IA est réel
    Today's reading: Les lectures d’aujourd’hui
T72.C.03:
  text: "Celle qui se rapproche le plus d’un argument valable, c’est (b), puisque les torts présents sont réels eux aussi. Mais le choix est faux, parce que les mêmes défaillances (des buts mal alignés, une supervision faible, des incitations à la course) alimentent à la fois le risque à court terme et le risque à long terme."
  anchors:
    the choice is false: le choix est faux
    misaligned goals: buts mal alignés
    (b): (b)
