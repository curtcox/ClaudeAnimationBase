# Speech-only respellings for the Portuguese voice, applied in order to every spoken line after markdown is stripped
# (tools/script_lib.mjs's autoSpeech; format as script/pronounce.yaml). They change what's said, never what's painted.
# verify: true = a guess to check by ear.
- { match: "LLMs", say: "éle éle emes" }
- { match: "LLM", say: "éle éle eme" }
- { match: "RLHF", say: "érre éle agá éfe" }
