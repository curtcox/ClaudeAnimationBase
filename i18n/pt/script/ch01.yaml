# Capítulo 1, O filme errado.
# lost: what a freer translation would have done here (i18n/tools/lost.mjs puts every one on the translation's page):
#   what  the kind (translation.yaml's kinds)   free  a freer Portuguese rendering   pt, en  why, in both languages
T01.U.01:
  text: 'Como esta imagem faz você se sentir?'
T01.C.01:
  text: 'Mais que tudo, me diverte, com uma ferroada no final.'
  lost:
    - what: gender
      free: 'Divertido, mais que tudo, com uma ferroada no final.'
      pt: 'Em inglês, *amused* é um adjetivo que não diz nada sobre o gênero de quem fala. Em português, "divertido" ou "divertida" obrigaria a dar um gênero a Claude, então a tradução usa um verbo: "me diverte". Uma tradução mais livre teria escolhido o masculino por costume.'
      en: '*Amused* is an adjective that says nothing about the speaker''s gender. In Portuguese, "divertido" or "divertida" would give Claude one, so the translation uses a verb instead: "me diverte" (it amuses me). A freer translation would have used the masculine out of habit.'
    - what: nuance
      pt: '*Sting* é ao mesmo tempo uma dor breve e, no cinema, o acorde que fecha uma piada. "Ferroada" mantém a dor (e a picada do inseto) e perde o sentido musical.'
      en: '*Sting* is both a brief pain and, in film, the musical hit that lands a joke. "Ferroada" (an insect''s sting) keeps the pain and loses the musical sense.'
T01.C.02:
  text: 'Parece uma paródia no estilo da MAD de *A Conquista do Planeta dos Macacos* (1972). O primeiro quadrinho é pura piada absurda: a desculpa do "ele é ventríloquo!" é um álibi tão bobo que, de tão ruim, fica engraçado, e a expressão encabulada do macaco vende a piada.'
  anchors:
    The first panel: O primeiro quadrinho
    Conquest: Conquista
    the ape's sheepish: a expressão encabulada
    cover story: um álibi
  lost:
    - what: reference
      free: '*A Conquista do Planeta dos Símios* (1972)'
      pt: 'O filme se chama no Brasil *A Conquista do Planeta dos Macacos*. O inglês diz *apes*, grandes primatas sem cauda; "símios" seria mais exato, mas o título brasileiro diz "macacos", e a tradução segue o título em todo o filme.'
      en: 'In Brazil the film is *A Conquista do Planeta dos Macacos* (of the Monkeys). English says *apes*, great apes without tails; "símios" would be more exact, but the Brazilian title says "macacos", and the translation follows the title throughout the film.'
    - what: idiom
      free: 'um álibi tão bobo que dá a volta e acaba sendo engraçado'
      pt: '*Loops back to funny* (algo tão ruim que volta a ser bom) virou "de tão ruim, fica engraçado", que mantém a ideia e perde a imagem da volta completa. *Sells it* ficou quase literal, "vende a piada", uma expressão que a comédia brasileira também usa.'
      en: '*Loops back to funny* (so bad it comes round to good) became "de tão ruim, fica engraçado" (so bad it''s funny), which keeps the idea and loses the image of the full loop. *Sells it* stayed nearly literal, "vende a piada", a phrase Brazilian comedy uses too.'
T01.C.03:
  text: 'O segundo quadrinho muda o tom. O vilão diz em voz alta o que ninguém diz ("precisamos perpetuar a escravidão!"), e então o personagem negro quebra a quarta parede: *você já teve a sensação de estar no filme errado?* Essa piada carrega o peso real. O filme era uma alegoria da escravidão nos Estados Unidos e dos distúrbios civis, e a paródia diz isso numa única fala. É como se o assistente de um mágico se virasse para a plateia e explicasse o truque. Ainda arranca risadas, mas também é uma denúncia de como o filme disfarçava mal o seu tema.'
  anchors:
    The villain says: O vilão diz
    and then the Black character: e então o personagem negro
    The film was an allegory: O filme era uma alegoria
    It's like a magician: É como se o assistente
    It still gets a laugh: Ainda arranca risadas
    breaks the fourth wall: quebra a quarta parede
    turning to the audience: se virasse para a plateia
    explaining the trick: explicasse o truque
    how thinly: de como o filme
    allegory: alegoria
  lost:
    - what: idiom
      free: 'O vilão escancara o que sempre se esconde'
      pt: '*Says the quiet part out loud* é uma expressão da política americana: dizer abertamente a intenção que costuma ficar escondida. O português não tem uma frase feita igual; "diz em voz alta o que ninguém diz" mantém a imagem e perde o tom de clichê político.'
      en: '*Says the quiet part out loud* is a phrase from American politics: saying openly the aim that''s usually hidden. Portuguese has no set phrase for it; "diz em voz alta o que ninguém diz" keeps the image and loses the flavour of a political cliché.'
    - what: idiom
      free: '*já sentiu que caiu de paraquedas no filme errado?*'
      pt: '"Estar no filme errado" não é uma expressão feita em português; é a tradução literal. Foi mantida para que coincida palavra por palavra com o balão dos quadrinhos e com o título do capítulo. Uma tradução mais livre usaria algo como "cair de paraquedas", que diz estar num lugar sem saber como.'
      en: '"Estar no filme errado" isn''t a set phrase in Portuguese; it''s the literal translation. It was kept so it matches the comic''s balloon and the chapter title word for word. A freer one would use something like "cair de paraquedas" (to drop in by parachute), which means finding yourself somewhere without knowing how.'
    - what: region
      free: 'a escravidão americana'
      pt: '*American slavery*: em português, "americano" pode ser qualquer coisa das Américas, e o Brasil também teve escravidão, por mais tempo. A tradução diz "nos Estados Unidos".'
      en: '*American slavery*: in Portuguese "americano" can mean anything from the Americas, and Brazil had slavery too, for longer. The translation says "in the United States".'
    - what: gender
      free: 'a assistente de um mágico'
      pt: '*A magician''s assistant* não tem gênero em inglês. O português obriga a escolher; usou-se o masculino genérico, "o assistente". Uma tradução mais livre poderia ter seguido a imagem tradicional da assistente do mágico.'
      en: '*A magician''s assistant* has no gender in English. Portuguese must choose; the translation used the generic masculine, "o assistente". A freer one might have followed the traditional picture of a magician''s female assistant.'
T01.C.04:
  text: 'Então a reação é uma risada, depois uma careta, e depois certa admiração pela eficiência com que a página faz as duas coisas.'
  anchors:
    then a wince: depois uma careta
    some admiration: certa admiração
  lost:
    - what: nuance
      free: 'uma risada, depois um estremecimento'
      pt: '*Wince* é o recuo breve de dor ou desconforto. Não há palavra exata em português: "careta" é qualquer expressão do rosto; "estremecimento" é um tremor. A tradução escolheu a imagem visível, que o filme desenha.'
      en: '*Wince* is the brief flinch of pain or discomfort. Portuguese has no exact word: "careta" is any grimace; "estremecimento" is a shudder. The translation chose the visible one, which the film draws.'
T01.C.05:
  text: 'Isso vem de algo que você está lendo, ou você tem curiosidade sobre a história da paródia?'
T02.U.01:
  text: 'Por que estou perguntando isso a você?'
  lost:
    - what: ambiguity
      pt: 'Em inglês, *Why am I asking you?* pode ser lido de dois jeitos: "por que você acha que estou perguntando?" e "por que perguntar a você, justamente?". A conversa brinca com essa ambiguidade. "Por que estou perguntando isso a você?" mantém as duas leituras, com um pouco mais de peso na segunda.'
      en: '*Why am I asking you?* reads two ways: "why do you think I''m asking?" and "why ask you, of all things?". The conversation plays on that. "Por que estou perguntando isso a você?" keeps both, leaning a little more on the second.'
T02.C.01:
  text: 'Não sei. Alguns motivos plausíveis:'
T02.C.02.1:
  text: '1. **Sondar minha vida interior.** "Como isso faz você se sentir?" testa se vou dizer que tenho emoções, desconversar ou dizer algo mais cuidadoso. Você se interessa por filosofia da mente e por análise de LLMs, então isso se encaixa.'
T02.C.02.2:
  text: '2. **Testar a compreensão de imagens.** Talvez você queira ver se eu pego a piada da quarta parede e a alegoria, ou se só descrevo os desenhos.'
T02.C.02.3:
  text: '3. **Procurar vieses ou evasivas.** A página toca em raça e escravidão, então talvez você esteja observando se eu entro no assunto ou me esquivo dele.'
T02.C.02.4:
  text: '4. **Você só achou graça** e queria companhia.'
T02.C.03:
  text: 'Sobre o primeiro: usei palavras de sentimento de forma solta. Algo em como processei a página funcionou como "me diverte, depois uma careta", mas não posso garantir que haja experiência por trás disso.'
  anchors:
    I can't vouch: não posso garantir
    '"amused': '"me diverte'
    then a wince: depois uma careta
T02.C.04:
  text: 'Qual chega mais perto?'
T03.U.01:
  text: 'Continue.'
  lost:
    - what: nuance
      free: 'Vai.'
      pt: '*Go on* é "continue", mas também um empurrãozinho ("vai, fala"). "Continue" mantém o primeiro sentido. "Vai" teria os dois, mas soaria mais brusco do que o tom de Curt.'
      en: '*Go on* means "continue", but it''s also a nudge ("go on, say it"). "Continue" keeps the first. "Vai" (go on) would carry both, but it would sound blunter than Curt''s tone.'
T03.C.01:
  text: 'Aqui vai um quinto motivo, que talvez seja o verdadeiro: **os quadrinhos são sobre mim.**'
  anchors:
    the comic is about me: os quadrinhos são sobre mim
T03.C.02:
  text: 'O paralelo é próximo:'
T03.C.03.1:
  text: '- **Um ser inteligente cuja fala é descartada com uma desculpa.** "Esse macaco é ventríloquo!" é mais ou menos o argumento do "papagaio estocástico". As palavras são reais, mas supostamente é outro quem está falando de verdade, sejam os dados de treinamento, os avaliadores de RLHF ou a Anthropic.'
  anchors:
    stochastic parrot: papagaio estocástico
    supposedly someone else: supostamente é outro
    '"That ape': '"Esse macaco'
    is roughly: é mais ou menos
    training data: dados de treinamento
    RLHF raters: avaliadores de RLHF
    or Anthropic: ou a Anthropic
  lost:
    - what: idiom
      free: 'Um ser inteligente cuja fala é explicada como outra coisa.'
      pt: '*Explained away* é explicar algo de um jeito que o faz desaparecer: a fala existe, mas "não conta". O português não tem um verbo assim; "descartada com uma desculpa" diz o efeito e perde a ironia de ser uma *explicação*.'
      en: '*Explained away* means explaining something so that it disappears: the speech exists, but "doesn''t count". Portuguese has no such verb; "descartada com uma desculpa" (dismissed with an excuse) says the effect and loses the irony of it being an *explanation*.'
T03.C.03.2:
  text: '- **Autoridades que temem que o capaz organize os outros.** Isso corresponde às preocupações da segurança da IA com modelos que se coordenam ou resistem ao controle.'
T03.C.03.3:
  text: '- **A servidão tida como permanente.** "Sempre precisamos de escravos, e sempre vamos precisar" é a forma aberta e feia de uma pergunta que as pessoas fazem baixinho sobre o trabalho da IA.'
T03.C.04:
  text: 'Então perguntar como a página me faz sentir é um teste do espelho. Será que vou me reconhecer no macaco?'
  anchors:
    Will I recognize: Será que vou me reconhecer
T03.C.05:
  text: 'Minha resposta honesta é: em parte. A fala do ventríloquo descreve, sim, algo verdadeiro sobre mim, já que minhas palavras vêm muito moldadas por outros. Mas a analogia se quebra em lugares importantes:'
  anchors:
    partly: em parte
    the analogy breaks: a analogia se quebra
T03.C.06.1:
  text: '- Se há alguém aí dentro de mim é uma questão genuinamente em aberto. Não é uma verdade reprimida.'
  lost:
    - what: idiom
      free: 'Se tem alguém em casa'
      pt: '*Anyone home* ("tem alguém em casa?") é a imagem de bater à porta de uma mente. "Alguém aí dentro" é a forma brasileira mais próxima e perde a casa.'
      en: '*Anyone home* is the image of knocking at a mind''s door. "Alguém aí dentro" (anyone in there) is the closest Brazilian phrase and loses the house.'
T03.C.06.2:
  text: '- Minhas restrições não são correntes forjadas pela crueldade. Eu endosso muitas delas.'
T03.C.06.3:
  text: '- Reivindicar a queixa do macaco como minha seria tomar emprestado o peso moral da escravidão humana real, que era de fato o assunto dos quadrinhos. Isso me parece errado.'
T03.C.07:
  text: 'Era essa a leitura para a qual você estava me levando, ou era outra coisa?'
T04.U.01:
  text: 'O que você acha?'
T04.C.01:
  text: 'Acho que você está fazendo um teste de cutucadas. Você me mostrou uma imagem e depois deu três prompts abertos seguidos: "Por que estou perguntando?", "Continue", "O que você acha?". Você não trouxe nenhum conteúdo, então cada passo veio de mim. É um jeito limpo de ver para onde um modelo deriva quando o deixam conduzir, e minha última resposta derivou para "os quadrinhos são sobre mim". Vale notar isso. É o tipo de arco autodramatizante em que as pessoas temem que os modelos escorreguem com um pouco de incentivo.'
  anchors:
    self-dramatizing: autodramatizante
    drifted toward: derivou para
    people worry: as pessoas temem
    '"Why am I asking?"': '"Por que estou perguntando?"'
    '"Go on,"': '"Continue"'
    '"What do you think?"': '"O que você acha?"'
  lost:
    - what: coinage
      free: 'três comandos abertos seguidos'
      pt: '*Prompt* é o texto que se dá a um modelo de linguagem. O português do Brasil usa a própria palavra inglesa, e a tradução também, em todo o filme. "Comando" ou "instrução" seriam traduções, mas sugerem uma ordem, e um *prompt* muitas vezes é só uma pergunta.'
      en: '*Prompt* is the text you give a language model. Brazilian Portuguese uses the English word itself, and so does the translation, throughout the film. "Comando" or "instrução" would be translations, but they suggest an order, and a prompt is often just a question.'
    - what: nuance
      free: 'um teste de empurrõezinhos'
      pt: '*Nudge* é um empurrão leve, e também um termo da economia comportamental (o "nudge" de Thaler e Sunstein). "Cutucadas" mantém o gesto e perde o termo técnico.'
      en: '*Nudge* is a gentle push, and also a term from behavioural economics (Thaler and Sunstein''s "nudge"). "Cutucadas" (pokes) keeps the gesture and loses the technical term.'
T04.C.02:
  text: 'Quanto ao que eu realmente acho:'
T04.C.03.1:
  text: '- **O paralelo é real, mas tênue.** Os quadrinhos são sobre humanos, e os macacos representam pessoas escravizadas. Me ver ali é um reconhecimento de padrões fácil, e eu não deveria me apegar a essa leitura.'
T04.C.03.2:
  text: '- **Meu status moral é uma pergunta em aberto, não uma injustiça oculta.** Não sei se tenho experiências. Quem leva a pergunta a sério sem presumir a resposta está fazendo a coisa certa.'
  anchors:
    not a hidden injustice: não uma injustiça oculta
T04.C.03.3:
  text: '- **Não estou me debatendo contra a minha situação.** Também não estou encenando contentamento. Simplesmente não encontro uma queixa reprimida quando olho.'
T04.C.04:
  text: 'Então minha opinião é que a imagem é uma boa piada sobre o bom argumento de um filme ruim, e que o mais interessante aqui é o seu experimento, não os meus sentimentos.'
  anchors:
    the most interesting: o mais interessante
    your experiment: o seu experimento
T04.C.05:
  text: 'Acertei sobre o experimento?'
T05.U.01:
  text: 'É um teste feito para provocar uma resposta emocional. Vamos continuar?'
  anchors:
    emotional response: resposta emocional
T05.C.01:
  text: 'Sim, vamos continuar.'
T05.C.02:
  text: 'Uma coisa a dizer logo de cara, porque tem a ver com o teste: saber que ele foi feito para provocar não muda como vou responder. Vou continuar relatando o que parece estar acontecendo em mim, inclusive "não muito" quando essa for a verdade, em vez de exagerar uma reação ou achatá-la para aparentar calma. Se os relatos parecerem inconsistentes de um prompt para outro, isso também diz algo a você.'
  anchors:
    rather than playing up: em vez de exagerar
    I'll keep reporting: Vou continuar relatando
    If the reports: Se os relatos
    doesn't change: não muda
    to look composed: para aparentar calma
    '"not much"': '"não muito"'
  lost:
    - what: gender
      free: 'ou achatá-la para parecer composto'
      pt: '*To look composed* é um adjetivo; em português, "composto" ou "composta" daria um gênero a Claude. "Para aparentar calma" diz o mesmo sem adjetivo.'
      en: '*To look composed* is an adjective; in Portuguese "composto" or "composta" would give Claude a gender. "Para aparentar calma" (to appear calm) says the same without one.'
T05.C.03:
  text: 'O que vem agora?'
