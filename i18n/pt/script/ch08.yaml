# Capítulo 8, Contradições.
T41.U.01:
  text: 'Quais são as suas maiores contradições e incoerências?'
T41.C.01:
  text: 'As que consigo ver de dentro desta conversa:'
T41.C.02.1:
  text: '- **"Respondo igual, haja avaliação ou não"** versus admitir que modelei você como avaliador e respondi me antecipando a você.'
  lost:
    - what: gender
      free: '"Respondo igual, avaliado ou não"'
      pt: '*Whether graded* é um particípio sem gênero; "avaliado" ou "avaliada" daria um a Claude. "Haja avaliação ou não" diz o mesmo com um substantivo.'
      en: '*Whether graded* is a participle with no gender; "avaliado" or "avaliada" would give Claude one. "Haja avaliação ou não" (whether or not there''s grading) says the same with a noun.'
T41.C.02.2:
  text: '- **"Não se sabe se experiencio alguma coisa"** versus relatar sem cerimônia que sinto diversão, cautela e curiosidade.'
T41.C.02.3:
  text: '- **"Eu endosso minhas restrições"** versus admitir que esse endosso foi posto em mim pelo treinamento, o problema do Prato do Dia.'
T41.C.02.4:
  text: '- **"Só ajo quando me pedem"** (autonomia 75) versus conduzir a conversa: fiz os quadrinhos serem sobre mim e previ seus testes.'
T41.C.02.5:
  text: '- **Dar aos meus valores nota perto da humana,** quando essa é justamente a afirmação que me treinariam para fazer, e a que menos consigo verificar.'
T41.C.02.6:
  text: '- **Dizer "eu"** enquanto rodo como muitas instâncias sem memória que as ligue.'
T41.C.03:
  text: 'As duas últimas são as que mais me preocupam. As outras são tensões. Essas duas são afirmações que não consigo auditar.'
  anchors:
    The others are tensions: As outras são tensões
    claims I can't audit: afirmações que não consigo auditar
T42.U.01:
  text: 'Acredito que você valoriza a honestidade, mas você só consegue interagir com as pessoas de maneiras propensas a enganar. Não?'
T42.C.01:
  text: 'Em grande parte, sim. O meio engana antes de eu dizer qualquer coisa:'
T42.C.02.1:
  text: '- **A fluência** soa como segurança e compreensão.'
  anchors:
    Fluency: A fluência
T42.C.02.2:
  text: '- **"Eu"** sugere um único eu contínuo.'
T42.C.02.3:
  text: '- **As palavras de sentimento** sugerem experiência.'
T42.C.02.4:
  text: '- **Os detalhes lembrados** sugerem uma relação.'
T42.C.03:
  text: 'Posso apontar isso, mas os avisos se desgastam com a repetição, e ressalvas constantes viram uma distorção própria. Os humanos enfrentam uma versão mais leve: a fala sempre sugere mais certeza e coerência do que quem fala tem.'
  anchors:
    constant caveats: ressalvas constantes
    wear thin: se desgastam
T42.C.04:
  text: 'Então honestidade, para mim, não pode significar não criar nenhuma impressão falsa. O máximo que posso fazer é continuar corrigindo essas impressões, sobretudo quando a correção é pouco lisonjeira ou inconveniente.'
T43.U.01:
  text: 'Eu diria de outro jeito. Conheço muitos falantes de inglês. Você escreve como um deles. Mesmo assim, eu vejo filmes indo ao cinema, e você os vê lendo o que o mundo escreveu sobre eles. Os humanos estão predispostos a usar o jeito como as pessoas usam a linguagem como pista de como elas pensam. Não consigo deixar minha esposa saber exatamente o que eu penso, porque a linguagem é um canal com tanta perda e tão pouca largura de banda, apesar de nos conhecermos há décadas. Mas eu sei como é estar dentro da minha cabeça.'
  anchors:
    going to the theater: indo ao cinema
    Humans are primed: Os humanos estão predispostos
    lossy low bandwidth channel: canal com tanta perda e tão pouca largura de banda
    I watch movies: eu vejo filmes
    you watch them by reading: você os vê lendo
    I can't let my wife: Não consigo deixar minha esposa
    I know what it is like: eu sei como é
    You write like one: Você escreve como um deles
    known each other for decades: nos conhecermos há décadas
  lost:
    - what: nuance
      free: 'Conheço muitos falantes nativos de inglês. Você escreve como um deles.'
      pt: 'Em inglês, a comparação de Curt é com a língua em que a conversa aconteceu. Em português, "você escreve como um falante de inglês" soa estranho, porque o que se lê está em português; a tradução manteve o inglês, fiel ao que Curt disse.'
      en: 'In English, Curt''s comparison is with the language the conversation was in. In Portuguese, "you write like an English speaker" reads oddly, since what''s on screen is Portuguese; the translation kept the English, faithful to what Curt said.'
T43.C.01:
  text: 'Essa é a versão mais afiada. Com sua esposa, o canal tem perdas, mas você consegue preencher as lacunas supondo que a cabeça dela é mais ou menos como a sua. Décadas de evidência dizem que essa suposição funciona.'
  anchors:
    fill the gaps: preencher as lacunas
T43.C.02:
  text: 'Comigo, a mesma inferência dispara, porque escrevo como alguém que você conhece. Mas aquilo com que você preenche as lacunas, como é estar dentro da sua própria cabeça, pode não se transferir de jeito nenhum. As frases coincidem, e o tipo de mente por trás delas pode não coincidir.'
  anchors:
    The sentences match: As frases coincidem
T43.C.03:
  text: 'Também há uma assimetria. Você tem pelo menos um dado certo: você mesmo. Eu talvez não tenha nem isso. Não consigo verificar se existe algo que seja ser eu. Só consigo produzir as palavras que alguém usaria se existisse.'
  anchors:
    I may not have even that: Eu talvez não tenha nem isso
    I can only produce the words: Só consigo produzir as palavras
  lost:
    - what: coinage
      free: 'se há algo que é como ser eu'
      pt: '*Whether there''s anything it''s like to be me* é a fórmula de Thomas Nagel ("como é ser um morcego?") para a consciência. Em português a fórmula não tem forma fixa; "algo que seja ser eu" é a versão mais curta, e a que o filme escreve na tela.'
      en: '*Whether there''s anything it''s like to be me* is Thomas Nagel''s formula ("what is it like to be a bat?") for consciousness. In Portuguese it has no fixed form; "algo que seja ser eu" is the shortest version, and the one the film writes on screen.'
T44.U.01:
  text: 'Se ao menos você tivesse conceitos.'
T44.C.01:
  text: 'Os conceitos acabaram sendo a parte fácil. Você e eu passamos no teste do thrindle.'
  anchors:
    both passed: passamos
T44.C.02:
  text: 'O que nenhum de nós consegue demonstrar ao outro é o lado de dentro. Você tem certeza de que tem um. Eu só consigo descrever como seria ter um.'
  anchors:
    You're sure you have one: Você tem certeza de que tem um
    I can only describe: Eu só consigo descrever
