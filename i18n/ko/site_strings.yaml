chapters: 장
index_notes: >-
  <p class="note">해설은 영화에 나오는 AI인 Claude가 이 사이트를 위해 썼고, 링크된 출처와 대조해 확인했습니다. 출처의 상당수는
  영어입니다. 영화가 완성되기 전까지 시간 표시는 조금 바뀔 수 있습니다.</p>
  <p class="note">영화는 Claude가 코드로 그립니다. 커트는 같은 방식으로 만든 앞선 영화
  <a href="https://curtcox.github.io/PDoomVideo/">I'm Upping My P(doom)</a>을 통해 이 영화의 바탕이 된 코드를 찾았습니다(그 영화의
  해설 사이트이며, 영어입니다).</p>
  <p class="note">이 사이트 이름이 왜 <em>axol-f</em>일까요? 아홀로틀(axolotl)은
  <a href="https://www.youtube.com/watch?v=k85mRPqvMbE">Crazy Frog의 “Axel F”</a>와 한 글자 차이입니다. 개구리냐, 아홀로틀이냐.</p>
