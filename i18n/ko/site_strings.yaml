lang: ko
film_title: 개구리냐 아홀로틀이냐
index_title: "개구리냐 아홀로틀이냐: 링크 모음"
explained: 해설
index_intro: >-
  <p>어느 토요일 아침, 커트와 AI 프로그램 Claude가 나눈 긴 대화 하나를 그대로 옮긴 애니메이션 영화입니다. 대화는 SF와 철학,
  그리고 최근의 AI 뉴스를 넘나들기 때문에, 대부분의 사람이 모를 레퍼런스로 가득합니다.</p><p>그 레퍼런스가 전부 여기에
  있습니다. 장별로, 순서대로, 링크 하나로는 부족한 곳에는 쉬운 말로 쓴 짧은 해설과 함께요. <strong>노란 것이 해설입니다.</strong>
  영화에서 헷갈둥절한 순간이 있었다면 거기서 시작하세요.</p>
  <p class="note">이것은 한국어판입니다. 영화와 사이트는 Claude가 번역했고, 일부러 사람의 감수를 거치지 않았습니다.
  <a href="beonyeok/">어떻게 번역했고, 무엇을 잃었는지</a>를 보세요. 영어 원본 사이트는
  <a href="../">curtcox.github.io/axol-f</a>입니다.</p>
watch_film: ▶ 영화 보기
watch_film_after: ', 링크가 나올 때마다 옆에 함께 띄워 드립니다.'
on_its_way: >-
  영화는 만드는 중입니다. 링크와 해설은 이미 전부 여기 있습니다. 기다리기 힘드신가요? 영화는 전부 코드로 만들어지므로 직접
  만들 수도 있습니다. <a href="{repo}">코드를 받아</a> <code>npm start</code>를 실행하세요.
