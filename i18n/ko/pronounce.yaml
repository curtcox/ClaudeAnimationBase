# Speech-only respellings for the Korean voice, applied in order to every spoken line after markdown is stripped
# (tools/script_lib.mjs's autoSpeech; format as script/pronounce.yaml). They change what's said, never what's painted.
# Names and acronyms written in Latin letters are said the way Korean says them (에이아이, 엘엘엠, 클로드), and a
# range's dash is read as 에서. verify: true = a guess to check by ear.
