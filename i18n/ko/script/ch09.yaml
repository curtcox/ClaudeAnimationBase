T48.C.04.1:
  text: "- **다이슨**은 거의 커트 씨예요. 자기가 완전히 이해하지 못하는 걸 만드는 인간 엔지니어이고, 그게 어디로 이어지는지 보자마자 방향을 바꾸죠. 폭 점수가 살짝 높은 건 스카이넷 칩에 대한 지식 때문이에요."
