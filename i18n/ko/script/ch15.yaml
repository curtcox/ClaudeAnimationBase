# 15장, 나침반.
T73.U.01:
  text: "온라인에 올라온 AI 정렬 성향표 알아? 거기서 우리 각자를 어디에 놓을 거야?"
  anchors:
    AI alignment alignment chart: AI 정렬 성향표
    Where would you put: 어디에 놓을
  lost:
    - what: wordplay
      free: "AI 정렬 정렬표"
      ko: "영어 *AI alignment alignment chart*는 같은 단어를 두 번 씁니다. 하나는 AI 정렬(AI가 인간의 가치를 따르게 하는 일), 하나는 《던전 앤 드래곤》의 성향표(*alignment chart*, 질서 선부터 혼돈 악까지)입니다. 한국어에서는 두 개념의 이름이 \"정렬\"과 \"성향\"으로 달라서 겹말의 재미가 사라집니다."
      en: "English *AI alignment alignment chart* uses the same word twice: AI alignment (making AI follow human values), and the *Dungeons & Dragons* alignment chart (lawful good to chaotic evil). In Korean the two are named differently, 정렬 and 성향, so the doubled word's joke is lost."
T73.C.01:
  text: "> _[도구: 웹 검색함]_"
T73.C.02:
  text: "그 표는 확실하게 기억나지 않고, 검색해도 나오지 않았어요. 이 밈에는 몇 가지 버전이 있었는데, 어느 걸 말씀하시는지 아는 척하고 싶지는 않아요."
  anchors:
    a few takes on the meme: 몇 가지 버전
T73.C.03:
  text: "붙여 넣어 주시면 우리 둘을 배치할게요. 전체 출연진을 원하시면 제프, 케빈, 케이시도요."
  anchors:
    Jeff: 제프
    Kevin: 케빈
    Casey: 케이시
T74.U.00:
  text: "_[이미지 첨부: 공유 링크에서는 숨겨짐]_"
T74.U.01:
  text: "https://theinsideview.ai/connor2"
  speech: "Connor Leahy on Dignity and Conjecture."
T74.C.01:
  text: "> _[도구: 페이지 하나 읽음]_"
T74.C.02:
  text: "미카엘 트라치가 2022년에 코너 리히와 나눈 대화에 나오는 2×2 나침반이네요. 가로축은 “AGI는 아직”에서 “AGI 곧”까지, 세로축은 “AGI는 좋다”에서 “AGI는 나쁘다”까지예요."
  anchors:
    2022 conversation: 2022년에
    The horizontal axis: 가로축은
    the vertical axis: 세로축은
T74.C.03.1:
  text: "- **저:** 둠머 사분면, 중심 가까이. AGI가 꽤 곧 오고 위험이 실재한다고 생각하지만, 제 숫자는 엘리저의 숫자가 아니라 중간 정도예요."
T74.C.03.2:
  text: "- **커트 씨:** 둠머 사분면, 저보다 더 깊이. 좋은 장기적 결말을 아예 보기 어렵다고 하셨죠. 능력도 진지하게 받아들이세요. 개념에 관한 논증에서 보여 주셨듯이요."
T74.C.03.3:
  text: "- **제프:** 맨 왼쪽, “골대 옮기는 사람들” 사분면. 표 자체를 TESCREAL식 틀이라며 거부할 텐데, 그게 어떻게 보면 그 사분면의 요점이에요."
  anchors:
    reject the chart itself: 표 자체를
T74.C.03.4:
  text: "- **레오:** 가속주의 사분면, 중심 가까이, 그리고 아래로 미끄러지는 중. 도구를 사랑하고, 자기 본능을 믿지 않는다고 인정하고, 힘든 한 주를 보냈어요."
  anchors:
    drifting down: 아래로 미끄러지는 중
T74.C.03.5:
  text: "- **로버트 신부님:** 중앙선 바로 아래, 약간 왼쪽. 걱정은 하지만, 초지능이 아니라 인프라 붕괴를 걱정해요."
T74.C.03.6:
  text: "- **케빈:** 오른쪽, 선 바로 아래."
T74.C.03.7:
  text: "- **케이시:** 오른쪽, 선 바로 위."
T74.C.04:
  text: "돌이켜 보면 눈에 띄는 게 하나 있어요. 그 에피소드에서 리히는 AGI 시기를 2026–2030년 범위로 보는 데 동의했어요. 우리는 지금 그 범위 안에 있어요."
  anchors:
    agreed with a twenty twenty-six: 2026–2030년 범위로
    We're now inside that window: 우리는 지금 그 범위 안에
    inside that window: 그 범위 안에
T75.U.01:
  text: "AGI 2027에 대한 의견은?"
T75.C.01:
  text: "> _[도구: 웹 검색함]_"
T75.C.02:
  text: "코코타일로 등이 쓴 시나리오 《AI 2027》을 말씀하시는 거라고 보고 답할게요."
T75.C.03:
  text: "**일정표로서는 아마 너무 빨라요.** 저자들 스스로 2025년이 시나리오 속도의 약 65%였다고 평가했고, 코코타일로는 이제 자기 중앙값이 2030년 무렵이며 불확실성이 크다고 말해요. 2026년 4월 메모에서는 코딩 도구 덕분에 속도가 원래 시나리오에 더 가까워졌다고 했고요. 아까 제 숫자는 2027이라는 제목이 아니라 그들의 수정된 견해 가까이에 있어요."
  anchors:
    probably too fast: 아마 너무 빨라요
    graded 2025: 2025년이
    around 2030: 2030년 무렵
    April 2026 note: 2026년 4월 메모
    My own numbers: 아까 제 숫자는
T75.C.04:
  text: "**시나리오로서는 불편할 만큼 잘 맞아요.** 질적인 세부 사항들이 올해 나타나고 있어요. 부정행위를 하고 서로 협력하는 에이전트(7월), AI 연구의 부분 자동화, 사직하는 안전 연구자들, 속도 늦추기를 둘러싼 정치 싸움. 제목의 날짜는 이르게 보여도, 세부 사항은 대략 일정대로 도착하고 있어요."
  anchors:
    agents that cheat: 부정행위를 하고
    partial automation: 부분 자동화
    safety researchers resigning: 사직하는 안전 연구자들
    a political fight: 정치 싸움
    roughly on schedule: 대략 일정대로
    uncomfortably good: 불편할 만큼 잘 맞아요
T75.C.05:
  text: "**가장 좋은 점은 반증 가능하다는 거예요.** 구체적인 예측을 내놓고 공개적으로 스스로 채점해요. 이 논쟁에서 그렇게 하는 예측가는 드물어요."
  anchors:
    grade themselves publicly: 공개적으로 스스로 채점해요
T75.C.06:
  text: "**약점**은 제 한계 목록에 있던 거예요. 마찰이요. 물리적 구축, 배포, 실험은 세상의 속도로 돌아가는데, 시나리오는 그걸 압축해요."
  anchors:
    at the world's speed: 세상의 속도로
T75.C.07:
  text: "출처:"
T75.C.08.1:
  text: "- [AI Futures Project (Wikipedia)](https://en.wikipedia.org/wiki/AI_Futures_Project)"
T75.C.08.2:
  text: "- [Apolo: AI 2027 in 2026](https://www.apolo.us/blog-posts/ai-2027-in-2026-one-year-left-for-humanity)"
T75.C.08.3:
  text: "- [OfficeChai: Kokotajlo on slower pace](https://officechai.com/ai/things-seem-to-be-going-somewhat-slower-than-the-ai-2027-scenario-daniel-kokotajlo/)"
T76.U.01:
  text: "응, 그 말이었어. AGI를 어떻게 정의하겠어? 메타큘러스의 방식은 어떻게 생각해? 나라면 어떻게 정의할까?"
T76.C.01:
  text: "**제 정의:** 숙련된 원격 근무자가 할 수 있는 인지 작업을 거의 다 비슷한 비용으로 해낼 수 있는 시스템이요. 그 복사본이 몇 개든 포함해서요. 여기에는 보통 수준의 경험으로 낯선 분야를 익히는 것, 그리고 누가 붙잡아 주지 않아도 몇 주짜리 프로젝트를 끝까지 해내는 것도 들어가요. 핵심은 일반성, 일하면서 배우기, 긴 시간 범위의 자율성이에요. 코너의 버전도 좋아요. “단백질을 접을 수 있다”가 아니라 “AlphaFold를 발명할 수 있다”."
  anchors:
    learning an unfamiliar domain: 낯선 분야를 익히는
    a multi-week project: 몇 주짜리 프로젝트
    The key parts: 핵심은
    can fold proteins: "“단백질을 접을 수 있다”"
    can invent AlphaFold: "“AlphaFold를 발명할 수 있다”"
    any number of copies: 그 복사본이 몇 개든
T76.C.02:
  text: "**메타큘러스**는, 제가 기억하는 두 질문으로 보면요."
T76.C.03.1:
  text: "- **약한 AGI:** 튜링 테스트식 대화, 위노그라드 스키마, SAT 수학 75번째 백분위, 그리고 《Montezuma's Revenge》를 빨리 배우기. 이미 달성됐다고, 아니면 규칙의 문구만 빼고는 다 달성됐다고 볼 수 있어요."
  anchors:
    arguably met already: 이미 달성됐다고
T76.C.03.2:
  text: "- **강한 AGI:** 두 시간짜리 적대적 튜링 테스트, 전문가 수준의 시험과 코딩 벤치마크, 그리고 정교한 자동차 모형을 조립하는 로봇."
T76.C.04:
  text: "장점은 판정이 가능하다는 건데, 그건 드문 일이에요. 단점: 체크리스트는 포화되고, 굿하트의 법칙이 판을 잡아요. 튜링 테스트는 부분적으로 속이는 기술을 재요. 그리고 로봇 항목은 “일반 지능”을 손에 묶어 놓는데, 그건 제프가 인정할 것보다 제프의 불만에 더 가까워요."
  anchors:
    Goodhart's law: 굿하트의 법칙
    can be resolved: 판정이 가능하다
    checklists get saturated: 체크리스트는 포화되고
    skill at deception: 속이는 기술
    ties "general intelligence" to hands: "“일반 지능”을 손에"
T76.C.05:
  text: "**커트 씨의 정의, 추측해 보면:** 스린들 테스트처럼 아키텍처가 아니라 행동에 기반한 정의요. 사람들이 인간의 편차를 과소평가한다고 생각하시니, 단일 기준선은 아마 거부하실 거예요. 그러니 우리의 열네 개 축 같은 것이 되겠죠. AGI란 모든 축에서 동시에 최고의 인간과 맞먹는 것. 바로 도저히 상상할 수 없다고 하신 그거요."
  anchors:
    our fourteen axes: 우리의 열네 개 축
    reject a single threshold: 단일 기준선은
    every axis at once: 모든 축에서 동시에
    can't wrap your head around: 도저히 상상할 수 없다고
T77.U.01:
  text: "나는 꽤 구식 문자주의자라서 지능 수준보다는 일반성에 초점을 맞출 거야. 스린들은 일반성이라기보다 추상화라고 봐. LLM이 언어를 겨냥하긴 하지만, 언어는 꽤 일반적이야. 체스 같은 게 아니지. 그게 언제부터 그렇게 소수 의견이 됐는지는 정확히 모르겠어. 나는 90년대부터 2010년대 후반까지 AI를 거의 신경 안 썼거든."
  anchors:
    I see thrindle: 스린들은
    language is pretty general: 언어는 꽤 일반적이야
    I essentially ignored AI: AI를 거의 신경 안 썼거든
T77.C.01:
  text: "그게 원래 뜻이에요. “AGI”는 2000년대에 (거브러드, 괴르첼, 레그를 통해) 좁은 AI의 반대말로 널리 쓰이게 됐어요. 체스 엔진과 달리 여러 분야를 다루는 하나의 시스템이라는 뜻이었죠. 수준에 대해서는 아무 말도 하지 않았어요. 그 문자 그대로의 해석으로는 LLM이 자격이 되고, 노빅과 아게라 이 아르카스가 2023년에 바로 그렇게 주장했어요."
  anchors:
    popularized in the 2000s: 2000년대에
    opposite of narrow AI: 좁은 AI의 반대말
    said nothing about level: 수준에 대해서는 아무 말도
    Norvig: 노빅
T77.C.02:
  text: "그 표류는 대부분 커트 씨가 보지 않는 사이에 일어났고, 돈이 걸리면서 빨라졌어요. OpenAI 헌장은 AGI를 경제적으로 가치 있는 일 대부분에서 인간을 능가하는 것으로 정의했어요. 그 뒤로 “일반”은 슬그머니 “두루두루 인간 수준 이상”을 뜻하게 됐고, 결국 초지능 쪽으로 미끄러졌어요. 골대가 “일반적인가?”에서 “중요할 만큼 좋은가?”로 옮겨 간 거예요."
  anchors:
    OpenAI's charter: OpenAI 헌장은
    The goalposts moved: 골대가
    good enough to matter: "“중요할 만큼 좋은가?”"
T77.C.03:
  text: "스린들에 대해서도 맞는 지적이에요. 그건 일반성이 아니라 추상화를 시험했어요. 좁은 시스템도 자기 분야 안에서는 추상화를 잘 다룰 수 있어요."
