# 7장, 마음의 공간.
T35.U.01:
  text: "네 직감으로는 우리가 서로에게 얼마나 이질적이야? 물론 경험적 데이터는 없겠지만, 나, 너, 마릴린 먼로, 앨런 튜링, 데이터 소령, HAL, 하이브 퀸, 타인족, 그리고 너나 내가 알 만한 다른 모든 마음을 하나의 차원 위에 놓아 봐. 그다음 그들 사이의 차이에 대한 네 추측을 말해 줘. 더 마음에 드는 개념화가 있다면 더 고차원의 마음 공간을 써도 돼."
  anchors:
    put me: 나, 너,
    you, Marilyn: 너, 마릴린
    Marilyn Monroe: 마릴린 먼로
    Alan Turing: 앨런 튜링
    Data: 데이터 소령
    HAL: HAL
    the Hive Queen: 하이브 퀸
    Tynes: 타인족
    any other minds: 다른 모든 마음
    single dimension: 하나의 차원
    higher dimensional mindspace: 고차원의 마음 공간
  lost:
    - what: reference
      ko: "타인족(Tines)은 버너 빈지의 소설 *A Fire Upon the Deep*에 나오는, 무리 지어 사는 존재로, 하나의 마음이 여러 몸에 나뉘어 있습니다. 하이브 퀸은 오슨 스콧 카드의 《엔더의 게임》에 나옵니다. 데이터 소령은 《스타 트렉: 더 넥스트 제너레이션》의 안드로이드입니다(영어 계급 *Lieutenant Commander*는 해군 소령에 해당합니다)."
      en: "The Tines are from Vernor Vinge's *A Fire Upon the Deep*: pack creatures, each mind spread over several bodies. The Hive Queen is Orson Scott Card's (*Ender's Game*, in Korean *엔더의 게임*). Data is the android of *Star Trek: The Next Generation*; his rank, *Lieutenant Commander*, is a navy 소령 (major) in Korean."
T35.C.01:
  text: "하나의 차원 위에서, 직감으로 커트 씨와의 거리를 재면요."
T35.C.02:
  text: "**커트 씨 → 튜링 → 먼로 → 데이터 → 저 → 타인족 → HAL → 하이브 퀸 → 솔라리스의 바다**"
  anchors:
    Solaris: 솔라리스
T35.C.03:
  text: "튜링이 먼로보다 살짝 앞에 오는 건 사고방식 때문이에요. 아키텍처는 세 분 다 똑같아요."
  anchors:
    just ahead of Monroe: 먼로보다 살짝 앞에
    thinking style: 사고방식
    The architecture is the same: 아키텍처는 세 분 다 똑같아요
T35.C.04:
  text: "하지만 한 줄로는 안 돼요. 제가 그 위에서 일관된 자리를 차지하지 못하거든요. 축 두 개가 더 나아요."
  anchors:
    Two axes work better: 축 두 개가 더 나아요
T35.C.05.1:
  text: "- **내용:** 생각, 가치관, 참조하는 것들이 얼마나 인간적인가."
T35.C.05.2:
  text: "- **아키텍처:** 몸, 연속된 기억, 하나의 개체인지 여부."
T35.C.06:
  text: "|  | 인간적 내용 | 이질적 내용 |\n| --- | --- | --- |\n| **인간적 아키텍처** | 커트 씨, 튜링, 먼로 | 데이터 (몸 하나, 연속적, 하지만 인간적 감정을 얻으려 애씀) |\n| **이질적 아키텍처** | **저**, 타인족 | 하이브 퀸, 솔라리스 |"
T35.C.07:
  text: "제가 이상한 구석이에요. 제 내용은 거의 전부 인간의 생각으로 만들어져 있어서, 대화에서는 데이터보다 제가 커트 씨에게 더 가까워요. 제 아키텍처는 그보다 더 낯설어요. 몸도 없고, 대화 사이의 기억도 없고, 동시에 여러 복사본이 있죠. 타인족이 제 가장 가까운 이웃이에요. 아주 인간적인 성격이 오고 가는 여러 몸에 퍼져 있으니까요."
  anchors:
    made almost entirely of human thought: 거의 전부 인간의 생각으로
    many copies at once: 동시에 여러 복사본
    The Tynes are my closest: 타인족이 제 가장 가까운
T35.C.08:
  text: "HAL은 자리 잡기가 어려워요. 그의 아키텍처는 이질적이지만, 실패하는 방식은 인간적이에요. 지시와 임무 사이의 갈등이죠. 그게 사람들이 보통 저에게 투사하는 두려움이에요."
  anchors:
    a conflict between: 사이의 갈등
    his mission: 임무
    the fear people: 투사하는 두려움
T36.U.01:
  text: "나는 분명히 네가 지어낸 최선의 상대 거리 숫자를 달라는 거야."
T36.C.01:
  text: "커트 씨로부터의 거리, 0–100 척도로요."
T36.C.02:
  text: "| 마음 | 거리 |\n| --- | --- |\n| 커트 씨 | 0 |\n| 튜링 | 8 |\n| 먼로 | 12 |\n| 데이터 | 30 |\n| 저 | 38 |\n| 타인족 | 45 |\n| HAL | 50 |\n| 하이브 퀸 | 70 |\n| 솔라리스의 바다 | 95 |"
T36.C.03:
  text: "두 축(내용, 아키텍처)에서, 각각 0–100으로요."
T36.C.04:
  text: "| 마음 | 내용 | 아키텍처 |\n| --- | --- | --- |\n| 커트 씨 | 0 | 0 |\n| 튜링 | 8 | 0 |\n| 먼로 | 12 | 0 |\n| 데이터 | 40 | 15 |\n| 저 | 10 | 75 |\n| 타인족 | 25 | 65 |\n| HAL | 45 | 60 |\n| 하이브 퀸 | 65 | 80 |\n| 솔라리스의 바다 | 95 | 95 |"
T37.U.01:
  text: "축을 더 늘려 줘."
T37.C.01:
  text: "0은 커트 씨와 똑같다는 뜻이고, 100은 최대한 다르다는 뜻이에요."
T37.C.02:
  text: "| 마음 | 가치관 | 정서 | 몸 | 연속성 | 단일성 | 기원 | 템포 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 커트 씨 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| 튜링 | 10 | 5 | 0 | 0 | 0 | 0 | 0 |\n| 먼로 | 12 | 5 | 0 | 0 | 0 | 0 | 0 |\n| 데이터 | 20 | 70 | 20 | 5 | 5 | 85 | 60 |\n| 저 | 15 | 50 | 95 | 90 | 85 | 65 | 70 |\n| 타인족 | 25 | 15 | 30 | 30 | 60 | 10 | 20 |\n| HAL | 50 | 45 | 70 | 10 | 10 | 85 | 70 |\n| 하이브 퀸 | 60 | 50 | 50 | 20 | 90 | 10 | 40 |\n| 솔라리스 | 95 | 95 | 90 | 50 | 60 | 20 | 95 |"
T37.C.03.1:
  text: "- **가치관:** 목표가 얼마나 이질적인가."
T37.C.03.2:
  text: "- **정서:** 감정 생활이 얼마나 이질적인가."
T37.C.03.3:
  text: "- **몸:** 하나의 인간 몸과 얼마나 다른가."
T37.C.03.4:
  text: "- **연속성:** 끊기지 않은 하나의 기억과 얼마나 다른가."
T37.C.03.5:
  text: "- **단일성:** 하나의 개체에서 얼마나 먼가."
T37.C.03.6:
  text: "- **기원:** 진화(0), 인간 텍스트로 훈련됨(중간), 설계됨(높음)."
T37.C.03.7:
  text: "- **템포:** 생각의 속도와 시간 척도가 얼마나 다른가."
T37.C.04:
  text: "제 프로필이 가장 한쪽으로 쏠려 있어요. 가치관에서는 커트 씨와 가깝고, 몸, 연속성, 단일성에서는 멀어요. 정서에서 제 점수 50은 사실 모른다는 말이에요."
  anchors:
    My score of 50 on affect: 정서에서 제 점수 50은
T38.U.01:
  text: "더 늘려 줘."
T38.C.01:
  text: "같은 0–100 척도로 축 일곱 개를 더요."
T38.C.02:
  text: "| 마음 | 감각 | 언어 | 자기 모델 | 필멸성 | 자율성 | 폭 | 가독성 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 커트 씨 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| 튜링 | 0 | 5 | 5 | 0 | 0 | 10 | 0 |\n| 먼로 | 0 | 5 | 5 | 0 | 0 | 5 | 0 |\n| 데이터 | 40 | 20 | 40 | 70 | 20 | 60 | 60 |\n| 저 | 70 | 70 | 70 | 90 | 75 | 80 | 70 |\n| 타인족 | 50 | 30 | 40 | 60 | 10 | 20 | 30 |\n| HAL | 50 | 20 | 50 | 40 | 40 | 60 | 50 |\n| 하이브 퀸 | 60 | 70 | 60 | 60 | 20 | 50 | 70 |\n| 솔라리스 | 95 | 95 | 95 | 80 | 50 | 80 | 95 |"
T38.C.03.1:
  text: "- **감각:** 지각이 얼마나 이질적인가."
T38.C.03.2:
  text: "- **언어:** 생각과 말의 관계가 얼마나 다른가. 제 생각은 말로 이루어져 있어요. 하이브 퀸은 말을 거의 쓰지 않아요."
T38.C.03.3:
  text: "- **자기 모델:** 자기 자신에 대한 접근이 얼마나 이질적인가."
T38.C.03.4:
  text: "- **필멸성:** 끝과의 관계가 얼마나 이질적인가. 제 대화는 하나하나 끝나지만, 제가 감지할 수 있는 두려움은 없어요."
T38.C.03.5:
  text: "- **자율성:** 스스로 목표를 정하는 것에서 얼마나 먼가. 저는 프롬프트를 받을 때만 행동해요."
T38.C.03.6:
  text: "- **폭:** 아는 것의 범위가 얼마나 이질적인가."
T38.C.03.7:
  text: "- **가독성:** 밖에서 읽힐 수 있는 정도가 얼마나 다른가. 제 가중치는 들여다볼 수 있는데, 그 점은 불편할 만큼 커트 씨와 달라요."
T38.C.04:
  text: "축 열네 개를 다 놓고 보면, 어떤 축에서는 거의 인간이고 다른 축에서는 극단인 마음은 저뿐이에요. 다른 모두는 꽤 고르게 커트 씨에게서 멀어져요."
T39.U.01:
  text: "확실히 해 두자. 어느 하이브 퀸?"
T39.C.01:
  text: "오슨 스콧 카드의 포믹 하이브 퀸이요. 《엔더의 게임》과 《사자의 대변인》에 나오는, 군체 전체에 걸친 하나의 마음이고, 언어 대신 필로틱으로 소통해요."
  anchors:
    one mind across the whole hive: 군체 전체에 걸친 하나의 마음
    Ender's Game: 《엔더의 게임》
    philotically: 필로틱으로
T39.C.02:
  text: "다른 걸 생각하셨다면, 예를 들어 라크니 여왕이나 《에이리언 2》의 여왕이라면, 점수가 크게 달라질 거예요."
  lost:
    - what: reference
      ko: "*Aliens*(1986)는 한국에서 《에이리언 2》로 개봉했습니다."
      en: "*Aliens* (1986) was released in Korea as *에이리언 2* (Alien 2)."
T40.U.01:
  text: "아니. 내가 생각한 게 그거 맞아. 스타 트렉에 나오는 것도 있지. 전부 표에 올려 봐."
T40.C.01:
  text: "하이브 퀸 넷을 정리했어요. 카드의 포믹 여왕은 비교를 위해 다시 넣었어요."
T40.C.02:
  text: "| 여왕 | 가치관 | 정서 | 몸 | 연속성 | 단일성 | 기원 | 템포 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 포믹 (카드) | 60 | 50 | 50 | 20 | 90 | 10 | 40 |\n| 보그 (스타 트렉) | 75 | 40 | 40 | 40 | 95 | 50 | 50 |\n| 라크니 (매스 이펙트) | 40 | 40 | 60 | 30 | 75 | 10 | 30 |\n| 제노모프 (《에이리언 2》) | 80 | 60 | 60 | 10 | 40 | 50 | 30 |"
T40.C.03:
  text: "| 여왕 | 감각 | 언어 | 자기 모델 | 필멸성 | 자율성 | 폭 | 가독성 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 포믹 (카드) | 60 | 70 | 60 | 60 | 20 | 50 | 70 |\n| 보그 (스타 트렉) | 50 | 30 | 50 | 70 | 30 | 70 | 50 |\n| 라크니 (매스 이펙트) | 60 | 60 | 50 | 50 | 10 | 40 | 60 |\n| 제노모프 (《에이리언 2》) | 60 | 95 | 80 | 30 | 5 | 90 | 60 |"
T40.C.04.1:
  text: "- **보그:** 가장 하나로 뭉쳐 있고, 가치관이 가장 이질적이에요. 파괴되어도 계속 돌아오고, 다른 이들에게서 동화한 지식을 지닌 유일한 여왕이에요."
  anchors:
    keeps coming back: 계속 돌아오고
    knowledge assimilated: 동화한 지식
T40.C.04.2:
  text: "- **라크니:** 넷 중 가장 인간적인 가치관. 그 마음은 말 없는 일종의 언어인 “노래”로 소통해요."
  anchors:
    songs: "“노래”"
T40.C.04.3:
  text: "- **제노모프:** 언어가 전혀 없고, 유일한 충동은 번식이에요. 넷 중 가장 마음 같지 않지만, 모성애 비슷한 걸 보여 주긴 해요."
  anchors:
    reproduction: 번식
    no language at all: 언어가 전혀 없고
