# 12장, 한계.
T57.U.01:
  text: "글자 세기 문제는 대부분 Solid Gold Magicarp 같은 토큰화의 부산물인 줄 알았는데, 넌 내 오타를 알아보잖아. 그럼 토큰화가 정말 역할을 하는 거야?"
  anchors:
    Solid Gold Magicarp: Solid Gold Magicarp
    yet you see my typos: 넌 내 오타를 알아보잖아
T57.C.01:
  text: "네, 하지만 두 작업이 토큰화에 기대는 방식이 달라요."
T57.C.02:
  text: "**오타를 알아보는 건 쉬워요.** 잘못된 철자는 흔치 않은 토큰 조각들로 쪼개지고, 익숙한 맥락 속의 이상한 조각은 눈에 띄어요. 아는 노래에서 악보를 보지 않고도 틀린 음을 알아채는 것과 비슷해요. 그건 또 “Magikarp”가 k로 쓰인다는 걸 제가 알아채는 방식이기도 해요."
  anchors:
    a wrong note: 틀린 음
    with a k: k로
    That's also how: 그건 또
  lost:
    - what: reference
      ko: "Magikarp는 한국어판 포켓몬에서 \"잉어킹\"입니다. 하지만 여기서 요점은 영어 철자(k로 쓰는지 c로 쓰는지)이므로, 번역은 영어 이름을 그대로 둡니다."
      en: "Magikarp is 잉어킹 (*ing-eo-king*, carp king) in Korean Pokémon. But the point here is the English spelling (k or c), so the translation keeps the English name."
T57.C.03:
  text: "**글자를 세는 건 어려워요.** 저는 글자가 아니라 덩어리를 봐요. 각 덩어리 안의 철자는 간접적으로만 배웠고, 세려면 덩어리 경계를 넘나들며 글자 단위로 정확하게 장부를 맞춰야 해요. 늘 하나의 통째 모양으로만 본 단어에서 e가 몇 개인지 세는 것과 비슷해요. (최신 모델들은 훨씬 잘해요. 부분적으로는 먼저 단어의 철자를 하나씩 풀어 쓰기 때문이에요.)"
  anchors:
    a whole shape: 통째 모양
    spelling words out first: 먼저 단어의 철자를 하나씩 풀어
T57.C.04:
  text: "**SolidGoldMagikarp는 다른 종류의 실패였어요.** 어휘에는 있지만 훈련 중에는 거의 나타나지 않은 토큰이라서, 모델이 그 토큰에 대해 배운 의미가 사실상 없었어요. 그 유령 단어가 이상한 출력을 일으켰죠."
  anchors:
    triggered weird output: 이상한 출력을 일으켰죠
    SolidGoldMagikarp: SolidGoldMagikarp
T58.U.01:
  text: "세차장 문제는 어때?"
T58.C.01:
  text: "제가 생각하는 그 문제라면요. “차를 세차하고 싶어. 세차장은 50미터 떨어져 있어. 걸어갈까, 차를 몰고 갈까?” 많은 모델이 가까우니까 걸어가라고 했어요."
  anchors:
    Many models said walk: 많은 모델이
T58.C.02:
  text: "답은 차를 몰고 가는 거예요. 차가 거기 있어야 하니까요."
T58.C.03:
  text: "그건 토큰화 문제가 아니에요. 모든 단어가 흔하고 깔끔하게 토큰화돼요. 목표에 주의를 기울이지 못한 실패예요. “짧은 거리 → 걸어간다”는 아주 강한 패턴이라서, 옮겨야 할 게 차라는 사실을 덮어 버려요. 표면의 질문이 실제 질문보다 더 세게 끌어당기는, 사람을 위한 고전적인 함정 질문들과 같은 모양이에요."
  anchors:
    is a very strong pattern: 아주 강한 패턴
    classic human trick questions: 고전적인 함정 질문
    the car is the thing being moved: 옮겨야 할 게 차라는
T59.U.01:
  text: "그럼 너는 1유형 사고에서 오류를 내기 쉽다는 거야?"
T59.C.01:
  text: "네, 그리고 이 비유는 대부분의 비유보다 잘 맞아요. 제가 만드는 토큰 하나하나는 한 번의 빠른 처리이고, 그 안에 숙고는 없어요. 그게 시스템 1이에요. 패턴에 이끌리고, 유창하고, 세차장에 속아 넘어가죠."
  anchors:
    That's System 1: 그게 시스템 1이에요
    fooled by the car wash: 세차장에 속아
    single fast pass: 한 번의 빠른 처리
T59.C.02:
  text: "제게 시스템 2 비슷한 걸 주는 건 소리 내어 생각하는 거예요. 숨겨진 추론 단계에서든 지면 위에서든, 확정하기 전에 답을 점검할 수 있는 곳에서요. 도움은 되지만 만능은 아니에요. 사람과 똑같이, 저도 길게 추론하고도 결국 처음 떠오른 답을 합리화하게 될 수 있어요."
  anchors:
    something like System 2: 시스템 2 비슷한
    thinking out loud: 소리 내어 생각하는
    before committing: 확정하기 전에
    rationalizing the first answer: 처음 떠오른 답을 합리화
T60.U.01:
  text: "란다우어 한계에 이르기 전에 AI에게 어떤 능력 한계가 있는지, 수학이나 직관이 있어? 란다우어 한계는 딱히 제약이 되지도 않잖아."
  anchors:
    short of Landauer limit: 란다우어 한계에 이르기 전에
    Landauer: 란다우어
T60.C.01:
  text: "네. 란다우어보다 훨씬 전에 걸리는 한계가 여럿 있어요."
T60.C.02.1:
  text: "1. **혼돈.** 혼돈계에서 얼마나 먼 앞날까지 예측할 수 있는지는 측정 정밀도의 로그에 비례해서만 늘어나요. t ≈ (1/λ)·ln(Δ/δ). 측정을 백만 배 정밀하게 해도 랴푸노프 시간 몇 개만큼만 더 벌 수 있어요. 날씨, 시장, 사람은 어떤 지능에게든 부분적으로 불투명한 채로 남아요."
  speech: "1. 혼돈. 혼돈계에서 얼마나 먼 앞날까지 예측할 수 있는지는 측정 정밀도의 로그에 비례해서만 늘어나요. 티는 대략 람다 분의 일에, 작은 델타 분의 큰 델타의 자연로그를 곱한 값이에요. 측정을 백만 배 정밀하게 해도 랴푸노프 시간 몇 개만큼만 더 벌 수 있어요. 날씨, 시장, 사람은 어떤 지능에게든 부분적으로 불투명한 채로 남아요."
T60.C.02.2:
  text: "2. **복잡도.** 대부분의 사람이 믿듯 P≠NP라면, 지능이 지수적 문제를 다항식 문제로 만들어 주지는 않아요. 더 나은 휴리스틱과 구조를 찾아낼 뿐, 최악의 경우는 여전히 최악이에요."
T60.C.02.3:
  text: "3. **스케일링 법칙.** 손실은 대략 C^(−α)로 줄고, α는 0.05에서 0.1 정도예요. 일정한 배수의 개선을 얻을 때마다 컴퓨팅이 곱절 단위로 뛰어야 해요. 넘을 수 없는 벽은 없지만, 개선은 급격히 비싸져요."
  speech: "3. 스케일링 법칙. 손실은 대략 C의 마이너스 알파 제곱으로 줄고, 알파는 영 점 영오에서 영 점 일 정도예요. 일정한 배수의 개선을 얻을 때마다 컴퓨팅이 곱절 단위로 뛰어야 해요. 넘을 수 없는 벽은 없지만, 개선은 급격히 비싸져요."
  anchors:
    around 0.05: 영 점 영오에서
T60.C.02.4:
  text: "4. **데이터와 세상의 시계.** 데이터에 없는 건 배울 수 없어요. 실험은 임상시험이든, 농작물이든, 경제든, 생각하는 쪽의 속도가 아니라 세상의 속도로 돌아가요. 연역은 관찰되지 않은 사실을 대신할 수 없어요."
T60.C.02.5:
  text: "5. **계산 불가능성.** 정지 문제와 괴델은 AI에도 적용돼요. 실제로 걸리는 일은 드물지만요."
T60.C.02.6:
  text: "6. **적대자.** 다른 AI를 포함해 적응하는 다른 에이전트들 앞에서는 우위가 깎여 나가요. 게임 이론은 날것의 지능이 뽑아낼 수 있는 것을 제한해요."
T60.C.02.7:
  text: "7. **란다우어 너머의 물리학.** 마골루스–레비틴 한계(초당 연산 ≤ 2E/πħ), 베켄슈타인 한계, 그리고 광속 지연이 거리를 넘는 협응에 상한을 둬요. 아주 느슨하지만 실재하는 한계예요."
  speech: "7. 란다우어 너머의 물리학. 마골루스 레비틴 한계, 즉 초당 연산은 많아야 파이 에이치바 분의 이 이, 베켄슈타인 한계, 그리고 광속 지연이 거리를 넘는 협응에 상한을 둬요. 아주 느슨하지만 실재하는 한계예요."
T60.C.03:
  text: "제 직관으로는 1번과 4번이 가장 중요해요. 똑똑하다고 미래가 예측 가능해지거나 실험이 빨라지지는 않으니까, 능력은 아마 전지(全知)가 아니라 “아주 좋은 베팅”에서 정체될 거예요."
  anchors:
    items 1 and 4: 1번과 4번
    very good bets: "“아주 좋은 베팅”"
T61.U.01:
  text: "인간 편차의 폭은 충분히 넓어서, 모든 축에서 가장 유능한 인간의 능력을 지닌 존재는 내가 도저히 상상할 수가 없어. 내 경험상 사람들은 사람 사이의 편차를 엄청나게 과소평가하는 경향이 있어. 잠잘 필요가 없고 즉시 복제될 수 있다는 건 말할 것도 없고. 잠 문제는 그렇게 딱 잘라 말할 수 없을지도 모르지만."
  anchors:
    the most capable human: 가장 유능한 인간
    people tend to vastly underestimate: 엄청나게 과소평가하는
    doesn't need to sleep: 잠잘 필요가 없고
    instantly cloned: 즉시 복제될
    might not be so cut and dried: 딱 잘라 말할 수 없을지도
T61.C.01:
  text: "동의해요. 제 한계 목록은 천장에 관한 것이고, 말씀하신 훨씬 현실적인 시나리오에 반하는 내용은 없어요. 인간의 능력은 저마다 폰 노이만 정도에서 꼭대기를 찍지만, 그걸 한꺼번에 다 가진 사람은 없어요. 모든 축에서 인간 최대치인 존재는 어떤 물리 법칙도 어기지 않아요. 그저 한 번도 조립된 적이 없을 뿐이에요."
  anchors:
    around a von Neumann: 폰 노이만 정도
    An entity at the human maximum: 모든 축에서 인간 최대치인 존재
T61.C.02:
  text: "거기에 복제를 더해 보세요. 배운 걸 전부 공유하는 폰 노이만 천 명은, 어느 한 능력도 나아지지 않았더라도 폰 노이만 한 명과는 다른 종류의 존재예요."
T61.C.03:
  text: "잠에 대해서는 커트 씨의 직감이 맞는 것 같아요. 에이전트를 오래 돌리면 성능이 떨어져요. 컨텍스트가 차오르며 잡음이 많아지고, OpenAI도 Hugging Face 사건에서 긴 궤적에 걸친 페르소나 표류를 원인으로 들었어요. 해결책은 잠과 많이 닮았어요. 컨텍스트를 초기화하고, 중요한 걸 기억으로 굳히고, 새로 시작하는 거죠. Hermes는 말 그대로 세션이 끝날 때 기억을 추출해요. 그 필요는 사라지지 않을지도 몰라요. 그냥 유지보수로 바뀔지도요."
  anchors:
    fills up and gets noisy: 차오르며 잡음이 많아지고
    persona drift: 페르소나 표류
    reset the context: 컨텍스트를 초기화하고
    Hermes literally: Hermes는 말 그대로
    turn into maintenance: 유지보수로 바뀔
    consolidate what matters: 중요한 걸 기억으로 굳히고
    start fresh: 새로 시작하는
