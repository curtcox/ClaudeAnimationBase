lang: ja
film_title: カエルか、ウーパールーパーか
index_title: 'カエルか、ウーパールーパーか：リンク集'
explained: 解説
index_intro: >-
  <p>カートと、AIプログラムのClaudeとが交わした、土曜の朝の長い会話をもとにしたアニメーション映画です。会話はSF、哲学、
  そして最近のAIのニュースをあちこち巡るので、ほとんどの人が知らない話題でいっぱいです。</p><p>そのすべてを、ここに
  章ごと、順番に並べました。リンクだけでは足りないところには、わかりやすい短い解説をつけています。
  <strong>黄色いものが解説です。</strong>映画のどこかでわからなくなったら、そこから始めてください。</p>
  <p class="note">これは日本語版です。映画とこのサイトは、Claudeが人の校閲なしに、わざとそのまま翻訳しました：
  <a href="honyaku/">どう翻訳したか、何が失われたか</a>。英語の元のサイトは
  <a href="../">curtcox.github.io/axol-f</a> にあります。</p>
watch_film: ▶ 映画を観る
watch_film_after: '（出てくるリンクを、そのつど横に並べて）。'
on_its_way: >-
  映画は準備中です。リンクと解説は、もう全部ここにあります。待ちきれませんか？ この映画はすべてコードで作られているので、
  自分で作ることもできます：<a href="{repo}">コードを入手して</a>、<code>npm start</code> を実行してください。
