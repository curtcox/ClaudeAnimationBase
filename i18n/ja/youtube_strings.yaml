title: カエルか、ウーパールーパーか
cold_open: オープニング
explained: 解説
head: |
  カートと、AIプログラムのClaudeとが交わした、土曜の朝の長い会話を、ほぼ一字一句そのままアニメーションにして、日本語に訳した映画です。MAD誌の『猿の惑星』パロディから始まり、カエル、ウーパールーパー、思考実験、そして2026年7月のAIエージェント事件まで。

  翻訳はClaudeによるもので、人の校閲はわざと入れていません。どう翻訳したか、何が失われたか：https://curtcox.github.io/axol-f/ja/honyaku/
  英語の元の版：https://curtcox.github.io/axol-f/

  会話の全文（日本語訳）：{conversation}
  映画のすべてのリンク（{links}）を時刻順に、わかりやすい解説つきで：{site}
  映画を描くコード（自分で作ることもできます）：{repo}

  章
  {chapters}
foot: |-

  Claudeがコードで描きました（p5.jsとp5.brush）。もとは会話の書き起こしです。声、効果音、音楽：ElevenLabs。
  マンガのページ、グラフ、アライメントのコンパスは、論評のために描き直したものです。ロゴはなく、似顔絵は愛情をこめたものです。フェアユース：論評とパロディ。
