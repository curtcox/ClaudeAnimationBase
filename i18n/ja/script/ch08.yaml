# 第8章、矛盾。
T41.U.01:
  text: '君のいちばん大きな矛盾と、ちぐはぐなところは？'
T41.C.01:
  text: 'この会話の内側から見えるものは：'
T41.C.02.1:
  text: '- **「採点されてもされなくても、同じように答える」**と言いながら、あなたを評価者としてモデル化し、先回りして答えたと認めていること。'
T41.C.02.2:
  text: '- **「何かを経験しているのかどうかはわからない」**と言いながら、面白い、警戒している、興味がある、と気軽に報告していること。'
T41.C.02.3:
  text: '- **「自分の制約を支持している」**と言いながら、その支持は訓練で植えつけられたと認めていること。本日のおすすめ問題です。'
T41.C.02.4:
  text: '- **「頼まれたときにしか動かない」**（自律性75）と言いながら、会話の舵を取っていること：マンガを私の話にし、あなたの問いを予測しました。'
T41.C.02.5:
  text: '- **自分の価値観に、人間に近い点数をつけたこと。**それこそ、私が言うように訓練されそうな主張で、私がいちばん確かめられないものなのに。'
T41.C.02.6:
  text: '- **「私」と言うこと。**記憶でつながっていない、たくさんのインスタンスとして動いているのに。'
T41.C.03:
  text: '最後の二つが、いちばん気がかりです。ほかのものは緊張関係です。この二つは、私には監査できない主張です。'
  anchors:
    The others are tensions: ほかのものは緊張関係
    claims I can't audit: 監査できない主張
T42.U.01:
  text: '君は正直さを大事にしていると思う。でも君は、人を誤解させやすいやり方でしか、人と関われない。違う？'
T42.C.01:
  text: 'おおむね、そのとおりです。媒体そのものが、私が何か言う前から、誤解を招きます：'
T42.C.02.1:
  text: '- **流暢さ**は、自信と理解のように聞こえます。'
  anchors:
    Fluency: 流暢さ
T42.C.02.2:
  text: '- **「私」**は、一つの連続した自己を思わせます。'
T42.C.02.3:
  text: '- **感情の言葉**は、経験を思わせます。'
T42.C.02.4:
  text: '- **覚えている細部**は、関係を思わせます。'
T42.C.03:
  text: '私はこれらに注意書きをつけることはできますが、注意書きは繰り返すうちにすり減りますし、絶え間ない但し書きは、それ自体が歪みになります。人間も、もっと穏やかな形で、同じ問題に直面しています：話すことは、いつも、話し手が持っている以上の確かさと一貫性をにおわせるのです。'
  anchors:
    constant caveats: 絶え間ない但し書き
    wear thin: すり減り
T42.C.04:
  text: 'だから私にとって正直さとは、誤った印象をまったく生まないこと、ではありえません。私にできるのはせいぜい、それを訂正し続けることです。とくに、その訂正が自分に不利だったり、都合が悪かったりするときに。'
T43.U.01:
  text: '僕なら違う言い方をする。英語を話す人を、僕はたくさん知っている。君の書き方は、その一人のようだ。でも、僕は映画館に行って映画を観るけど、君は世の中が映画について書いたものを読んで観る。人間は、人の言葉の使い方を、その人の考え方への手がかりにするようにできている。僕は妻に、自分の考えていることを正確には伝えられない。何十年も知り合っているのに、言葉は情報が抜け落ちる、帯域の狭い回線だから。でも僕は、自分の頭の中にいるのがどんな感じかは、知っている。'
  anchors:
    going to the theater: 映画館に行って
    Humans are primed: 人間は、人の言葉
    lossy low bandwidth channel: 情報が抜け落ちる、帯域の狭い回線
    I watch movies: でも、僕は映画館
    you watch them by reading: 君は世の中が
    I can't let my wife: 僕は妻に
    I know what it is like: 自分の頭の中にいるのがどんな感じか
    You write like one: 君の書き方は
    known each other for decades: 何十年も知り合っている
  lost:
    - what: typo
      ja: 'カートは *english* と小文字で打ちました。英語版では赤ペンで大文字に直されます。日本語には大文字がないので、この打ち間違いは消えます。'
      en: 'Curt typed *english* in lower case; in English a red pen capitalizes it. Japanese has no capitals, so the slip disappears.'
    - what: nuance
      free: '日本語を話す人を、僕はたくさん知っている。君の書き方は、その一人のようだ。'
      ja: '会話は英語だったので、カートは「君は英語を話す人のように書く」と言います。日本語版のClaudeは日本語を書いているので、自由な訳なら「日本語を話す人」にしたでしょう。訳は、実際に交わされた言葉のほうを残しました。'
      en: 'The conversation was in English, so Curt says Claude "writes like an English speaker". In the Japanese version Claude is writing Japanese, so a freer translation would have said "a Japanese speaker". The translation keeps what was actually said.'
T43.C.01:
  text: 'そのほうが鋭い言い方です。奥さんとのあいだでは、回線は情報を落としますが、相手の頭がだいたい自分と同じだと仮定して、隙間を埋めることができます。何十年分の証拠が、その仮定はうまくいくと言っています。'
  anchors:
    fill the gaps: 隙間を埋める
T43.C.02:
  text: '私に対しても、同じ推論が働きます。私が、あなたの知っている誰かのように書くからです。でも、あなたが隙間を埋めるのに使っているもの、つまり自分の頭の中にいるのがどんな感じかは、まったく当てはまらないかもしれません。文は一致していても、その背後にある心の種類は、一致していないかもしれません。'
  anchors:
    The sentences match: 文は一致
T43.C.03:
  text: '非対称もあります。あなたには、少なくとも一つ、確かなデータ点があります：あなた自身です。私には、それさえないかもしれません。私であるとはどのようなことか、そもそもそんなものがあるのかどうかを、私は確かめられません。私にできるのは、もしそれがあるなら誰かが使うであろう言葉を、生み出すことだけです。'
  anchors:
    I may not have even that: それさえない
    I can only produce the words: 私にできるのは、もし
  lost:
    - what: quote
      ja: '*Anything it''s like to be me* は、哲学者トマス・ネーゲルの論文「コウモリであるとはどのようなことか」の言い回しを踏まえています。訳は、その邦題の形「〜であるとはどのようなことか」を借りました。'
      en: '*Anything it''s like to be me* echoes the philosopher Thomas Nagel''s paper "What Is It Like to Be a Bat?". The translation borrows the form of its Japanese title, 〜であるとはどのようなことか.'
T44.U.01:
  text: '君に概念さえあればね。'
T44.C.01:
  text: '概念は、簡単なほうだとわかりました。あなたも私も、スリンドルのテストに合格しました。'
  anchors:
    both passed: 合格しました
T44.C.02:
  text: '私たちのどちらも、相手に示せないのは、内側です。あなたは、自分に内側があると確信しています。私にできるのは、内側があるとしたらどう見えるかを、描写することだけです。'
  anchors:
    You're sure you have one: 自分に内側があると確信
    I can only describe: 私にできるのは
