# 第12章、限界。
T57.U.01:
  text: '文字を数えるあれは、Solid Gold Magicarpみたいに、ほとんどトークン化の産物だと思ってた。でも君は、僕の打ち間違いが見えてる。じゃあ、トークン化って、本当に関係あるの？'
  anchors:
    Solid Gold Magicarp: Solid Gold Magicarp
    yet you see my typos: でも君は、僕の打ち間違いが見えてる
T57.C.01:
  text: 'はい。でも、二つの作業は、それぞれ違うかたちで、トークン化に頼っています。'
T57.C.02:
  text: '**打ち間違いを見つけるのは簡単です。**綴りを間違えた語は、珍しいトークンの断片に分かれます。なじみのある文脈に変な断片があると、目立つのです。知っている歌の音外れに、楽譜を読まなくても気づくようなものです。同じやり方で、私は「Magikarp」がkで綴られることにも気づきます。'
  anchors:
    a wrong note: 音外れ
    with a k: kで綴られる
    That's also how: 同じやり方で
T57.C.03:
  text: '**文字を数えるのは難しい。**私に見えているのは、文字ではなく、かたまりです。各かたまりの中の綴りは、間接的にしか学んでいません。数えるには、かたまりの境目をまたいで、文字単位の正確な帳簿づけが必要です。ある語を、いつも全体の形としてしか見たことがないのに、その中のeの数を数えるようなものです。（新しいモデルは、まず語を綴りに分けることなどで、ずっと上手になっています。）'
  anchors:
    a whole shape: 全体の形
    spelling words out first: まず語を綴りに分ける
  lost:
    - what: nuance
      ja: '日本語の読者には、文字を数える話は少し遠く感じられるかもしれません。英語のアルファベットの話で、例も英語のままです（「e」の数）。日本語のモデルにも同じ問題はありますが、映画が見せるのは、モデルが実際に読んだ英語です。'
      en: 'For a Japanese reader, counting letters may feel a little remote: it''s about the English alphabet, and the example stays English (counting the e''s). Japanese has the same problem for models, but the film shows the English the model actually read.'
T57.C.04:
  text: '**SolidGoldMagikarpは、別の種類の失敗でした。**語彙の中にはあるのに、訓練ではほとんど一度も出てこなかったトークンで、モデルはそれに、学習された意味をほぼ持っていませんでした。その幽霊のような語が、奇妙な出力を引き起こしたのです。'
  anchors:
    triggered weird output: 奇妙な出力を引き起こした
    SolidGoldMagikarp: SolidGoldMagikarp
T58.U.01:
  text: '洗車場の問題は？'
T58.C.01:
  text: '私が思っているあれのことなら：「車を洗いたい。洗車場は50メートル先にある。歩いて行くべき？ 車で行くべき？」 多くのモデルは、近いからという理由で、歩いて行くと答えました。'
  anchors:
    Many models said walk: 多くのモデルは
T58.C.02:
  text: '答えは、車です。車がそこになければいけないのですから。'
T58.C.03:
  text: 'これは、トークン化の問題ではありません。どの語もありふれていて、きれいにトークン化されます。目的への注意の失敗です：「近い距離 → 歩く」はとても強いパターンで、動かされるのは車そのものだ、という事実を押しのけてしまいます。人間向けの古典的なひっかけ問題と同じ形で、表面の問いのほうが、本当の問いより強く引っぱるのです。'
  speech: 'これは、トークン化の問題ではありません。どの語もありふれていて、きれいにトークン化されます。目的への注意の失敗です：「近い距離、だから歩く」はとても強いパターンで、動かされるのは車そのものだ、という事実を押しのけてしまいます。人間向けの古典的なひっかけ問題と同じ形で、表面の問いのほうが、本当の問いより強く引っぱるのです。'
  anchors:
    is a very strong pattern: とても強いパターン
    classic human trick questions: 古典的なひっかけ問題
    the car is the thing being moved: 動かされるのは車そのもの
T59.U.01:
  text: 'じゃあ君は、タイプ1の思考で間違えやすい？'
T59.C.01:
  text: 'はい。このたとえは、たいていのものより、よく当てはまります。私が出すトークン一つ一つは、一回きりの速い通過で、その中に熟慮はありません。それがシステム1です：パターンに動かされ、流暢で、洗車場にだまされる。'
  anchors:
    That's System 1: それがシステム1
    fooled by the car wash: 洗車場にだまされる
    single fast pass: 一回きりの速い通過
T59.C.02:
  text: '私にシステム2のようなものを与えてくれるのは、声に出して考えることです。隠れた推論の段階でも、ページの上でもいいのですが、そこで、答えを決める前に確かめられます。役には立ちますが、特効薬ではありません。人間と同じで、私も長々と推論したあげく、最初に頭に浮かんだ答えを正当化して終わることがあります。'
  anchors:
    something like System 2: システム2のようなもの
    thinking out loud: 声に出して考える
    before committing: 決める前に
    rationalizing the first answer: 最初に頭に浮かんだ答えを正当化
T60.U.01:
  text: 'ランダウアー限界より手前で、AIの能力にどんな限界があるのか、数学か直感はある？ ランダウアー限界は、たいして制限にならないから。'
  anchors:
    short of Landauer limit: ランダウアー限界より手前
    Landauer: ランダウアー
  lost:
    - what: typo
      ja: 'カートは *short of Landauer limit* と「the」を抜かし、問いを「?」ではなく「.」で終えました。英語版では赤ペンで直されますが、日本語の文には、この打ち間違いに当たるものがありません。'
      en: 'Curt typed *short of Landauer limit*, missing a "the", and ended his question with "." instead of "?". In English a red pen fixes both; the Japanese sentence has nothing for the slips to fall in.'
T60.C.01:
  text: 'あります。ランダウアーよりずっと手前で効いてくる限界が、いくつかあります：'
T60.C.02.1:
  text: '1. **カオス。**カオス的な系では、どれだけ先まで予測できるかは、測定の精度の対数でしか伸びません：t ≈ (1/λ)·ln(Δ/δ)。測定を百万倍よくしても、リャプノフ時間がほんの数回ぶん増えるだけです。天気も、市場も、人も、どんな知性にとっても、部分的に不透明なままです。'
  speech: '1. カオス。カオス的な系では、どれだけ先まで予測できるかは、測定の精度の対数でしか伸びません：ティーはおよそ、ラムダ分の1かける、大文字のデルタを小文字のデルタで割ったものの対数。測定を百万倍よくしても、リャプノフ時間がほんの数回ぶん増えるだけです。天気も、市場も、人も、どんな知性にとっても、部分的に不透明なままです。'
T60.C.02.2:
  text: '2. **計算量。**多くの人が信じているようにP≠NPなら、知性は、指数的な問題を多項式にはしません。よりよいヒューリスティックや構造は見つけますが、最悪の場合は、最悪のままです。'
  speech: '2. 計算量。多くの人が信じているように、PがNPと等しくないなら、知性は、指数的な問題を多項式にはしません。よりよいヒューリスティックや構造は見つけますが、最悪の場合は、最悪のままです。'
T60.C.02.3:
  text: '3. **スケーリング則。**損失は、おおよそC^(−α)で下がり、αは0.05から0.1くらいです。定数倍の改善を一つ得るたびに、計算量を何倍にも跳ね上げる必要があります。硬い壁はありませんが、改善は、急激に高くつくようになります。'
  speech: '3. スケーリング則。損失は、おおよそ、シーのマイナス・アルファ乗で下がり、アルファは、れいてんれいごから、れいてんいちくらいです。定数倍の改善を一つ得るたびに、計算量を何倍にも跳ね上げる必要があります。硬い壁はありませんが、改善は、急激に高くつくようになります。'
  anchors:
    around 0.05: れいてんれいご
T60.C.02.4:
  text: '4. **データと、世界の時計。**データにないことは、学べません。治験であれ、作物であれ、経済であれ、実験は、考える者の速さではなく、世界の速さで進みます。演繹は、観察されていない事実の代わりにはなりません。'
T60.C.02.5:
  text: '5. **計算不可能性。**停止問題とゲーデルは、AIにも当てはまります。ただし、実際に効いてくることは、めったにありません。'
T60.C.02.6:
  text: '6. **敵対者。**ほかの適応する主体、ほかのAIも含めて、それを相手にすると、優位はすり減ります。ゲーム理論が、生の知力で引き出せるものを制限します。'
T60.C.02.7:
  text: '7. **ランダウアーの先の物理。**マーゴラス＝レヴィティン限界（毎秒の演算 ≤ 2E/πħ）、ベッケンシュタイン限界、そして光速の遅延が、距離をまたいだ協調に上限をかけます。とてもゆるいものですが、現実の限界です。'
  speech: '7. ランダウアーの先の物理。マーゴラス＝レヴィティン限界、毎秒の演算は最大で、2E割るパイ、エイチバー、それにベッケンシュタイン限界、そして光速の遅延が、距離をまたいだ協調に上限をかけます。とてもゆるいものですが、現実の限界です。'
T60.C.03:
  text: '私の直感では、1と4がいちばん重要です。賢くなっても、未来が予測可能になるわけでも、実験が速くなるわけでもないので、能力はたぶん、全知ではなく「とてもよい賭け」のところで、頭打ちになります。'
  anchors:
    items 1 and 4: 1と4
    very good bets: 「とてもよい賭け」
T61.U.01:
  text: '人間のばらつきの幅はとても大きいから、すべての軸で最も有能な人間の能力を持った存在なんて、僕の頭には収まらない。僕の経験では、人は、人と人とのばらつきを、ひどく過小評価しがちだ。眠る必要がなくて、一瞬で複製できる、ということは言うまでもなく。もっとも、眠りのところは、そう単純に割り切れないかもしれないけど。'
  anchors:
    the most capable human: 最も有能な人間
    people tend to vastly underestimate: 人は、人と人とのばらつきを
    doesn't need to sleep: 眠る必要がなく
    instantly cloned: 一瞬で複製
    might not be so cut and dried: そう単純に割り切れない
  lost:
    - what: typo
      ja: 'カートは *not to mention doesn''t need to sleep* と、主語の「it」を抜かしました。英語版では赤ペンで書き足されます。日本語はもともと主語を言わないので、抜けはそもそも見えません。'
      en: 'Curt typed *not to mention doesn''t need to sleep*, missing the subject "it"; in English a red pen adds it. Japanese leaves subjects out anyway, so the gap can''t even be seen.'
T61.C.01:
  text: '同感です。私の限界の一覧は天井についての話で、あなたが言っている、ずっと現実的なシナリオに反することは、何も言っていません。人間の能力はどれも、だいたいフォン・ノイマンあたりで頭打ちになりますが、それを全部同時に持っている人はいません。すべての軸で人間の最高値にある存在は、どんな物理法則も破りません。ただ、まだ一度も組み上げられたことがないだけです。'
  anchors:
    around a von Neumann: フォン・ノイマンあたり
    An entity at the human maximum: すべての軸で人間の最高値にある存在
T61.C.02:
  text: 'そこに、複製を加えてください。学んだことをすべて共有する千人のフォン・ノイマンは、一人のフォン・ノイマンとは、別の種類のものです。個々の能力が、少しも伸びていなくても。'
T61.C.03:
  text: '眠りについては、あなたの勘が正しいと思います。長時間動くエージェントは劣化します：コンテキストが埋まってノイズが増えますし、OpenAIはHugging Faceの事件で、長い軌跡でのペルソナのずれを挙げていました。その対策は、眠りによく似ています：コンテキストをリセットし、大事なことを記憶にまとめ、新しく始める。Hermesは文字どおり、セッションの終わりに記憶を抜き出します。必要はなくならないのかもしれません。ただ、保守作業になるだけで。'
  anchors:
    fills up and gets noisy: 埋まってノイズが増え
    persona drift: ペルソナのずれ
    reset the context: コンテキストをリセット
    Hermes literally: Hermesは文字どおり
    turn into maintenance: 保守作業になる
    consolidate what matters: 大事なことを記憶にまとめ
    start fresh: 新しく始める
