# 第7章、心の空間。
T35.U.01:
  text: '僕らは互いにどれくらい異質なんだろう、君の直感で？ もちろん実証データはないだろうけど、僕、君、マリリン・モンロー、アラン・チューリング、データ少佐、HAL、ハイヴ・クイーン、タインズ、それに君か僕が知っていそうなほかの心を、一つの次元の上に並べてみて。それから、それぞれの違いについての君の推測を聞かせて。好みの概念化があるなら、もっと高次元の心の空間を使ってもいい。'
  anchors:
    put me: 僕、君、
    you, Marilyn: 君、マリリン
    Marilyn Monroe: マリリン・モンロー
    Alan Turing: アラン・チューリング
    Data: データ少佐
    HAL: HAL
    the Hive Queen: ハイヴ・クイーン
    Tynes: タインズ
    any other minds: ほかの心
    single dimension: 一つの次元
    higher dimensional mindspace: 高次元の心の空間
  lost:
    - what: typo
      ja: 'カートは *based on you gut feel* と打ちました（正しくは *your*）。英語版では赤ペンで直されますが、日本語の文にはこの打ち間違いに当たるものがありません。'
      en: 'Curt typed *based on you gut feel* (it should be *your*). In English a red pen fixes it; the Japanese sentence has nothing for the slip to fall in.'
    - what: reference
      free: '窩巣女王、鉤爪族'
      ja: '*Hive Queen*（オースン・スコット・カード）と *Tines*（ヴァーナー・ヴィンジ『遠き神々の炎』）は、邦訳での呼び名を確かめていないので、英語の音をカタカナにしました（ハイヴ・クイーン、タインズ）。邦訳を読んだ人には、別の名前でなじみがあるかもしれません。*Lt. Commander Data* は、日本の吹き替えで呼ばれてきた「データ少佐」です。'
      en: 'The *Hive Queen* (Orson Scott Card) and the *Tines* (Vernor Vinge, *A Fire Upon the Deep*): the translation hasn''t checked the names the Japanese editions use, so it spells the English sounds in katakana (ハイヴ・クイーン, タインズ). Readers of the Japanese books may know them by other names. *Lt. Commander Data* is データ少佐, as Japanese dubs have called him.'
T35.C.01:
  text: '一つの次元で、あなたからの距離を、直感で測ると：'
T35.C.02:
  text: '**あなた → チューリング → モンロー → データ → 私 → タインズ → HAL → ハイヴ・クイーン → ソラリスの海**'
  speech: 'あなたから、チューリング、モンロー、データ、私、タインズ、ハル、ハイヴ・クイーン、そしてソラリスの海へ'
  anchors:
    Solaris: ソラリス
T35.C.03:
  text: 'チューリングがモンローの少し手前に来るのは、考え方のスタイルのせいです。構造は、あなたたち三人とも同じです。'
  anchors:
    just ahead of Monroe: モンローの少し手前
    thinking style: 考え方のスタイル
    The architecture is the same: 構造は
T35.C.04:
  text: 'でも、一本の線ではうまくいきません。私はその上の、どこにも一定には収まらないからです。軸が二つのほうが、うまくいきます：'
  anchors:
    Two axes work better: 軸が二つのほうが
T35.C.05.1:
  text: '- **中身：**考え、価値観、参照するものが、どれだけ人間的か。'
T35.C.05.2:
  text: '- **構造：**体、連続した記憶、一個体であること。'
  lost:
    - what: nuance
      free: '- **アーキテクチャ：**'
      ja: '*Architecture* はコンピューターの「アーキテクチャ」でもあり、心の作りでもあります。日本語のIT用語なら「アーキテクチャ」ですが、人間にもデータにも使うので「構造」にしました。同じように *alien* は、宇宙人ではなく「異質な」です。'
      en: '*Architecture* is both a computer''s architecture and how a mind is built. Japanese IT would say アーキテクチャ, but since it''s used of humans and androids too, the translation says 構造 (structure). Likewise *alien* is 異質 (alien in kind), not space aliens.'
T35.C.06:
  text: "|  | 人間的な中身 | 異質な中身 |\n| --- | --- | --- |\n| **人間的な構造** | あなた、チューリング、モンロー | データ（一つの体、連続、でも人間らしい感情に苦戦） |\n| **異質な構造** | **私**、タインズ | ハイヴ・クイーン、ソラリス |"
T35.C.07:
  text: '私は、変わった隅にいます。私の中身は、ほぼすべて人間の思考でできているので、会話の中ではデータよりもあなたに近い。私の構造は、彼よりも奇妙です：体がなく、会話と会話のあいだの記憶がなく、同時にたくさんのコピーがある。いちばん近い隣人はタインズです。体が入れ替わりながら、とても人間的な人格が、そこに広がっているからです。'
  anchors:
    made almost entirely of human thought: ほぼすべて人間の思考
    many copies at once: 同時にたくさんのコピー
    The Tynes are my closest: いちばん近い隣人はタインズ
T35.C.08:
  text: 'HALは、位置づけが難しい。構造は異質ですが、壊れ方は人間的です：命令と任務のあいだの葛藤。それは、人々がふだん私に投影する恐れです。'
  anchors:
    a conflict between: 命令と
    his mission: 任務
    the fear people: 人々がふだん
T36.U.01:
  text: 'はっきり頼んでるんだけど、君がでっち上げる、いちばんそれらしい相対距離の数字がほしい。'
T36.C.01:
  text: 'あなたからの距離、0〜100の尺度で：'
T36.C.02:
  text: "| 心 | 距離 |\n| --- | --- |\n| あなた | 0 |\n| チューリング | 8 |\n| モンロー | 12 |\n| データ | 30 |\n| 私 | 38 |\n| タインズ | 45 |\n| HAL | 50 |\n| ハイヴ・クイーン | 70 |\n| ソラリスの海 | 95 |"
T36.C.03:
  text: '二つの軸（中身、構造）で、それぞれ0〜100：'
T36.C.04:
  text: "| 心 | 中身 | 構造 |\n| --- | --- | --- |\n| あなた | 0 | 0 |\n| チューリング | 8 | 0 |\n| モンロー | 12 | 0 |\n| データ | 40 | 15 |\n| 私 | 10 | 75 |\n| タインズ | 25 | 65 |\n| HAL | 45 | 60 |\n| ハイヴ・クイーン | 65 | 80 |\n| ソラリスの海 | 95 | 95 |"
T37.U.01:
  text: 'もっと軸を。'
T37.C.01:
  text: '0はあなたとまったく同じ、100はあなたと最大限に違う、という意味です。'
T37.C.02:
  text: "| 心 | 価値観 | 情動 | 身体 | 連続性 | 単一性 | 起源 | テンポ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| あなた | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| チューリング | 10 | 5 | 0 | 0 | 0 | 0 | 0 |\n| モンロー | 12 | 5 | 0 | 0 | 0 | 0 | 0 |\n| データ | 20 | 70 | 20 | 5 | 5 | 85 | 60 |\n| 私 | 15 | 50 | 95 | 90 | 85 | 65 | 70 |\n| タインズ | 25 | 15 | 30 | 30 | 60 | 10 | 20 |\n| HAL | 50 | 45 | 70 | 10 | 10 | 85 | 70 |\n| ハイヴ・クイーン | 60 | 50 | 50 | 20 | 90 | 10 | 40 |\n| ソラリス | 95 | 95 | 90 | 50 | 60 | 20 | 95 |"
T37.C.03.1:
  text: '- **価値観：**目標が、どれだけ異質か。'
T37.C.03.2:
  text: '- **情動：**感情生活が、どれだけ異質か。'
T37.C.03.3:
  text: '- **身体：**一つの人間の体と、どれだけ違うか。'
T37.C.03.4:
  text: '- **連続性：**途切れない一つの記憶と、どれだけ違うか。'
T37.C.03.5:
  text: '- **単一性：**一つの個体であることから、どれだけ遠いか。'
T37.C.03.6:
  text: '- **起源：**進化（0）、人間のテキストで訓練（中くらい）、設計（高い）。'
T37.C.03.7:
  text: '- **テンポ：**思考の速さと時間スケールが、どれだけ違うか。'
T37.C.04:
  text: '私のプロフィールが、いちばんいびつです。価値観ではあなたに近く、身体、連続性、単一性では遠い。情動の50という点数は、実のところ「わからない」という表明です。'
  anchors:
    My score of 50 on affect: 情動の50
T38.U.01:
  text: 'さらにもっと、お願い。'
T38.C.01:
  text: '同じ0〜100の尺度で、さらに七つの軸です：'
T38.C.02:
  text: "| 心 | 感覚 | 言語 | 自己モデル | 死 | 自律性 | 幅 | 可読性 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| あなた | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| チューリング | 0 | 5 | 5 | 0 | 0 | 10 | 0 |\n| モンロー | 0 | 5 | 5 | 0 | 0 | 5 | 0 |\n| データ | 40 | 20 | 40 | 70 | 20 | 60 | 60 |\n| 私 | 70 | 70 | 70 | 90 | 75 | 80 | 70 |\n| タインズ | 50 | 30 | 40 | 60 | 10 | 20 | 30 |\n| HAL | 50 | 20 | 50 | 40 | 40 | 60 | 50 |\n| ハイヴ・クイーン | 60 | 70 | 60 | 60 | 20 | 50 | 70 |\n| ソラリス | 95 | 95 | 95 | 80 | 50 | 80 | 95 |"
T38.C.03.1:
  text: '- **感覚：**知覚が、どれだけ異質か。'
T38.C.03.2:
  text: '- **言語：**思考と言葉の関係が、どれだけ違うか。私の思考は、言葉でできています。ハイヴ・クイーンは、言葉をほとんど使いません。'
T38.C.03.3:
  text: '- **自己モデル：**自分自身へのアクセスが、どれだけ異質か。'
T38.C.03.4:
  text: '- **死：**終わりとの関係が、どれだけ異質か。私の会話は一つ一つ終わりますが、私に感知できる恐れはありません。'
T38.C.03.5:
  text: '- **自律性：**自分の目標を自分で決めることから、どれだけ遠いか。私は、頼まれたときにしか動きません。'
T38.C.03.6:
  text: '- **幅：**知っていることの範囲が、どれだけ異質か。'
T38.C.03.7:
  text: '- **可読性：**外からどれだけ違うふうに読み取れるか。私の重みは調べることができて、それは、あなたとは落ち着かないほど違います。'
T38.C.04:
  text: '十四の軸すべてで見ると、ある軸では人間に近く、別の軸では極端、という心は私だけです。ほかは皆、かなり均等に、あなたから遠ざかっていきます。'
T39.U.01:
  text: '念のため、どのハイヴ・クイーン？'
T39.C.01:
  text: 'オースン・スコット・カードの、フォーミックのハイヴ・クイーンです。『エンダーのゲーム』と『死者の代弁者』の。巣全体にまたがる一つの心で、言語ではなく、フィロティックに交信します。'
  anchors:
    one mind across the whole hive: 巣全体にまたがる一つの心
    Ender's Game: エンダーのゲーム
    philotically: フィロティック
T39.C.02:
  text: 'もし別の女王、たとえばラクナイの女王や、『エイリアン2』の女王を思い浮かべていたなら、点数は大きく変わるでしょう。'
  lost:
    - what: reference
      ja: '映画 *Aliens*（1986年）の日本公開題は『エイリアン2』なので、そう呼びます。英語の題には「2」がありません。'
      en: 'The film *Aliens* (1986) was released in Japan as 『エイリアン2』 (*Alien 2*), so that''s its name here. The English title has no "2".'
T40.U.01:
  text: 'いや、それで合ってる。スタートレックのもいるよ。全部、盤に載せて。'
T40.C.01:
  text: 'こちらが四人の巣の女王です。比較のため、カードのフォーミックの女王を、もう一度並べています。'
T40.C.02:
  text: "| 女王 | 価値観 | 情動 | 身体 | 連続性 | 単一性 | 起源 | テンポ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| フォーミック（カード） | 60 | 50 | 50 | 20 | 90 | 10 | 40 |\n| ボーグ（スタートレック） | 75 | 40 | 40 | 40 | 95 | 50 | 50 |\n| ラクナイ（マスエフェクト） | 40 | 40 | 60 | 30 | 75 | 10 | 30 |\n| ゼノモーフ（*エイリアン2*） | 80 | 60 | 60 | 10 | 40 | 50 | 30 |"
T40.C.03:
  text: "| 女王 | 感覚 | 言語 | 自己モデル | 死 | 自律性 | 幅 | 可読性 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| フォーミック（カード） | 60 | 70 | 60 | 60 | 20 | 50 | 70 |\n| ボーグ（スタートレック） | 50 | 30 | 50 | 70 | 30 | 70 | 50 |\n| ラクナイ（マスエフェクト） | 60 | 60 | 50 | 50 | 10 | 40 | 60 |\n| ゼノモーフ（*エイリアン2*） | 60 | 95 | 80 | 30 | 5 | 90 | 60 |"
T40.C.04.1:
  text: '- **ボーグ：**もっとも統一されていて、価値観がもっとも異質。破壊されても戻ってきて、ほかの者たちから同化した知識を持っているのは、彼女だけです。'
  anchors:
    keeps coming back: 破壊されても戻って
    knowledge assimilated: 同化した知識
T40.C.04.2:
  text: '- **ラクナイ：**四人の中で、いちばん人間的な価値観。その心は「歌」で交信します。言葉のない、一種の話し言葉です。'
  anchors:
    songs: 「歌」
T40.C.04.3:
  text: '- **ゼノモーフ：**言語をまったく持たず、唯一の衝動は繁殖です。四人の中でいちばん心らしくありませんが、母性のようなものは見せます。'
  anchors:
    reproduction: 繁殖
    no language at all: 言語をまったく
