<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawd studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
<script src="node_modules/qrcode-generator/qrcode.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script>
  // ?chapter=N loads that chapter's generated timeline (before config.js, which takes its length from it) and, after the
  // engine, its scene file; with no chapter, the kit's demo.
  window.CHAPTER_N = new URLSearchParams(location.search).get('chapter');
  if (CHAPTER_N) document.write(`<script src="src/gen/ch${CHAPTER_N.padStart(2, '0')}.js"><\/script>`);
</script>
<script src="src/gen/refs.js"></script>
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<!-- Frog or Axolotl: shared film pieces -->
<script src="src/qr.js"></script>
<script src="src/qr_styles.js"></script>
<script src="src/cast.js"></script>
<script src="src/sets.js"></script>
<script src="src/look.js"></script>
<script src="src/layout.js"></script>
<script src="src/timing.js"></script>
<script src="src/boards.js"></script>
<script src="src/comic.js"></script>
<script src="src/scene_kit.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<script src="src/scenes/style_sheets.js"></script>
<!-- your video: add a script per scene file, in order -->
<script>document.write(`<script src="src/scenes/${window.CHAPTER ? CHAPTER.scene : 'demo.js'}"><\/script>`);</script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
